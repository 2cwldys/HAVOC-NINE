// ts_assault.cfg -- ASSAULT. Loaded by the ts_assault plugin as each map loads; no need to exec it.
// The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone. A side's reinforcements (its pool of lives) and what a
// class costs are ts_matchmode's: tsm_pool_base, tsm_pool_perplayer and tsm_class_cost in ts_matchmode.cfg.


// ---- the mode -------------------------------------------------------------------

// 1: every map with capture points is played as Assault -- points placed in the map
// (entities named tsm_as_1 to tsm_as_24) or written to configs\tsm_assault_<map>.cfg with
// amx_tsm_as_add and amx_tsm_as_save. A map is named h9_as_<name>. 0: the mode is off
// everywhere, and such maps play as ordinary team elimination. A map that also has siege
// objectives stays a siege map either way, and a map with Uplink zones needs
// tsm_uplink_mode 0 in its mapconfig, as the shipped h9_as_ maps have.
tsm_assault_mode 0

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_assault "Assault"

// 0 (the default): Assault has no rounds. The first round that ends is the whole match: its winner wins
// the match and is rated for it, a draw is a drawn match, and the match bar and the chat say MATCH where
// the other modes say ROUND. 1: Assault is played in rounds like the other modes, best of tsm_rounds
// (ts_matchmode.cfg). A change takes effect within a second.
h9_assault_rounds 0


// ---- taking a point ---------------------------------------------------------------

// A point's reach across the floor in units, for a point that does not bring its own: a
// point entity or a config line without a radius. A brush point is as wide as its brush.
// An uplink zone is 128; a point is much wider because it is meant to be fought over.
tsm_as_radius 384

// Seconds for one player to take a point from neutral, standing in it with no living enemy
// there. A point the other side holds is first worn down to neutral, then taken: the same
// time for each. Both sides in it at once freezes it.
tsm_as_time 20

// How much faster each further player of the same side in the point takes it (0.5 is half
// again as fast for the second player, twice as fast for the third), and how many players
// count toward that at most.
tsm_as_speedup 0.5
tsm_as_maxcap 6

// What taking a point adds to its side's reinforcements, and whether the side's fallen then get
// a respawn wave at once (1) or wait for the next one (0).
tsm_as_capture_reinforcements 5
tsm_as_capture_wave 1

// 0 (the default): a point's respawn set is shut while an enemy is taking the point (standing in it, wearing its hold away), so a
// wave does not put the fallen into a point that is being lost; it opens again when the enemy is gone or beaten. A point both
// sides stand in keeps its set as it was. 1: the set stays open however the point is pressed.
tsm_as_spawn_under_attack 0


// ---- waves ----------------------------------------------------------------------

// Seconds between respawn waves, for both sides, while the mode runs. On an assault map this
// sets the waves, not tsm_respawn_wave. A map's mapconfig or a console change takes effect
// from the next round. A wave puts a side's dead back at the points it holds (spawn set N
// belongs to point N; see docs\CUSTOM_SPAWNPOINTS.txt, part 5).
tsm_as_wave 30
