// ts_ctf.cfg -- CAPTURE THE FLAG. Loaded by the ts_ctf plugin as each map loads; no need to exec it.
// The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone.


// ---- the mode -------------------------------------------------------------------

// 1: every map with both flag pads is played as Capture the Flag -- pads placed in the map
// (entities named tsm_flag_1 and tsm_flag_2) or written to configs\tsm_ctf_<map>.cfg with
// amx_tsm_cf_pad and amx_tsm_cf_save. A map is named h9_ctf_<name>. 0: the mode is off
// everywhere, and such maps play as ordinary team elimination. A map that also has siege
// objectives stays a siege map either way. TS's own capture game (the ctf_ and ctb_ maps)
// is not this mode and is not touched by it.
tsm_ctf_mode 0

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_ctf "Capture the Flag"

// 0 (the default): Capture the Flag has no rounds. The first round that ends is the whole match:
// its winner wins the match and is rated for it, a draw is a drawn match, and the match bar and
// the chat say MATCH where the other modes say ROUND. 1: it is played in rounds like the other
// modes, best of tsm_rounds (ts_matchmode.cfg). A change takes effect within a second.
h9_ctf_rounds 0


// ---- the game -----------------------------------------------------------------------

// Captures that win the round. At the clock the side with more captures wins it, and equal is a draw.
tsm_cf_caps 3

// Seconds before a flag that lies where it was dropped flies home on its own. Its own side
// takes it back at once by walking over it. 0: it stays where it lies.
tsm_cf_return 20

// 1: a carrier scores only while his own flag is at its pad, so a side whose flag has been taken
// must get it back first. 0: he scores at his pad whatever has become of his flag.
tsm_cf_needhome 1

// How near its pad, in units across the floor, a carrier must be to turn the enemy's flag in.
tsm_cf_pad_radius 72

// Whether the side that captured gets a respawn wave at once (1) for its fallen, or waits for the
// next one (0). The sides never run out of lives: every death waits for a wave.
tsm_cf_capture_wave 1

// 1: a bot takes and returns flags even with tsm_bot_objectives 0 (ts_matchmode.cfg): one that walks over a flag takes it, or brings its own
// side's back, as a person does. 0 (the default): a bot takes and returns flags only while tsm_bot_objectives is 1, when rcbot also sends it
// for them. With both at 0 the bots fight and the flags are the people's.
tsm_cf_bots 0

// What a capture and a return score a player is ts_matchmode's: tsm_score_capture and
// tsm_score_return in ts_matchmode.cfg.


// ---- waves ----------------------------------------------------------------------

// Seconds between respawn waves, for both sides, while the mode runs. On a flag map this
// sets the waves, not tsm_respawn_wave. A map's mapconfig or a console change takes effect
// from the next round.
tsm_cf_wave 20
