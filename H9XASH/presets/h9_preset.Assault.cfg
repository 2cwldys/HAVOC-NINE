// h9_preset.cfg -- the game-mode preset this server runs: Assault (docs\H9_PRESENCE.txt section 4d)
//
// h9_presets.bat puts this file in configs\ as h9_preset.cfg when the profile Assault is applied, with that
// profile's other files (plugins.ini, ts_matchmode.cfg ...). h9_presence.amxx runs it after h9_presence.cfg
// and tells havoc9.org the name in every report, so the server's plugins are checked against the official
// files of this game mode and the ones every mode shares, not against every mode's together. Leave the file
// out, or the name empty, and they are checked against every mode's list together.
//
// The name is the server's own word, like the list of files: it can narrow the check and never loosen it.
h9_preset "Assault"
