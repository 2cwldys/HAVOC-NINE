// h9_compete.cfg -- rated play on havoc9.org (h9_compete.amxx). The plugin executes this on
// every map. COMMANDS.txt lists these under RATED PLAY; docs\H9_COMPETITIVE.txt is the guide.
//
// The rule is xjiro's Competitive TS (compts): everyone starts at 1000; a kill +1 to the
// killer and -1 to the victim, a headshot +1 more, and +1 for each 100 points the victim is
// above the killer, half of which the victim loses too; a rated match +100 to each winner and
// -70 to each loser, a leaver and a side that forfeits included; 30 idle days cost 10 a day.
// Only players whose game proves their havoc9.org player id are rated (h9_presence's
// challenge, h9_presence_challenge 1, or the web client). The boards: havoc9.org/ladder/.
//
// Needs h9_presence.amxx with a live key above this plugin in plugins.ini.
// The TeamElimination preset: on.

// 1: this server's matches go to havoc9.org and are rated: its own table, its community's
// ladder when the community's staff count it, and the H9 ladder unless an H9 admin marks the
// server UNRANKED.
h9_compete 1

// auto: a ts_matchmode match wherever its match mode plays (Wave Survival included); TS's own
// game, one map one match, on every other map (stock ts_ maps, h9_dm_, h9_tdm_, h9_ctb_ and the
// rest, deathmatch or teamplay); off on roleplay maps. Or match, dm or off.
h9_compete_ladder auto

// 1: a joining player is told the server is rated, and everyone is told their rating when
// their ACCOUNT page shows it (SHOW MY PLAYTIME).
h9_compete_notice 1
