// ts_rtv.cfg -- Rock the Vote (ts_rtv.amxx). The plugin executes this on every map.
//
// A player types .rtv in chat; once 60% of the people on the server have, the map is put
// to a vote. Bots never count. .nominate <part of a map's name> puts a map on the next
// vote, .nominate alone lists them, and .unnominate takes a nomination back. The whole
// account is in COMMANDS.txt, under ROCK THE VOTE.
//
// Which maps a vote offers. With the match mode on for the map being played (tsm_enabled
// 1): H9's game-mode maps, every installed h9_ map that is not a roleplay one (h9_tsrp_,
// rp_ and the like). With it off -- a ts_ map, a roleplay map -- any other installed map.
// Never the map being played.

// 1 lets .rtv start a vote while a match is in progress. 0: not until the match is over;
// a match halted for uneven sides is still in progress.
tsm_rtv_in_match 0

// 1: a vote starts ten seconds after a match is played to its end, with the map being
// played kept as a choice, and a vote that nobody answers picks one of its maps at random.
// 0: no vote after a match, and a vote that nobody answers keeps the map.
tsm_rtv_auto 1

// Maps on a vote, 2 to 8.
tsm_rtv_maps 6

// How many nominations go on a vote, at most tsm_rtv_maps; 0 turns .nominate off. One per
// player -- a second replaces the first -- and once the vote has this many, no more are
// taken. A nomination is gone when its player leaves or the map changes.
tsm_rtv_nominations 4

// 0: on a roleplay map -- rp_ or tsrp_ at the start of its name, _rp_ or _tsrp_ inside it,
// h9_tsrp_hive among them -- .rtv, .unrtv, .nominate and .unnominate are answered "Rock the
// vote is off on roleplay maps.", and no vote starts there, the one after a match included.
// 1: a roleplay map is voted away from like any other.
tsm_rtv_roleplay 0
