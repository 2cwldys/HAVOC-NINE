// ts_uplink.cfg -- CAPTURE THE UPLINK. Loaded by the ts_uplink plugin as each map loads; no
// need to exec it. The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit it HERE, in D:\Downloads\TSM, or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone.


// ---- the mode -------------------------------------------------------------------

// 1: every map with control zones is played as Capture the Uplink -- zones placed in the
// map (entities named tsm_cap_1 to tsm_cap_9) or written to configs\tsm_uplink_<map>.cfg
// with amx_tsm_cap_add and amx_tsm_uplink_save. 0: the mode is off everywhere, and such
// maps play as ordinary team elimination. A map that also has siege objectives stays a
// siege map either way.
tsm_uplink_mode 0

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_uplink "Uplink"


// ---- taking a zone ----------------------------------------------------------------

// Seconds the uplink's carrier must stay inside a zone, with no living enemy in it, to
// take it. Leaving, dropping it, dying or an enemy stepping in starts it over.
tsm_cap_time 15

// A zone's radius in units, for a zone that does not bring its own: a point entity or a
// config line without one. A brush zone is as wide as its brush.
tsm_cap_radius 128

// What taking a zone gives back, as tsm_siege_rewardlives does for a siege objective:
//   1  the side that took it: its lives are SET to its class's count again, and its
//      fallen come back with its next wave
//   2  both sides
//   0  nothing
// Needs tsm_respawns 1 in ts_matchmode.cfg.
tsm_uplink_rewardlives 1


// ---- waves and the uplink ---------------------------------------------------------

// Seconds between respawn waves, for both sides, while the mode runs (in place of
// tsm_respawn_wave).
tsm_uplink_wave 30

// Seconds a dropped uplink lies untouched before it goes home to its point.
tsm_uplink_return 20
