; networking.ini -- how this H9XASH install finds and joins servers.
;
; Edit it with any text editor, then start the game with h9xash.bat. Every launch
; rewrites ts\xashcomm.lst and ts\networking_resolved.cfg from this file, so nothing
; else needs editing. xash.bat assemble never overwrites this file once it exists.
;
; Nothing in here is a secret. The Discord bot token lives only in ts_advertise.cfg
; on the server, and H9XASH never holds one.

[client]
; 0 = the server lists below, plus the FWGS public list. Needs no Steam. The default.
; 1 = also start the Steam broker, when steam\steam_broker.exe and steam\steam_api.dll
;     are both present. If either is missing, the launcher says so and carries on.
steam_broker=0

; Comma-separated base URLs of HTTP server lists. The game fetches
; <base>/v1/servers/ts from each one. Each line in those files is "ip host:port" for
; an Xash server, or "gs host:port" for a Steam hlds server. Empty = the FWGS list only.
list_static=

; The H9 list from the list bot (serverlist-bot\ in the TSM repo), once it is running.
list_bot=http://127.0.0.1:8081

[broker]
; Read only when steam_broker=1. Steam files the process under the AppID the broker
; starts with: 480 (Spacewar) is what MSR uses. 70 (Half-Life) is needed to join the
; stock Steam hlds, and that account must own Half-Life. "HAVOC 9" in Steam comes from
; the Non-Steam shortcut in README_H9XASH.txt, never from these numbers.
steam_appid=480
steam_browse_appid=480
