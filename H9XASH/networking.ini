; networking.ini -- how this H9XASH install finds and joins servers.
;
; Edit it with any text editor, then start the game with h9xash.bat. Every launch
; rewrites ts\xashcomm.lst and ts\networking_resolved.cfg from this file, so nothing
; else needs editing. xash.bat assemble never overwrites this file once it exists.
;
; Nothing in here is a secret. The Discord bot token lives only in ts_advertise.cfg
; on the server, and H9XASH never holds one.

[client]
; 0 = the server lists below. Needs no Steam. The default.
; 1 = also start the Steam broker, when steam\steam_broker.exe and steam\steam_api.dll
;     are both present. If either is missing, the launcher says so and carries on.
steam_broker=0

; Comma-separated base URLs of HTTP server lists. The game fetches
; <base>/v1/servers/ts from each one. Each line in those files is "ip host:port" for
; an Xash server, or "gs host:port" for a Steam hlds server. The engine's own FWGS list
; is never asked: it has no ts list, and only ever answered the Internet tab with an
; error. With this and list_bot both empty the Internet tab has nothing to ask; the LAN
; tab and connect still work.
list_static=

; The H9 list from the list bot (serverlist-bot\ in the TSM repo), hosted at havoc9.org
; behind its HTTPS. To try a list bot running on this PC instead, set
; list_bot=http://127.0.0.1:8081 (the port in its serverlist.ini), and set it back after:
; while that bot is not running, the Internet tab reports "cannot connect".
; LOCAL TEST: the server list bot on this PC (serverlist-bot\run.bat, 127.0.0.1:8081). Put the https line back before committing or shipping.
list_bot=https://havoc9.org/serverlist
;list_bot=http://127.0.0.1:8081

[broker]
; Read only when steam_broker=1. Steam files the process under the AppID the broker
; starts with: 480 (Spacewar) is what MSR uses. 70 (Half-Life) is needed to join the
; stock Steam hlds, and that account must own Half-Life. "HAVOC 9" in Steam comes from
; the Non-Steam shortcut in README_H9XASH.txt, never from these numbers.
steam_appid=480
steam_browse_appid=480

[server]
; Read by a dedicated server started with h9xash_server.bat (h9_heartbeat.ps1). Every two
; minutes it tells the H9 server list at heartbeat_url that it is up, so players see it in the
; Internet tab: the list takes the address the heartbeat comes from, asks the server for its
; info and lists it while it answers, so the server's UDP port must be open to the internet.
; heartbeat=0 turns it off, for a LAN or private server.
heartbeat=1
; LOCAL TEST: the server list bot on this PC (serverlist-bot\run.bat, 127.0.0.1:8081). Put the https line back before committing or shipping.
heartbeat_url=https://havoc9.org/serverlist
;heartbeat_url=http://127.0.0.1:8081

; The UDP port a server started here takes: a dedicated one (h9xash_server.bat and
; h9xash_server_debug.bat, whose heartbeat names it too) and Create Game (h9xash.bat and
; h9xash.sh pass it to the game). 27015 is the default; change it to run two servers on one
; PC, or for a network that blocks 27015, and open it in the firewall and the router. A
; -port given on a launcher's own command line wins.
port=27015

[process]
; The priority h9xash.bat, h9xash_server.bat and h9xash_server_debug.bat start HAVOC 9.exe at:
; Normal, AboveNormal or High. AboveNormal when this line is missing or holds anything else.
; It matters only while the PC is busy: Windows then gives the game the CPU first, and other
; programs wait. High suits a PC that does nothing but host. Realtime runs as High: a busy game
; at Realtime holds back Windows' own input, disk and network work. The game is never pinned to
; some cores; Windows runs it on any of them. h9xash.sh (Linux) does not read this line.
priority=AboveNormal
