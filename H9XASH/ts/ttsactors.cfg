// H9 text to speech: the voices on this machine and how to pick them. In the console:   exec ttsactors.cfg
//
// What speaks: when someone near you chats and the server has h9_texttospeech on, your game reads the line aloud. There are five kinds of speaker:
//   man     a model whose name does not say otherwise
//   woman   a model whose name holds fem, woman, women, girl or lady
//   mech    a Mech (a model with mech or ed209 in its name): the man's voice, slower and lower, through a robot filter
//   bot     a bot (robo or _bot in the name): the man's voice, faster and higher, through the robot filter
//   droid   a droid (droid in the name): spoken like a bot by the system voices; the Kokoro voices have a sound of their own for it
// and a speaker whose model is on the server's gas-mask list (h9_tts_gasmask.cfg) is heard through the mask, muffled, whichever kind he is.
//
// By default the game chooses: the best man's voice installed here for a man (a Natural or Neural voice ahead of a plain one), the best woman's for a
// woman, and gives each speaker who asked for no voice of his own a voice and a small step of pitch of his own. To choose yourself, give each
// kind the NUMBER of a voice from the list below (0 leaves it to the game):
//   cl_h9_tts_voice_man N      cl_h9_tts_voice_woman N      cl_h9_tts_voice_mech N      cl_h9_tts_voice_bot N
// (a Mech and a bot with no pick of their own use the man's). They are saved with your config.
//
// The Kokoro voices (Windows, optional): cl_h9_tts_engine auto speaks with neural voices that a helper program makes (the game starts it), and with
// the voices above, at once, for a line the helper cannot start within 3 seconds (or while it is not ready); kokoro uses only them and drops such a
// line; system (the default) uses only the voices above. The picks above do not apply to the Kokoro voices: each kind has a list of voices (ts\h9tts\voices.txt) and cl_h9_tts_myvoice picks from it. cl_h9_tts_threads N (0: the
// game chooses) sets the processor threads the helper uses, cl_h9_tts_state says how it is doing, cl_h9_tts_reload starts it again.
// docs\TEXT_TO_SPEECH.txt, 3e.
//
// Try one, with the picks you have set:
//   cl_h9_tts_test man Hello there           cl_h9_tts_test woman Hello there
//   cl_h9_tts_test mech Target acquired      cl_h9_tts_test bot Please step aside      cl_h9_tts_test droid Please step aside
//   cl_h9_tts_test man muffled Over here     (the gas mask: add the word muffled)
// The robot sound of the Mech and the bot: cl_h9_tts_robot 1 (0 turns it off). The browser version has no audio to filter, so there a Mech
// and a bot only differ in pitch and speed and a mask is a quieter, lower voice. Everything is off with cl_h9_tts 0; cl_h9_tts_volume sets how loud.
//
// What you hear: cl_h9_tts_muffle 1 (0 to 2: how strongly a gas mask muffles), cl_h9_tts_pan 1 (each voice in the ear it comes from),
// cl_h9_tts_maxvoices 4 (1 to 8 voices at once; a line beyond them waits for a voice and nobody is cut off), cl_h9_tts_individual 1 (a voice of
// his own for each speaker).
// How you sound to others: cl_h9_tts_myvoice N (0 to 99, the n-th voice of your kind on their machine; 0 leaves it to them) and
// cl_h9_tts_mydepth N (-10 deeper to 10 higher). cl_h9_tts_test speaks as you sound to others. More natural voices: docs\TEXT_TO_SPEECH.txt, 3d.
//
echo ------------------------------------------------------------
echo  H9 text to speech: the voices on this machine
cl_h9_tts_voices
echo  Pick: cl_h9_tts_voice_man N, _woman N, _mech N, _bot N   (0 = the game chooses)
echo  Try:  cl_h9_tts_test man|woman|mech|bot|droid [muffled] words
echo  Kokoro voices: cl_h9_tts_engine system|auto|kokoro   (cl_h9_tts_state shows how they are doing)
echo ------------------------------------------------------------
