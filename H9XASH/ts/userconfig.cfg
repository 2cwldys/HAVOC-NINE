// H9XASH: run at startup by the last line of config.cfg.
//
// Main-menu music. h9xash.bat writes menu_music_resolved.cfg on every launch with a
// random track from menu_music.txt. Xash has no "mp3 on" command; "mp3 loop" alone
// starts the track.

// The console and chat text in the main menu's purple (PROMPT_TEXT_COLOR in gfx\shell\colors.lst).
con_color "190 140 255"

// The console and chat font: ts\font0/1/2_cp1252.fnt (tools\make_con_fonts.py), which
// Xash loads with con_oldfont 0 because valve\ has no fonts.wad, ahead of extras.pk3's own.
// Drawn at their own size, 15, 18 and 22 px rows, picked by screen width: any other
// con_fontscale stretches them with nearest-pixel filtering and the letters go uneven.
con_oldfont "0"
con_fontscale "1.0"
// The Western codepage TS is written in: the fonts are font<N>_<con_charset>.fnt, and FWGS's
// own default, cp1251, is Cyrillic.
con_charset "cp1252"

wait 4
MP3Volume 0.060
volume 0.060
exec menu_music_resolved.cfg
exec menu_bg_video_resolved.cfg
// The server lists and the Steam ticket setting, from networking.ini. The launcher writes
// this file on every start.
exec networking_resolved.cfg

// This install's client id, from user_id.ini. The launcher writes this file on every
// start too -- see docs\CUSTOM_XASH_USERID.txt.
exec userid_resolved.cfg

// The TS HUD in H9 purple, the values the Steam install's config.cfg carries (stock
// 125 150 165). Set here because Xash starts from the stock config.cfg.
hud_r "190"
hud_g "160"
hud_b "255"

// The console and chat text in the main menu's purple (PROMPT_TEXT_COLOR in gfx\shell\colors.lst).
con_color "190 140 255"

// Discord rich presence is on by default, while the Discord desktop app is open.
// To turn it off, remove the // from the next line. See README_H9XASH.txt.
// ts_richpresence 0
