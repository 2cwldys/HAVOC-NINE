// h9_autoconfig map config for h9_tsrp_hive.
//
// This map carries no weapons at all: tsm_no_weapons sweeps every ts_groundweapon on
// the map once a second, map-authored or combat-dropped, with no radius limit -- see
// clean_all_weapons() in ts_matchmode.sma. Set back to 0 here (or delete this file) if
// the map should go back to normal weapon drops.

echo "[h9_autoconfig] h9_tsrp_hive.cfg applied"

tsm_no_weapons 1

// Roaming citizens (tsrp_roambots.sma): up to 32 RCBots who walk the hive at a walk, stop now
// and then, talk when they meet, and fight only whoever hurts them -- or, after an admin's
// .insurgency, the players. They need the patched RCBot (rcbot-patch CHANGE 8).
// tsrp_roambots.cfg sets these back on the next map; amx_roambots shows what they do.
tsrp_roambots 1
tsrp_roambots_count 32
