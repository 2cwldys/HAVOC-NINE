// h9_autoconfig map config for h9_up_drainage: Capture the Uplink at the drainage works.
//
// The uplink mode takes this map by its own zones (tsm_cap_1..3, placed in the map), and
// ts_matchmode places each side on its platform from configs/tsm_spawns_h9_up_drainage.cfg.
// What this file adds is the match the map is built for: a taken zone gives lives back
// and the fallen return with their wave, so respawns stay on, and the round is long
// enough to carry the uplink through the culverts to all three zones and hold them.
// ts_matchmode.cfg sets these back on the next map.

echo "[h9_autoconfig] h9_up_drainage.cfg applied"

tsm_respawns 1
tsm_roundtime 420
