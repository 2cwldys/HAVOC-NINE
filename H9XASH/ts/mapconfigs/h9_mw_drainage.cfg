// h9_autoconfig map config for h9_mw_drainage: Mech Warrior at the drainage works.
//
// The Mech Warrior mode takes this map by its name (h9_mw_): one Officer a side on two
// lives, as many Mechs as a side likes on three lives each, and every bot a Mech.
// ts_matchmode places each side on its platform from configs/tsm_spawns_h9_mw_drainage.cfg.
// What this file adds is the match the map is built for: the lives come back with each
// side's respawn wave, so respawns stay on, and the round is long enough for Mechs, slow
// as they are, to find each other through the culverts and the galleries.
// ts_matchmode.cfg sets these back on the next map.

echo "[h9_autoconfig] h9_mw_drainage.cfg applied"

tsm_respawns 1
tsm_roundtime 420
