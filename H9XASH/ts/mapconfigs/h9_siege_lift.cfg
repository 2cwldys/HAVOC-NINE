// h9_autoconfig map config for h9_siege_lift: the siege of the skylift.
//
// The Insurgents (side 2, tsm_obj_team) boarded underneath and must blow the tether
// clamps (cargo deck), cut the power core (passenger deck) and wreck the drive (top
// deck); MSR keep the lift climbing. ts_matchmode moves the Insurgents' respawns up
// the car as each objective falls (forward tiers in configs/tsm_spawns_h9_siege_lift.cfg).
// Each objective room has a Breacher-only door (tsm_breach_*: forced by name, no list
// needed), and two maintenance shafts open only to Combat Engineers (tsm_eng_door).
// ts_matchmode.cfg sets these back on the next map.

echo "[h9_autoconfig] h9_siege_lift.cfg applied"

tsm_obj_team 2
tsm_obj_msg_1 "KEEP THE LIFT CLIMBING|GUARD THE CLAMPS|GUARD THE POWER|GUARD THE DRIVE"
tsm_obj_msg_2 "STOP THE LIFT|BLOW THE CLAMPS|CUT THE POWER|WRECK THE DRIVE"
tsm_respawns 1
tsm_roundtime 480
