// h9_autoconfig map config for h9_ctf_drainage: Capture the Flag on the drainage works.
//
// The flag mode takes this map by its two pads (configs/tsm_ctf_h9_ctf_drainage.cfg). The map is a copy of h9_up_drainage. h9_up_drainage still carries that map's Uplink zones, so the Uplink mode is turned off here.
// ts_matchmode places each side on its base from configs/tsm_spawns_h9_ctf_drainage.cfg. ts_matchmode.cfg sets these back on the next map.

echo "[h9_autoconfig] h9_ctf_drainage.cfg applied"

tsm_uplink_mode 0
tsm_respawns 1
tsm_roundtime 600
