// Example h9_autoconfig map config.
//
// h9_autoconfig (default 1) execs "mapconfigs/<mapname>.cfg" shortly after a map loads,
// matched against the map's own name -- so for this file to actually run, the current
// map would need to be named h9_test_example. This one is just a template to copy: drop
// a file here named after any real map (e.g. h9_te_neuropolis.cfg) to have it applied
// automatically every time that map loads. Set h9_autoconfig 0 to opt out without
// removing these files.
//
// Put whatever cvars/commands this specific map should start with below.

echo "[h9_autoconfig] h9_test_example.cfg applied"

