// h9_autoconfig map config for h9_tsrp_newbyzantium: New Byzantium.
//
// Roaming citizens (tsrp_roambots.sma): RCBots who walk the city's public streets, halls and
// walkways at a walk, stop now and then, and never fight, so the city looks lived in. They keep
// to the roam waypoints the map's build lays in its public spaces only (never in homes, shops or
// MSR space), and appear spread across the districts. They need the patched RCBot (rcbot-patch
// CHANGE 8). tsrp_roambots.cfg sets these back on the next map; amx_roambots shows what they do.

echo "[h9_autoconfig] h9_tsrp_newbyzantium.cfg applied"

tsrp_roambots 1
tsrp_roambots_count 12
tsrp_roambots_weapons 0
tsrp_roambots_models "proletarian_healthy;proletarian;prole_fem;prole_bfem"
