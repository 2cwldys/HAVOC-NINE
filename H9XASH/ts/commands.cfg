echo " tsm_rtv_nominations       4          nominations a vote takes, at most"
echo "                                      tsm_rtv_maps; 0 turns .nominate off"
echo " tsm_rtv_roleplay          0          1 lets a roleplay map be voted away from;"
echo "                                      0: no .rtv, .nominate or vote on one"
echo
echo " FLOATING CHAT  (ts_floatchat.amxx; game.cfg sets its cvars)"
echo
echo " fc_enabled                1          float chat on: typing bubbles and words over"
echo "                                      heads; 0 off for everyone"
echo " fc_range                  900        how far away a talker's words still show"
echo " fc_hold                   5.0        seconds a line stays over a head"
echo " fc_rise                   24.0       how far above the eyes the bubble sits"
echo "                                      (it follows a duck, prone or a dive); the"
echo "                                      words rest just above it"
echo " fc_scale                  0.20       the bubble's size"
echo " fc_red, fc_green,         150, 215,  the words' colour"
echo " fc_blue                   255"
echo " fc_y_tweak                1.0        the words' height on a screen that is not 4:3"
echo " fc_self                   0          1: a player is sent his own words too,"
echo "                                      centred near the top of his screen. His"
echo "                                      own bubble sits over his head as anyone's"
echo "                                      does: seen in third person, out of a"
echo "                                      first-person view"
echo
echo " It shows a typing bubble over a player every time his chat line opens, and"
echo " takes it down when the line closes, however it closes: Enter, Escape, the"
echo " console, the menu, a map change. While the line stays open the engine says"
echo " so again every 2 seconds, and a bubble with no word for 5 seconds -- or"
echo " whose player dies, changes team or leaves -- comes down by itself, so one"
echo " lost word can never leave it hanging. No engine tells a server that by itself"
echo " -- messagemode and messagemode2 run on the client and are never sent on --"
echo " so the H9XASH engine sends the client command h9_typing 1 as the line opens"
echo " and h9_typing 0 as it closes (engine-h9-typing.patch), to a server whose"
echo " game registered the H9Typing user message, as ts_floatchat does; any other"
echo " server is sent nothing. A command and not a userinfo key: the engine's"
echo " userinfo flood penalty dropped a key that changed at every chat line, so"
echo " the bubble showed once and then not again for a while. An earlier H9XASH"
echo " that sent the key _h9typing is still understood. A Steam client sends"
echo " nothing and shows no bubble."
echo
echo " .bubbles                        (chat, while the plugin is loaded)"
echo "     Float chat off for you alone, or back on: no typing bubbles and no"
echo "     words over heads are sent to you at all. Remembered by your"
echo "     h9_clientid or authid (data\ts_floatchat_off.txt), so it holds on the"
echo "     next map and the next visit. setinfo _h9bubbles 0 in your"
echo "     userconfig.cfg keeps it off on every server and wins over .bubbles"
echo "     while it is set; setinfo _h9bubbles 1 keeps it on."
echo
echo " What it sends a viewer who has it on: a talker's words only while the"
echo " talker is within fc_range, in his sight and on his screen, for fc_hold"
echo " seconds after each line, three talkers at most -- up to ten times a second"
echo " while the words move on his screen and about five while they stand still,"
echo " each about 25 bytes plus the line. A 40-character line is some 300 to 650"
echo " bytes a second per talker on screen. A typing player's bubble is an"
echo " ordinary entity, a few bytes a tick while it animates. A viewer who has it"
echo " off is sent neither, and the server keeps no extra per-entity hook running"
echo " unless someone on it has it off."
echo
echo " WHO IS SHOWN. With the match mode on for the map (tsm_enabled 1), only a"
echo " player it draws as he is: alive and in the match, the round frozen, live or"
echo " just ended, and not cloaked (ts_matchmode's tsm_shown). Nobody eliminated,"
echo " spectating, in warmup or ready-up, at a match's end or under the Recon's"
echo " .cloak gets a bubble or words, and a bubble or a line already up comes down"
echo " the moment its player stops being shown. With the match mode off, every"
echo " living player."
