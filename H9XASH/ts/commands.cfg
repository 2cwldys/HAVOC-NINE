// commands.cfg -- generated from COMMANDS.txt by make_commands_cfg.ps1. Edit that file instead.
// Type exec commands in the game console to print the command reference.
echo "==============================================================================="
echo " TS MATCH MODE -- COMMAND REFERENCE"
echo " Plugins: ts_matchmode.amxx 1.56-assault1   ts_uplink.amxx 1.0-modes2"
echo "          ts_survival.amxx 1.0-modes2   ts_mechwarrior.amxx 1.0-modes2"
echo "          ts_assault.amxx 1.0-assault1"
echo "          h9_presence.amxx 1.9   h9_motd.amxx 1.0   tsrp_roambots.amxx 1.3"
echo "          h9_community.amxx 1.1   ts_rtv.amxx 1.0-h9.2   h9_compete.amxx 1.1"
echo "          ts_floatchat.amxx 1.0   h9_rank.amxx 1.0"
echo "          Apollo RP (ARP_*.amxx, apollo-rp\ORIGIN.txt)"
echo "==============================================================================="
echo
echo " Keep this file current. When a command or cvar is added, renamed or removed in"
echo " any of the plugins, change it here in the same edit -- a reference that is only"
echo " sometimes right is worse than none, because it gets trusted."
echo
echo " Every cvar is listed at the end, in CVAR REFERENCE: its default, and the"
echo " shipped .cfg's value where that differs. The full account of each is beside it"
echo " in its plugin's .cfg. Which game each map plays is under WHICH GAME A MAP PLAYS."
echo
echo
echo "==============================================================================="
echo " PLAYER COMMANDS  (typed in chat, available to everyone)"
echo "==============================================================================="
echo
echo " .menu"
echo "     Opens the menu of menus: pick a side, pick a class, match status."
echo "     The way back to anything dismissed by accident."
echo
echo " .team"
echo "     Opens the side menu (MSR / Insurrectionists / Spectate)."
echo "     During warmup this also RELEASES your current side first, so you can"
echo "     switch. Once a match is running it refuses -- sides are locked."
echo
echo "     Choosing Spectate is not a black screen: you get the same follow"
echo "     camera an eliminated player does. Your view stands with a living"
echo "     player and follows them, ATTACK (or attack2) moves you on to the"
echo "     next one, and because you have no side the cycle runs over BOTH"
echo "     teams -- an eliminated ghost is held to their own team, you watch"
echo "     everybody. If nobody is left alive to watch you are parked out of"
echo "     the way until someone stands up again. The click is a camera"
echo "     control, not a shot: it never reaches TS as one."
echo
echo " .class"
echo "     Opens the class menu, DURING THE FREEZE COUNTDOWN BEFORE A ROUND and at no"
echo "     other time. That is when the loadout is handed out, so it is the only"
echo "     moment a pick does anything."
echo
echo "     Outside it you are told why rather than shown a menu. A class chosen in"
echo "     warmup or ready-up used to be accepted, confirmed, and then thrown away by"
echo "     the match starting -- the menu worked and the choice did not."
echo
echo "     Note that a match HALTED for an uneven side sits in ready-up with the score"
echo "     intact, so 'we are in ready-up' does not mean no match is running. Picks"
echo "     are refused there too."
echo
echo "     Four classes have a job of their own:"
echo
echo "       Combat Engineer   +USE on a teammate resupplies them, every 30 seconds"
echo "                         (tsm_eng_cooldown). They glow YELLOW while it lands"
echo "                         and it is audible to anyone nearby. .turret stands"
echo "                         a sentry turret; +USE on one of your side's repairs"
echo "                         it."
echo "       Breacher          +USE forces a DOOR open -- and shows 'Breached.' --"
echo "                         that part is still one press, and doors only respond"
echo "                         when they were actually LOCKED ('Use Only' spawnflag)"
echo "                         or whose targetname is on one of the map's"
echo "                         tsm_breachdoor_# lists; an everyday unlocked door"
echo "                         gets stock TS behaviour and no message. On siege"
echo "                         objectives the Breacher is the only PLANTER: hold"
echo "                         +USE for the ten-second plant (a bar fills at the"
echo "                         centre of their screen), the satchel burns its fuse,"
echo "                         and the explosion is what takes the objective --"
echo "                         nothing falls on a single press of E. No other"
echo "                         class may plant; they can only destroy bodies that"
echo "                         CAN break, by gunfire and grenades. A same-side"
echo "                         player can never breach their own objective."
echo "                         Carries the Benelli M3."
echo "       Officer           Commands bots with .follow and .unfollow, and .scan"
echo "                         exposes cloaked enemies nearby. Carries the Laser"
echo "                         Rifle (H9's reTS), the Glock 18 and a Katana (the M4A1"
echo "                         in the Rifle's place on a game library without it, or"
echo "                         with h9_customweapons 0)."
echo "                         When an Officer is slain, both teams hear it"
echo "                         (tsm_officerslain_sound)."
echo "       Medic             +USE on a teammate heals them 50hp on a 15s cooldown,"
echo "                         capped at that teammate's own class health. They glow"
echo "                         RED while it lands, also audible nearby. Sidearm only,"
echo "                         no primary."
echo
echo "     Both of those sounds come off the player being worked on rather than being"
echo "     sent to the two involved, so the squad standing around them hears it too --"
echo "     that is the point of them."
echo
echo "     Two classes do something you do not press a key for:"
echo
echo "       Marksman          Barrett M82 and a Glock 20. On MSR they wear the"
echo "                         repughillie suit; an Insurrectionist marksman falls"
echo "                         back to that side's Assault model."
echo "       Heavy             200hp and noticeably slower, with one frag grenade, and"
echo "                         recovers 10hp every 15 seconds on his own."
echo
echo "                         THAT RECOVERY STOPS THE MOMENT HE IS HIT and does not"
echo "                         start again until 15 seconds after the last hit --"
echo "                         enemy fire, a fall, a grenade, all of it. It is what"
echo "                         lets a Heavy who breaks contact come back, not"
echo "                         something that keeps one alive in a firefight. It stops"
echo "                         at his own 200 and never climbs past it."
echo
echo "     Each perk does one thing. A Breacher cannot heal or resupply, a Medic cannot"
echo "     breach, and so on."
echo
echo " .ready"
echo "     Mark yourself ready. Requires a side and requires being spawned in."
echo "     Refused with a reason if either is missing."
echo
echo " .unready"
echo "     Withdraw your ready state."
echo
echo " .stim    (or bind a key to:  stim)"
echo "     Use your stimpack: 25 to 50 health to yourself, ONCE A ROUND, whatever class"
echo "     you are. How much is rolled when you use it, so spending it early may buy little."
echo
echo "     Capped at your own class health, so a Heavy stops at 200 and a Marksman at 85."
echo
echo "     Using it at full health is refused AND KEEPS IT -- you are told so and can still"
echo "     use it later in the round."
echo
echo "     You glow red while it lands, as a medic's heal does (an engineer's resupply glows"
echo "     yellow), and it makes the medic's healing noise from your own body so the"
echo "     people around you know you have spent it."
echo
echo "     It comes back at the start of the next round. It does NOT come back if you"
echo "     respawn in the middle of one. In Wave Survival every new wave is a new round"
echo "     for it, as for .ammo, the class abilities and the Mech's rockets."
echo
echo " .cloak    /    .uncloak"
echo "     Recon only, in a live round: shimmer near-invisible and back. The model stays"
echo "     drawn, very faint -- not a true vanish, a close or careful look still finds"
echo "     you. You cannot see it on yourself: your own client draws you at its own"
echo "     opacity, whatever the server sends. One of two sounds plays either way (picked"
echo "     at random), heard up close and not across the map, plus a blue flash anyone"
echo "     nearby can see."
echo
echo "     Bots neither see nor target you while it is up. It is not damage immunity:"
echo "     shots and blasts still hurt you."
echo
echo "     TAKING OR DEALING ANY DAMAGE BREAKS IT, with the uncloak sound and flash. It is"
echo "     for moving unseen, not for fighting from inside it."
echo
echo "     Expires on its own after 30 seconds (tsm_cloak_duration) if nothing else ends it"
echo "     first -- same sound and flash as typing .uncloak. .uncloak any time before that."
echo "     After any end, .cloak waits 30 seconds (tsm_cloak_cooldown) before it works again."
echo "     If the match takes you out of the round some other way (eliminated, benched, the"
echo "     warmup hold) it ends on its own, silently."
echo
echo " .scan    (or bind a key to:  say .scan)"
echo "     Officer only, in a live round: pulse the scanner and every cloaked ENEMY within"
echo "     1024 units (tsm_scan_radius) of you is exposed to your WHOLE SIDE for 10 seconds"
echo "     (tsm_scan_time) -- not just to you, to everyone wearing your colour. You are"
echo "     told how many were caught, and your side is told with you."
echo
echo "     The mark is a bright blue glow shell around each caught man, and for those ten"
echo "     seconds his body is also drawn solid to your side, so the cloak is no use to"
echo "     him until it fades. It is the medic's glow shell, which TS draws the same on"
echo "     both engines, in line of sight. During sudden death on H9XASH the x-ray's"
echo "     through-wall shell takes its place, over a body still drawn solid. Your side's"
echo "     bots see him too and may open fire."
echo "     His own side sees none of that."
echo
echo "     The mark is TIME, not state: set when the scan fires, out on its own ten"
echo "     seconds later. Uncloak inside the window and the blue stops mattering; recloak"
echo "     and it is still live and finds you again."
echo
echo "     Once per 30 seconds (tsm_scan_cooldown, measured from use, like the cloak's"
echo "     cooldown), and it re-arms at the start of every round. The scan plays"
echo "     scan.wav (tsm_scan_sound; empty makes it silent), heard by whoever is near"
echo "     the Officer -- BOTH sides -- and flashes the same blue point light the"
echo "     Recon's cloak uses, so an enemy who saw a blue pulse knows either a Recon"
echo "     just slipped away or an Officer just read the area."
echo
echo "     Bots cannot use it: no bot types chat commands."
echo
echo " .reinforce  (or bind a key to:  say .reinforce)"
echo "     Officer only, while alive: call the team's waiting dead back now. Every"
echo "     teammate waiting for a wave comes back at once, whatever the wave timer"
echo "     says -- bots included, exactly like a natural wave. Once per"
echo "     tsm_reinforce_cooldown seconds (120); a call with nobody waiting costs"
echo "     nothing. Needs tsm_respawns 1. While anyone is waiting, your screen also"
echo "     lists them on the right."
echo
echo " .forfeit"
echo "     Vote to concede the match for your side. EVERY human on that side has to type"
echo "     it -- one person saying it is an opinion, all of them saying it is a decision."
echo
echo "     Each vote is announced with how many have agreed and who is still holding out,"
echo "     so the side knows it is being asked."
echo
echo "     BOTS DO NOT COUNT. A side of one human and five bots could otherwise never"
echo "     concede, because five of its six members can never type anything."
echo
echo "     The other side takes the match, scored and announced exactly as it is when a"
echo "     side is left empty. Votes are cleared at the start of every round."
echo
echo " .status"
echo "     Print the current match state to chat (to your console with tsm_verbosity"
echo "     0)."
echo
echo " .advertise  /  .ad          (ts_advertise -- a separate plugin)"
echo "     Post to Discord that a match is being organised. The bot posts an embed with"
echo "     the map, the mode as the server browser names it, how many are on, how many of those are bots, what the match is doing"
echo "     and a connect line."
echo
echo "     ONE EVERY THIRTY MINUTES FOR THE WHOLE SERVER, not per player, and it survives"
echo "     a map change -- the next map does not hand anybody a fresh one. Anyone refused"
echo "     is told how long is left."
echo
echo "     It pings a Discord role, so it is deliberately hard to do often."
echo
echo "     The clock only starts once Discord has ACCEPTED the post. A failed advert does"
echo "     not cost anyone the next half hour."
echo
echo "     Needs tsm_ad_token and tsm_ad_channel set in ts_advertise.cfg and the"
echo "     AmxxEasyHttp module installed; without them it says so in chat and posts"
echo "     nothing."
echo
echo "     THE DISCORD BOT DOES NOT HAVE TO BE RUNNING for this. A bot token is a"
echo "     credential rather than a connection, so the game server posts by itself."
echo "     Running discord-bot\ts_bot.py adds what has to come back the other way:"
echo "     the bot showing online, the /who /status /advertise slash commands, and the"
echo "     RSVP buttons on an advert."
echo
echo "     Setup, layout and what the failures mean: discord-bot\README.md"
echo
echo " .roam"
echo "     Toggle free movement. Lifts every hold -- warmup, freeze, spectator -- and"
echo "     gives you normal movement so you can walk the map."
echo
echo "     This is how you place spawn points. The warmup hold clamps maxspeed to 1, so"
echo "     without it you cannot leave the spot you spawned on; doing it during a live"
echo "     round instead means doing it under fire."
echo
echo "         .roam"
echo "         walk to a position, amx_tsm_spawn_add 1   (or 2)"
echo "         repeat"
echo "         amx_tsm_spawn_save"
echo "         .roam                                     (back to normal)"
echo
echo "     You get your WEAPONS while roaming, and lose them again when you switch it"
echo "     off. Whatever hold you were under before will have disarmed you, which left a"
echo "     roamer with nothing to shoot and nothing to open a door with -- and trying a"
echo "     doorway is half of what walking a map is for. They are handed back on the way in"
echo "     and taken on the way out, so you never carry them into the match."
echo
echo "     Attack, +use and the impulse keys all work while roaming. They used to be wiped"
echo "     along with everything else by the warmup and freeze holds, which is why .roam"
echo "     gave you movement and nothing else."
echo
echo "     The hold itself is not saved and restored: it is recomputed from the match state"
echo "     every frame, so switching roaming off simply lets that take over again."
echo
echo " .follow   /   .squad          (Officer class only, during a round)"
echo "     Take every free bot on your side under command -- the nearest first, no"
echo "     cap. They hold on you until you dismiss them or the round ends."
echo
echo "     A bot already commanded by another Officer is left alone and you are told"
echo "     so. It is never taken off him: two Officers steering one bot would drag it"
echo "     between them every frame."
echo
echo "     They are held as a LOOP, and it stays a loop for the whole round: beyond"
echo "     tsm_squad_dist (160 units) the plugin pulls a bot towards you, a bot that"
echo "     STAYS out there for 3 seconds is LEASHED back to a clear spot beside you"
echo "     (never onto you, never into a body), and one that wanders beyond"
echo "     tsm_squad_warp (1200) is warped to you at once. tsm_squad_leash (50) is how"
echo "     far out counts as gone: it sits inside tsm_squad_dist, so the 3-second"
echo "     clock starts the moment a bot leaves the formation. Inside tsm_squad_dist"
echo "     the bot is rcbot's own to fight, path and roam with."
echo
echo "     An Officer is told about both commands in chat when the round starts, so"
echo "     the perk is not invisible."
echo
echo " .unfollow /   .dismiss        (Officer class only)"
echo "     Stand the whole squad down. Releases only YOUR bots."
echo
echo " .unstick                      (any live player)"
echo "     Pushes bots IN YOUR SQUAD within ~56 units off you, and lifts you +24"
echo "     units if you are genuinely embedded in solid. Bots are moved to a clear"
echo "     ring spot (8 directions tried) and zeroed. 3-second cooldown. Bots only"
echo "     -- never affects humans. Only affects bots currently following YOU."
echo
echo " .turret                       (Combat Engineer only, live round, alive)"
echo "     Stand a sentry turret on the floor 64 units in front of you, facing the"
echo "     way you face: blue for MSR, red for the Insurgents. It deploys for a"
echo "     second, then shoots the OTHER side's players in its sight -- never your"
echo "     side, never a spectator, never a cloaked Recon. ONE A ROUND per engineer"
echo "     (one a wave in Wave Survival), even once it is destroyed, and two standing"
echo "     per side (tsm_turret_per_team). +USE on your"
echo "     side's turret puts 100 health back, once every 30 seconds per turret."
echo "     Enemy fire destroys it; every turret goes at the start of each round and"
echo "     when its engineer leaves. Refused, with the reason, on a wall, a ledge or"
echo "     a player. Also the console command turret."
echo
echo " .pickup                       (Combat Engineer only, live round, alive)"
echo "     Pack up YOUR turret -- the one you are looking at, within +USE reach"
echo "     (tsm_eng_range) -- and carry it. Your next .turret sets it down again"
echo "     with the health it had and its repair wait still running, even though"
echo "     the round's one turret is already used. A carried turret is lost at the"
echo "     next round (wave in Wave Survival). Also the console command pickup."
echo
echo " .rocket                       (Mech class only, while alive)"
echo "     Fire a rocket at whatever your crosshair is on, up to 2000 units away: a"
echo "     white trail to the spot and a blast there with splash damage, 65 at the"
echo "     centre. Four a life, 30 seconds apart; every spawn hands all four back, and"
echo "     so does every new wave in Wave Survival."
echo
echo " .light"
echo "     Toggle your flashlight on or off, whatever weapon you are holding. Only"
echo "     while playing in a live round."
echo
echo " .ammo"
echo "     +25 spare rounds for every gun you carry, ONCE A ROUND (once a wave in Wave"
echo "     Survival), while playing in a live round. Guns that share a calibre share the 25. If everything is"
echo "     already at TS's own cap nothing lands, you are told your guns are full,"
echo "     and it is not spent. Same yellow glow and ammo sound as an engineer's"
echo "     resupply."
echo
echo " .mechtest    (or in the console:  tsm_mechtest)"
echo "     The mech sound bench. Prints to your console whether the server takes you"
echo "     for a Mech -- your model path, your resolved class, whether the mech kit"
echo "     recognises the body -- then plays mechwalk, mechloop and one clang on"
echo "     your own client, so 'not detected' can be told apart from 'not audible'."
echo
echo " tsm_music 0|1                 (console)"
echo "     Ambient music on or off, for you alone; on by default, and with no number"
echo "     it flips. Remembered through setinfo, so it survives a reconnect. Off also"
echo "     silences the round-start anthems. The queue plays every track once before"
echo "     any plays again, never one twice in a row, and keeps its place from map to"
echo "     map; an admin's tsm_music_skip moves it on for everyone."
echo
echo " .rtv"
echo "     Rock the vote: you want a new map. Once 60% of the people on the server"
echo "     have said it, everyone gets a menu of maps to vote on (ts_rtv.amxx; ROCK"
echo "     THE VOTE, below). Not while a match is in progress, unless the server"
echo "     sets tsm_rtv_in_match 1, and not on a roleplay map, unless it sets"
echo "     tsm_rtv_roleplay 1. While a vote runs, .rtv brings its menu back."
echo
echo " .nominate [part of a map's name]"
echo "     Puts a map on the next vote. One map that matches is nominated at once,"
echo "     several are offered in a menu, and .nominate alone lists every map that"
echo "     can be nominated here. One nomination each: a second replaces the first."
echo
echo " .unnominate"
echo "     Takes your nomination back."
echo
echo " .unrtv"
echo "     Takes your .rtv back, while the vote has not started."
echo
echo " tsm_model                     (console)"
echo "     Which player model the gamemode picked for you: class, side, the model"
echo "     chosen, whether it is on disk, and the list it was drawn from with 'pick n"
echo "     of m'. An m smaller than the names in the config means the list is being"
echo "     cut short somewhere."
echo
echo " .link"
echo "     Links your game to your havoc9.org account from in game (h9_link.amxx):"
echo "     your game shows a code, you approve it on havoc9.org/link while signed"
echo "     in, and from then on the game plays as your account. H9XASH only; the"
echo "     web client is signed in already. Link your Account in the game's main"
echo "     menu does the same. docs\CUSTOM_XASH_USERID.txt section 2a."
echo
echo " .rank [name]   (also /rank, !rank, /elo, !elo)"
echo "     Your havoc9.org rank (h9_rank.amxx), to you alone: your level, your"
echo "     rating and place on the H9 ladder and on this server's table, and this"
echo "     season's matches, wins and losses, kills, deaths, assists (where a"
echo "     server counted them) and K/D; one chat line, and the whole readout in"
echo "     your console. With a name: that player's here (part of the name will"
echo "     do), else the havoc9.org account of that name. A bot, or a player not"
echo "     signed in to a havoc9.org account here, has no rank; no switch on an"
echo "     account hides a rank. docs\H9_COMPETITIVE.txt."
echo
echo " .relay <text>"
echo "     Says <text> to the whole community this server is in: every one of its"
echo "     servers and its page on havoc9.org show '[Tag] YourUsername: text', and"
echo "     lines written on the site come as '[Web] Name: text'. Needs a havoc9.org"
echo "     account linked to your game (docs\H9_PRESENCE.txt); one line every 2"
echo "     seconds. The server sets the prefix (h9_community_prefix)."
echo
echo " /find <name>, /where <name>"
echo "     Where a havoc9.org player is, as far as they show it: the server and the"
echo "     address to type after connect, or on havoc9.org, in the H9 web client, or"
echo "     offline. This community's players come first. .find and .where too. A"
echo "     private community's server shows only to its members; to anyone else"
echo "     its players are just 'in game'."
echo
echo " Members-only servers"
echo "     A community can keep its servers for its members. Anyone else is kicked"
echo "     with 'This server is for members of <name>. Join at"
echo "     havoc9.org/community/?c=<short name>', and a Steam client always is: join"
echo "     there, with the havoc9.org account your game uses, and come back."
echo
echo " Portals"
echo "     A ring on some maps leads to another server of the community; its name"
echo "     and players show as you come near. Press E (or walk in, where it says"
echo "     so) and pick 1. Go. H9XASH and the web client then ask you themselves:"
echo "     'Travel to <name>?' with YES (Y) and NO (N); only your YES connects"
echo "     (cl_h9_travel 0 turns these offers off). Elsewhere the server cannot"
echo "     move you, so it gives you the address: open the console and type"
echo "     connect <address>."
echo
echo
echo "==============================================================================="
echo " MATCH CONTROL  (admin, ADMIN_CFG)"
echo "==============================================================================="
echo
echo " WHO IS AN ADMIN. The admin commands here and below need AMX Mod X access"
echo " flags -- ADMIN_CFG is the 'h' flag -- which AMX Mod X gives by authid, IP or"
echo " name in addons\amxmodx\configs\users.ini. On H9XASH a player has no SteamID:"
echo " his authid is ID_ followed by a hash his own game supplies (ID_LAN on a LAN"
echo " server), which cannot be trusted with flags, and a havoc9.org account is no"
echo " authid AMX Mod X can match. Never give 127.0.0.1 flags either: web client"
echo " players reach a game server on the same PC through h9web's relay and arrive"
echo " from 127.0.0.1, so that line would make every one of them an admin. Run admin"
echo " commands in the server's own console, or over rcon with an rcon_password set"
echo " on the server. Server cvars such as amx_tsm_forcedoor are set there too:"
echo " typed in a player's own console they never reach a dedicated server."
echo
echo " amx_match_start"
echo "     Force the match live without waiting for ready-up. Warns if a side is"
echo "     empty -- rounds will not resolve while one is."
echo
echo " amx_match_cancel"
echo "     FULL reset to warmup. Round counter to 0, score to 0-0, ready flags"
echo "     cleared, classes cleared, late-join lockouts cleared, everyone restored."
echo "     If a match or its ready-up was under way, everyone then goes to the"
echo "     spectator team and the humans get the side menu again -- exactly as at"
echo "     the end of a match -- so sides are picked fresh."
echo "     This is the 'put everything back' command."
echo
echo " amx_match_restart"
echo "     Score and round counter to 0, then start round 1 immediately. Skips"
echo "     warmup and ready-up."
echo
echo " amx_match_score"
echo "     Print the current score."
echo
echo " amx_match_continue"
echo "     Override a halt and play the match out with the sides as they are."
echo "     Keeps the round counter and the score; amx_match_start would zero both,"
echo "     because that one begins a new match."
echo
echo "     A round HALTS when somebody leaves and the sides end up uneven by more"
echo "     than tsm_balance_gap. Everyone goes back to ready-up, that round is"
echo "     replayed from the start, and the rounds already won are kept. Play"
echo "     resumes when the sides are even again and everyone has typed .ready --"
echo "     or immediately, with this command."
echo
echo "     Only does anything while a match is halted; it says so otherwise, and"
echo "     amx_tsm_debug prints the halt state on its own line. The override holds"
echo "     for the REST OF THAT MATCH, so the next person to leave cannot stop a"
echo "     match an admin has already said to play out, and it is cleared when the"
echo "     match ends."
echo
echo "     Three cvars govern the halt, all documented in ts_matchmode.cfg:"
echo "     tsm_halt_on_leave (1 = on), tsm_halt_delay (grace period before the"
echo "     sides are counted, so rcbot can refill one first) and tsm_halt_bypass"
echo "     (1 = never halt at all)."
echo
echo " tsm_music_skip"
echo "     The ambient music's next track, now, for everyone listening. The queue"
echo "     is one for the whole server -- every listener is sent the same track at"
echo "     the same moment, and the next one is armed from the length of the one"
echo "     playing -- so moving it on is an admin's, from the console or rcon. A"
echo "     skip for one player alone would be cut off as soon as the shared queue"
echo "     moved on; a player who does not want the music has tsm_music 0."
echo
echo
echo "==============================================================================="
echo " SPAWN POINTS  (admin, ADMIN_CFG)"
echo "==============================================================================="
echo
echo " Custom spawns are per map, saved to:"
echo "     addons/amxmodx/configs/tsm_spawns_<mapname>.cfg"
echo " and reloaded automatically every time that map loads."
echo
echo " The full picture, with the file format and how to move spawns onto tiers,"
echo " is in docs/CUSTOM_SPAWNPOINTS.txt."
echo
echo " Once a map has ANY custom spawn, the map's own spawn entities are no longer"
echo " used at all. They are only a fallback for maps with no custom set."
echo
echo " amx_tsm_spawn_add <1|2> [tier]"
echo "     Add a spawn for that team where you are standing, facing where you look."
echo "     Custom spawns store facing; map entities cannot."
echo "     [tier] makes it a FORWARD spawn. Left off, or 0, it is the team's normal"
echo "     spawn. A forward tier is used once that many siege objectives have fallen:"
echo "     the team's respawns then land only on its forward points, and the defaults"
echo "     are off until the round ends. Living players are never moved to a forward"
echo "     point. Nobody respawns on a tier whose objective has not fallen yet."
echo "     On an Assault map the tier (1 to 32) is the respawn set of the capture"
echo "     point of that number: a side's waves land there while it holds the point"
echo "     (docs/CUSTOM_SPAWNPOINTS.txt, part 5)."
echo
echo "     It refuses while you stand on one of the map's own spawn points: that"
echo "     position would become a custom spawn, and done for both teams the two"
echo "     would share it. Step off it first; tsm_spawn_prune 0 lets it through."
echo
echo " amx_tsm_spawn_list"
echo "     Each point shows its tier. The numbers are the ones amx_tsm_spawn_del takes."
echo "     List every configured spawn with its position and facing."
echo
echo " amx_tsm_spawn_tp <1|2> <n>"
echo "     Teleport to spawn n of that team, to check placement."
echo
echo " amx_tsm_spawn_del <1|2> <n>"
echo "     Remove one spawn. Use this to drop a bad entry without clearing the set."
echo
echo " amx_tsm_spawn_clear <1|2|0> [tier]"
echo "     With a tier, only that tier's points are removed. Use amx_tsm_spawn_del"
echo "     to remove one point by its number, forward points included."
echo "     Clear that team's spawns. 0 clears both."
echo
echo "     It clears MEMORY ONLY and says so. To wipe a map's spawns for good:"
echo
echo "         amx_tsm_spawn_clear 0"
echo "         amx_tsm_spawn_save"
echo
echo "     save deletes the old cfg before writing, so what is left is a file with"
echo "     nothing in it but its two header lines -- a real wipe, not a stale set"
echo "     that comes back on the next map load. Do not leave it that way: with no"
echo "     custom spawns the map falls back to its own spawn entities, which carry"
echo "     no facing and may not be where a match wants people to start."
echo
echo " amx_tsm_spawn_save"
echo "     Write the current set to the per-map cfg. Nothing is persisted until you"
echo "     run this."
echo
echo " tsm_spawn <team> <x> <y> <z> [pitch] [yaw] [tier]   (server command)"
echo "     Defines one spawn. This is what the saved cfg is made of. Hand edits are"
echo "     fine: docs/CUSTOM_SPAWNPOINTS.txt, Part 3, shows how."
echo
echo
echo "==============================================================================="
echo " DIAGNOSTICS  (admin, ADMIN_CFG)"
echo "==============================================================================="
echo
echo " amx_tsm_debug"
echo "     The first thing to run when nothing is happening. Build stamp, the"
echo "     engine, match state, round and score, team mode and names, live"
echo "     mp_teamlist, spawn source, balance state, class count, weapon mode, bot"
echo "     settings, whether PlayerPreThink fires, and every player's resolved team"
echo "     and ready state."
echo
echo "     engine= is GoldSrc or Xash3D FWGS (H9XASH), which the plugin works out by"
echo "     itself at map load. On Xash it makes two adjustments: a player leaving is"
echo "     picked up from Metamod's ClientDisconnect (AMXX cannot hook Xash's own"
echo "     disconnect), and an sv_visiblemaxplayers stand-in is registered, because"
echo "     AMXX's adminslots plugin asks for one on every connect."
echo
echo " amx_tsm_teaminfo"
echo "     Everything about teams from the mod's side: mp_teamlist, mp_teammodels,"
echo "     mp_teamplay, mp_teamoverride, the spectator team's resolved slot, how"
echo "     many TeamInfo messages the mod has sent, and each player's team as TS"
echo "     reports it versus as the plugin resolves it."
echo
echo "     TeamInfo msgs = 0 means the server is NOT running teamplay gamerules, and"
echo "     no team join can possibly work. mp_teamplay must be 1 BEFORE the map"
echo "     loads -- that is what ts/game.cfg is for."
echo
echo " amx_tsm_whystuck [target]"
echo "     Dumps everything that can stop a player moving: our hold flag, FL_FROZEN,"
echo "     movetype, solid, maxspeed, velocity, origin, effects, and how often"
echo "     maxspeed had to be restored."
echo
echo "     A healthy live player reads movetype=3 and solid=3. solid=2 cannot slide"
echo "     along the floor and looks exactly like being frozen."
echo
echo " amx_tsm_unstick [target]"
echo "     Last resort. Clears every hold, forces normal movement, and lifts the"
echo "     player clear of the floor in case they were made solid inside geometry."
echo
echo " tsm_commands"
echo "     Every command this plugin has registered, in two groups: server-side"
echo "     (console and admin commands, run from the server console or an admin's"
echo "     own client) first, then client commands (what an ordinary player's own"
echo "     client sends). Read live from AMXX's own command tables."
echo
echo " tsm_fogtest"
echo "     Toggles the sudden-death fog on or off, for looking at it without"
echo "     waiting for a real sudden death. Needs tsm_logging 1. Refuses outright"
echo "     while a real sudden death is already live this round, and a new round"
echo "     clears it the same as the real fog -- it can never affect or outlast"
echo "     the real thing."
echo
echo " amx_tsm_unfreeze"
echo "     Force-release everyone. Diagnostic."
echo
echo " amx_tsm_fix <target>"
echo "     Force-restore one player to normal: visible, solid, armed, able to move."
echo
echo " amx_tsm_cloak <target>"
echo "     Toggle a Recon cloak on anyone, bots included, in a live round. The cloaker"
echo "     never sees his own cloak -- his client draws him at its own opacity -- so"
echo "     this is how the effect is looked at: cloak a bot and watch it."
echo
echo " amx_tsm_menu <side|class>"
echo "     Force a menu up and report why it might not have shown (built or not,"
echo "     class count, current assignment). Tells 'never sent' apart from 'sent and"
echo "     swallowed' -- the latter happens when a TS VGUI panel holds keyboard"
echo "     focus, because it eats every digit before the client can send menuselect."
echo
echo " amx_tsm_ents"
echo "     Every entity classname in the world right now, with a count of each."
echo
echo "     Run it with a body on the floor to see the corpse for what it is: TS's"
echo "     own deadcorpse entity, not the player."
echo
echo
echo "==============================================================================="
echo " TESTING  (admin, ADMIN_CFG)"
echo "==============================================================================="
echo
echo " amx_tsm_simwin <1|2>"
echo "     Award the current round to a team. With tsm_test_solo 1 this is how you"
echo "     walk a whole best-of-X on your own."
echo
echo " amx_tsm_simelim [target]"
echo "     Eliminate a player as though they had been killed. Exercises the"
echo "     elimination, spectate-follow and kill-report paths without needing a"
echo "     second player to shoot."
echo
echo " amx_tsm_wave [1|2]"
echo "     Force a respawn wave now, for one team, or for both without a number."
echo "     Waiting players come back at once whatever their wait. Live round only."
echo " amx_tsm_shuffle"
echo "     Attempt to even the sides out."
echo
echo " amx_tsm_siege"
echo "     The siege's whole state in one print: how many objectives stand and"
echo "     what has fallen, the planted satchel (whose, whose fuse is running and"
echo "     the cvar's seconds), any holds in progress, the alarm (side, siren"
echo "     loop, volume), the class gate, and every measured sound length."
echo
echo " amx_tsm_siege_spawn [n]"
echo "     Create a SYNTHETIC objective right where you look -- a small glowing"
echo "     box named tsm_obj_<n>. No tsm_obj entity needs to exist in the map at"
echo "     all; this is how you play the whole plant-fuse-removal flow anywhere."
echo "     It takes the next free number by itself, or the number you give it (a"
echo "     slot that already stands is refused). After its fall it is gone for"
echo "     good: synthetic bodies are not cached for the per-round rebuild."
echo
echo " amx_tsm_siege_plant [n]"
echo "     Force-complete a plant instantly through the same code a finished"
echo "     hold calls: the success plant.wav, the '[MATCH] ... planted' line,"
echo "     the planted state and tsm_obj_fuse's fuse. Without a number it takes"
echo "     the objective under your crosshair. It refuses outside a live round;"
echo "     with tsm_linear_obj 1 (the default) planting a non-next objective"
echo "     prints a warning -- the fuse will reconcile and fall nothing until the"
echo "     chain walks there (amx_tsm_obj <n>); in any order none is 'next'."
echo
echo " amx_tsm_siege_fuse"
echo "     Set the planted charge off this instant by calling the real fuse"
echo "     tick: the explosion sprite, the boom, the fall, the boom stack and the"
echo "     ground shake. On the chain's last objective, also the round end. On an"
echo "     earlier one, also the lives and the clock that fall gives back"
echo "     (tsm_siege_rewardlives, tsm_siege_extratime)."
echo
echo " amx_tsm_siege_alarm"
echo "     Force the raid siren on, live round or not, with the defenders' text"
echo "     like a real first attack. A round boundary still cuts it."
echo
echo " amx_tsm_siege_reset"
echo "     The clean slate: fuse killed, alarm cut, synthetic objectives taken"
echo "     back out of the world, every cached objective body rebuilt, and the"
echo "     chain (how many have fallen) at zero."
echo
echo " amx_tsm_obj [reset|<n>]"
echo "     The map's siege objectives in one line: how many there are, how many"
echo "     have fallen, the attacking side, the planter class, the hold time and"
echo "     tsm_obj_slay. 'reset' puts every objective back first, as a round start"
echo "     does; a number sets how many count as fallen (objectives 1 up to that"
echo "     number), so the chain can be walked forward to a later objective."
echo
echo "     RUN ORDER: amx_match_start to go live, then spawn or aim at an"
echo "     objective, then plant. The fuse only detonates live and, with"
echo "     tsm_linear_obj 1, in order (amx_tsm_obj <n> walks the chain forward),"
echo "     which is the real round's own rule -- the suite tests the rules rather"
echo "     than suspending them."
echo
echo " tsm_opendoor"
echo "     Force open the door you are aiming at (func_door or func_door_rotating),"
echo "     locked or not: a master, the 'Use Only' flag or the engineer-only lock"
echo "     makes no difference. It opens once, and the door's own timer closes it"
echo "     again, as it would any other time. Off unless amx_tsm_forcedoor is 1"
echo "     (default 0) -- it is there for debugging."
echo
echo " amx_tsm_loc   /   tsm_loc"
echo "     Find your exact XYZ coordinates to pass to agents using module JS & SMAK."
echo "     Both spellings do the same: your feet (the .map coordinate) to chat (the"
echo "     console alone with tsm_verbosity 0) and console, and to the console your"
echo "     eyes and view angles, the floor below"
echo "     you, and the point and entity under your crosshair -- classname,"
echo "     targetname and target."
echo
echo "==============================================================================="
echo " COMMANDS THIS PLUGIN INTERCEPTS"
echo "==============================================================================="
echo
echo " These are not for you to type -- they are TS's own commands that the plugin"
echo " watches or blocks. Listed so the behaviour is not a mystery."
echo
echo " tkw / tka / tki / rst_cfg / cashala"
echo "     TS's buy-menu commands. Refused when tsm_block_buy is 1, in every state,"
echo "     warmup included."
echo
echo "     This is only HALF of the block, and not the half that matters. Refusing"
echo "     these stops the menu saving a NEW loadout; it does nothing about one"
echo "     already saved in a player's config, because TS re-applies that from the"
echo "     config at every spawn and sends no command for this to catch. That is"
echo "     what tsm_nocash is for -- see NO ECONOMY below. Leave both switched on."
echo
echo "     The plugin's OWN loadout writes use these same commands and are allowed"
echo "     through by a bypass flag."
echo
echo " changeteam"
echo "     Refused while tsm_block_teamvgui is 1. It is the only thing that opens"
echo "     TS's team panel, and that panel is modal: it swallows every digit, so an"
echo "     AMXX menu shown while it is up renders and never receives a keypress."
echo "     The plugin's own side menu replaces it."
echo
echo " jointeam"
echo "     Watched, not blocked. Logged to tsm_debug.log so a failed join can be"
echo "     told apart from one that never arrived."
echo
echo " h9vgui <id> <control> <value>"
echo "     The reply of an H9 game's panel (include\h9_vgui.inc), taken for the"
echo "     plugin's own panels only, tsm.*. Its side and class panels answer with"
echo "     menuselect, as the text menus do, so today it acts on none."
echo
echo " usepowerup / powerup"
echo "     TS's powerup key, and the cheat that grants one. With tsm_no_powerups 1"
echo "     they are refused in match mode ('Powerups are off in match mode.'), with"
echo "     two exceptions while a round is live: an Officer's goes through to TS --"
echo "     his kung fu IS a powerup -- and any other class with a perk gets the"
echo "     perk's own action instead, silently."
echo
echo " drop / drop_<number>"
echo "     The T key, and the weapon bar's right-click, drop a weapon. Refused in"
echo "     match mode in warmup, ready-up, the freeze before a round and the seconds"
echo "     of a match's end ('You cannot drop a weapon until the round is live.'),"
echo "     so nobody litters the map before a round; allowed again once the round is"
echo "     live. With tsm_enabled 0 (the game's own rules) they go through always."
echo
echo " say / say_team"
echo "     Parsed for the player commands at the top of this file."
echo
echo
echo "==============================================================================="
echo " CHAT AND CENTRE TEXTS  (tsm_verbosity)"
echo "==============================================================================="
echo
echo " Every line the match mode says in chat starts '[MATCH]', and all of them go"
echo " through one switch, tsm_verbosity (0). At 0 none of them is printed: round"
echo " starts and ends, picks, refusals, kill reports, all of it. Players then go by"
echo " what they see -- the HUD, the scoreboard, and the centre texts below. .status"
echo " and tsm_loc answer in the console at 0. The class abilities' own '[TSM]'"
echo " replies are not '[MATCH]' lines and stay."
echo
echo " THE CENTRE TEXTS. Whatever tsm_verbosity says, an action of a player's own"
echo " that shows nothing by itself is answered in the middle of his screen, in the"
echo " centre style the siege refusals already used ('That is yours to defend.');"
echo " the same text twice within 1.5 seconds shows once. They answer:"
echo "   - doors: an engineer door used by the wrong class ('Only a Combat Engineer"
echo "     opens this door.') or by the other side's engineer; a breach door that"
echo "     stays shut for anyone but the Breacher ('Only a Breacher can force this"
echo "     door.') -- a func_door or func_door_rotating in tsm_breach_entities,"
echo "     locked Use Only or named in tsm_breachdoor_1..8, looked at again a moment"
echo "     after the +USE, so one that opens for him says nothing -- and a Breacher"
echo "     at an engineer door ('This door has no lock to break.')"
echo "   - an engineer's +USE on the other side's turret"
echo "   - the side menu, .team and jointeam: a match in progress, a full side, the"
echo "     enemy wave's side, joining, spectating, waiting for the map vote"
echo "   - the class menu and .class: a full class, one not played on the map,"
echo "     already picked or locked, classes off, the pick itself, and the class"
echo "     given to anyone who picked none"
echo "   - .ready, .unready, .forfeit (with the vote's count), joining or being"
echo "     benched mid-match, the team lock, a short side filled with you"
echo "   - friendly fire on a teammate, a refused powerup, a refused weapon drop,"
echo "     .music"
echo "   - the medic's heal and the engineer's resupply, to both players"
echo "   - the Officer's .follow, .unfollow, .scan (to him) and .reinforce"
echo "   - .stim, .rocket, .cloak, .uncloak and the cloak running out, .light's"
echo "     refusals, .ammo, .turret, .pickup, .unstick and .roam"
echo " What already had one keeps it: siege's refusals and the satchel, the"
echo " medkit, resupply, scanner and reinforcement timers, a turret repair,"
echo " 'Breached.'. Announcements -- a round won, a player eliminated, a tier"
echo " raised -- are no player's action and have none."
echo
echo
echo "==============================================================================="
echo " CLASS IDENTIFICATION  (models and icons)"
echo "==============================================================================="
echo
echo " MODELS are barely usable for this, and the limits are in the mod, not here:"
echo " a team gets at most 3 entries in mp_teammodels, each capped at 15 usable"
echo " characters (a longer name overruns the next slot), and TS picks among them"
echo " at RANDOM on every userinfo change via CTSGameRules::GetPlayerModel()."
echo
echo " Worse, the handler that does it is reached unconditionally, and writing the"
echo " 'model' key is what triggers that handler -- so a write from a pre hook is"
echo " always overwritten. tsm_model_post 1 answers that by writing the class model"
echo " from a POST hook, after TS has had its say, and superceding the re-entry our"
echo " own write causes so the mod cannot answer twice."
echo
echo " ICONS carry the same information without any of those limits:"
echo
echo "     tsm_class_icons 1     a sprite above each head showing their class,"
echo "                           visible ONLY to that player's own side"
echo "     tsm_icon_height 52.0  units above the player's origin"
echo "     tsm_icon_scale  0.25  sprite scale; the sheet is 64x64 per frame"
echo
echo " Per-viewer visibility is done in AddToFullPack, which the engine asks once"
echo " per (viewer, entity) pair -- the only place a thing can be shown to one"
echo " player and withheld from another on the same frame. The hide is written into"
echo " the entity STATE, never into pev_effects, so the real entity is untouched."
echo
echo " sprites/tsm_class.spr is NOT part of TS. It is built by"
echo " tools/make-class-icons.py and shipped in the package. CLIENTS NEED THE FILE"
echo " -- with sv_allowdownload on they fetch it on connect, or serve it from"
echo " fastdl. A client without it draws nothing where the icon should be."
echo
echo " One frame per class, in class order, so adding a class to the table means"
echo " adding a frame to the sheet and nothing else."
echo
echo
echo "==============================================================================="
echo " SUDDEN DEATH  (the last minute)"
echo "==============================================================================="
echo
echo " tsm_sudden_death 60    the last N seconds of a round go 'sudden'; 0 is off"
echo
echo " Three things turn on at once, together, and go off at the round boundary --"
echo " whichever way that round ends:"
echo
echo "     1. THE RED MARKERS. Every player's class icon is shown to the OTHER side,"
echo "        in red: the same sprite through the same AddToFullPack hook,"
echo "        re-coloured. Cloaked Recons are deliberately missed by this, because"
echo "        the marker is exactly the thing that would point at the man the cloak"
echo "        is hiding."
echo
echo "     2. THE X-RAY (H9XASH only). Every living enemy, cloaked or not, is sent"
echo "        to the other side carrying renderfx 64 -- a value GoldSrc ignores and"
echo "        the patched renderer (engine-h9-xray.patch) draws as a glow shell with"
echo "        the depth test off. He is sent wherever he is on the map, not only"
echo "        when he is in your view, so even a solid wall cannot hide him. The"
echo "        silhouette is in his own side's colour: Insurgents red, MSR blue."
echo "        Teammates are never marked. It lasts the whole last minute;"
echo "        tsm_sudden_xray 0 turns it off. On a stock engine there is no X-ray"
echo "        and nothing is wrong: the icons carry the round on every engine."
echo
echo "     3. THE TOXIC BOG (H9XASH only). The engine's world fog is driven from"
echo "        four server cvars (h9_fog_r / h9_fog_g / h9_fog_b / h9_fog_density,"
echo "        see ts_matchmode.cfg), and the plugin holds them at swamp green for"
echo "        exactly as long as sudden death runs, zeroing them at every round"
echo "        boundary and every end of match. The whole map fogs: skybox included,"
echo "        every client, both sides. On a stock engine those cvars are unknown"
echo "        and do nothing."
echo
echo " While sudden death runs every living player also loses 2 health every"
echo " second -- nobody out-lasts the clock on a full bar. That has no cvar: the"
echo " clock was already the thing meant to end the round."
echo
echo " A SIEGE OBJECTIVE CAN LIFT IT. With tsm_siege_extratime 1, an objective"
echo " that falls short of the last puts time back on the clock (up to"
echo " tsm_addtime, never past tsm_roundtime). If that takes the clock back above"
echo " the tsm_sudden_death mark, sudden death lifts for everyone: the markers,"
echo " the X-ray, the bog and the health drain all stop, and waves run again."
echo " When the clock comes back down to the mark it starts over, announced as"
echo " ever."
echo
echo
echo "==============================================================================="
echo " SERVER LISTS AND PRESENCE  (the server list is set outside the game)"
echo "==============================================================================="
echo
echo " tsm_pres_siege"
echo "     Set by the plugin once a second, not by hand: the siege progress, such as"
echo "     '2/5', and empty on a map with no siege objectives. The game reads it for"
echo "     the Discord card. See docs\RICH_PRESENCE.txt."
echo
echo " tsm_pres_attack"
echo "     Set by the plugin once a second, not by hand: the side that attacks the siege"
echo "     objectives, 1 or 2, and empty on a map with no siege objectives. The game reads it"
echo "     for the Discord card. See docs\RICH_PRESENCE.txt."
echo
echo " tsm_pres_side1, tsm_pres_side2"
echo "     Set by the plugin once a second, not by hand: how many players are on each side,"
echo "     bots included. The game reads them for the Discord card."
echo
echo " tsm_pres_alive1, tsm_pres_alive2"
echo "     Set by the plugin once a second, not by hand: how many players on each side are"
echo "     alive, counted the way the round logic counts them. The game reads them for the"
echo "     Discord card."
echo
echo " tsm_pres_mode, tsm_pres_prog"
echo "     Set by the plugin once a second, not by hand: the mode ('match', 'siege', or a"
echo "     claimed mode's key: 'uplink', 'survival', 'mechwarrior') and the mode's"
echo "     progress (the uplink's zones, the survival wave). The card names the mode by"
echo "     them, or by the map's name where they are empty; every tsm_pres_* is empty"
echo "     where the match mode is off."
echo
echo " ts_richpresence 1"
echo "     Shows your game on Discord as Rich Presence. On by default. Set 0 to turn it off,"
echo "     in config.cfg or userconfig.cfg. The Discord desktop app has to be running. See"
echo "     docs\RICH_PRESENCE.txt."
echo
echo " h9_presence_status                (server console)"
echo "     What the havoc9.org presence plugin is doing: its self-test, whether it"
echo "     reports, its enrollment and server id, the challenge and names switches,"
echo "     and the players in its last accepted report. Its cvars are under CVAR"
echo "     REFERENCE; the whole guide is docs\H9_PRESENCE.txt."
echo
echo " Your name on H9 maps"
echo "     With h9_presence_names 1 on the server, a player whose H9XASH proves"
echo "     their havoc9.org player id plays under their account's username on H9"
echo "     maps, and anyone else using an account's name plays as 'Player NNNN' for"
echo "     the map. Roleplay maps and stock ts_ maps keep names free. A username is"
echo "     changed on havoc9.org, in the account's settings."
echo
echo " Which servers the Internet tab lists is set in networking.ini, next to"
echo " h9xash.bat, not in the game. See docs\NETWORKING.txt."
echo
echo
echo "==============================================================================="
echo " COMMUNITIES  (h9_community.amxx: chat across servers, find, portals)"
echo "==============================================================================="
echo
echo " h9_community_status               (server console)"
echo "     Whether havoc9.org answers the server, which community it is in and as"
echo "     which tag, whether its chat is on here, its portals, and the calls other"
echo "     plugins have in flight."
echo
echo " h9_community_claim [new]          (server console, or rcon)"
echo "     A one-time code, good for 15 minutes, that links this server to a"
echo "     community: its owner or an admin enters it with a tag on"
echo "     havoc9.org/community/. Over rcon the code shows on the server's own"
echo "     console; run the command again to see it. new asks for a fresh one."
echo
echo " amx_h9_claim [new]                (admin, ADMIN_RCON)"
echo "     The same, in game: the code goes to your console."
echo
echo " h9_portal <tag|server id> <x> <y> <z> [yaw] [radius] [walk]"
echo "                                   (server console: a map's mapconfig)"
echo "     A portal to another server of the community, as a line in"
echo "     ts\mapconfigs\<map>.cfg: a ring, the server's name and players, E (or"
echo "     walking in, with walk 1) and a confirm. radius 16 to 256 (48), yaw the"
echo "     way it faces (0); at most 16 a map. Hidden while the tag or server id is"
echo "     not one of the community's other servers."
echo
echo " amx_h9_portal_add <tag|server id> [radius] [walk]   (admin, ADMIN_CFG)"
echo "     A portal where you stand, facing where you look. Prints its h9_portal"
echo "     line to paste into the mapconfig; its ring shows from the next map whose"
echo "     mapconfig has an h9_portal line."
echo
echo " amx_h9_portal_list                (admin, ADMIN_CFG)"
echo "     This map's portals, as h9_portal lines."
echo
echo " h9_travel <a.b.c.d:port> [name]   (sent by the server; H9XASH, web client)"
echo "     A server's offer to send you to another server: a portal's Go sends it"
echo "     to a game whose userinfo has _h9travel '1'. It never connects by"
echo "     itself. The game shows its own prompt for 15 seconds ('Travel to"
echo "     <name>?', the address, the server that offered it), and only your Y,"
echo "     Enter or click on YES connects; N, Esc or NO stay. Refused, with an"
echo "     'H9 TRAVEL:' console line: anything but a public IPv4 address and port"
echo "     (a LAN address only from a LAN server), a second offer while one is"
echo "     up, one within 10 seconds of the last, or a fifth from one server in 2"
echo "     minutes. docs\H9_COMMUNITIES.txt section 9."
echo
echo " cl_h9_travel 0|1                  (your own console; kept in config.cfg)"
echo "     1, the default: a server's h9_travel offer shows the prompt. 0: offers"
echo "     are ignored, with a line in the console, and servers give you the"
echo "     address to type instead. A server cannot change it."
echo
echo " The players' side (.relay, /find, /where, portals) is under PLAYER"
echo " COMMANDS, the cvars under CVAR REFERENCE. docs\H9_COMMUNITIES.txt is the"
echo " guide."
echo
echo
echo "==============================================================================="
echo " RATED PLAY  (h9_compete.amxx: compts's Elo and scoreboard, on havoc9.org)"
echo "==============================================================================="
echo
echo " say /rank   (also /elo, !rank, !elo; say or say_team)"
echo "     The same as .rank (h9_rank.amxx, under PLAYER COMMANDS): your rank, to"
echo "     you alone. Only a player whose game proves their havoc9.org player id"
echo "     here is rated. On a rated server each player's rating is also told to"
echo "     everyone 15 seconds after they join, as compts did (h9_compete.amxx)."
echo
echo " h9_compete_status                 (server console)"
echo "     The ladder this map plays (match, dm or off), whether h9_presence has a"
echo "     live key, and the match under way: its number at havoc9.org, its"
echo "     rounds, the batches of kills taken and the kills still waiting."
echo
echo " The rule (compts's): everyone starts at 1000; a kill +1 and -1, a headshot"
echo " +1 more, +1 for each 100 points the victim is above the killer (who takes"
echo " half of that from them too); a rated match +100 to each winner, -70 to each"
echo " loser, a leaver or a side that forfeits included; 30 idle days cost 10 a"
echo " day. The boards are on havoc9.org/ladder/. docs\H9_COMPETITIVE.txt is the"
echo " guide."
echo
echo
echo "==============================================================================="
echo " SPLASH MOTD  (h9_motd.amxx: a server's picture or web page)"
echo "==============================================================================="
echo
echo " motd                              (console)"
echo "     Shows the server's MOTD again: its splash where it has one, even after a"
echo "     once-a-connection splash was seen; otherwise TS's text MOTD."
echo
echo " cl_h9_motd 0|1                    (your own console; kept in config.cfg)"
echo "     1 shows a server's splash in place of its text MOTD, the default. 0"
echo "     always shows the text MOTD. A server cannot change it."
echo
echo " cl_h9_motd_wine 0|1|2             (your own console; kept in config.cfg)"
echo "     Only under Wine or Proton (Linux). 0, the default: a server's web page"
echo "     is not shown in the game; its picture or the text MOTD and OPEN PAGE"
echo "     instead. 1: shown with Edge WebView2, without Chromium's sandbox"
echo "     (needs the WebView2 runtime in the prefix). 2: the same with the GPU"
echo "     off, for a page that shows blank or black. Does nothing on Windows. A"
echo "     server cannot change it. docs\H9_MOTD.txt section 5."
echo
echo " A web page is shown live inside the panel (Microsoft Edge WebView2). ESC or"
echo " CLOSE close the splash; ESC works inside the page too. When a page cannot"
echo " be shown in the game, the panel says so and shows OPEN PAGE, which shows the"
echo " page's whole address first; only a click on OPEN IN BROWSER opens it."
echo
echo " Hosts turn it on with h9_motd image or page, and h9_motd_url 'https://...',"
echo " in configs\h9_motd.cfg or in a map's ts\mapconfigs\<map>.cfg. It is off by"
echo " default. The cvars are under CVAR REFERENCE. docs\H9_MOTD.txt explains it;"
echo " docs\HTTP_SERVER_MOTD.txt is the host's guide."
echo
echo
echo "==============================================================================="
echo " RESPAWN WAVES AND LIVES  (every class has lives; Assault has two)"
echo "==============================================================================="
echo
echo " Each class has tsm_class_lives lives per round, in class order: Assault 2,"
echo " every other class 1 (ts_matchmode.cfg). A death is still an elimination: the"
echo " voice, the kill report and the ghost are the usual ones. With lives left the"
echo " player waits for their team's next wave, and the wave brings them back with"
echo " the full loadout at one of their team's spawns. Running out of lives is the"
echo " ordinary elimination."
echo
echo " A mode that keeps ONE pool of lives for a side (Assault, below, which calls"
echo " it REINFORCEMENTS) replaces all of this: a death draws its class's cost"
echo " (tsm_class_cost) from the side's reinforcements, and tsm_class_lives is not"
echo " used."
echo
echo " A wave comes every tsm_respawn_wave seconds (60) and takes the players who"
echo " have been dead at least tsm_respawn_seconds (5), so a death just before a wave"
echo " waits for the next one. Waiting players see their wave timer. An Officer sees"
echo " their team's wave and the .reinforce cooldown. While anyone is waiting they"
echo " also see a list of them on the right of the screen. Someone out of lives sees"
echo " no timer, because they are fully out."
echo
echo " tsm_respawns 0 turns it all off: no wave is attempted and every elimination is"
echo " final. tsm_respawn_sudden 0 (the default) means nobody waiting comes back in the"
echo " last minute of a round."
echo
echo " BIGGER MATCHES. tsm_scale_players lists player counts, each the start of a"
echo " tier ('24,40,56' in ts_matchmode.cfg): a round that starts with 24 or more"
echo " players on the two sides, bots included, is tier 1, with 40 or more tier 2,"
echo " and with 56 or more tier 3. Each tier adds tsm_scale_limits (1) to every"
echo " class's limit a side, a class without a limit staying without one."
echo
echo " EXTRA LIVES. With tsm_respawns 1 a bigger match gives lives too: a class's"
echo " extra lives at a tier are its tsm_scale_lives number -- one number for every"
echo " class, or a list in class order -- times the tier's tsm_scale_lives_tiers"
echo " number: the first for tier 1, the second for tier 2, the last for any tier"
echo " past the list. A 0 in tsm_scale_lives leaves that class out; with"
echo " tsm_scale_lives_tiers empty, a tier's number is the tier itself, so each"
echo " tier adds tsm_scale_lives once more. The Siege setup (ts_matchmode.cfg and"
echo " the Siege preset) gives every class but the Mech one more life at tiers 1"
echo " and 2 and two at tier 3:"
echo "     tsm_scale_lives '1,1,1,1,1,1,1,1,0'"
echo "     tsm_scale_lives_tiers '1,1,2'"
echo " Team Elimination's preset plays one life and sets tsm_scale_lives 0."
echo
echo " PER MAP. tsm_class_limits and tsm_class_lives, as the configs and the map's"
echo " own mapconfig leave them, are the baseline: read again at every round"
echo " start, the tiers on top, so nothing is raised twice and a mapconfig's values"
echo " are what get raised. Every one of these cvars can be set in a map's"
echo " ts\mapconfigs\<map>.cfg for that map alone; the next map's configs set them"
echo " back. A small siege map that should scale sooner, count the Mech too and"
echo " give no extra life before tier 2 would say:"
echo "     tsm_scale_players '16,28,40'"
echo "     tsm_scale_lives '1'"
echo "     tsm_scale_lives_tiers '0,1,2'"
echo " Chat says when the tier changes (tsm_verbosity 1); tsm_scale_tier shows it."
echo " A mode's own class rules (Mech Warrior, Wave Survival) are not raised."
echo
echo " THE SCOREBOARD. While a match is under way the H9 client's scoreboard (reTS)"
echo " has a LIVES column: each player's lives left, the one being played included,"
echo " out of his class's lives ('1/2'), '-' on a side that never runs out (Wave"
echo " Survival's mutants), and each team's header row the sum of its players'"
echo " ('9/14'). ts_matchmode sends it in the H9Lives message as values change."
echo
echo " SCORE. With tsm_score 1 (the default) a player's points for the match are"
echo " his frags: the number every scoreboard already shows in its kill column and"
echo " sorts by -- Steam's TS client and the GoldSrc package's as much as H9XASH's --"
echo " and the server's player list reads too. Each side's points are the total in"
echo " its header row (TS's own TeamScore), and keep what its players earned after"
echo " they leave. TS's own frag for a kill is not added: the points are all there"
echo " is. They are cleared as each match begins and stay up through the warmup"
echo " after it. Every point is a cvar, so a map's ts\mapconfigs\<map>.cfg can set"
echo " its own:"
echo "     tsm_score_kill 2         an enemy eliminated"
echo "     tsm_score_teamkill -3    a teammate eliminated"
echo "     tsm_score_assist 1       an assist (the scoreboard's A)"
echo "     tsm_score_heal 1         a medic's heal"
echo "     tsm_score_resupply 1     an engineer's resupply that gave rounds"
echo "     tsm_score_plant 2        the siege satchel set"
echo "     tsm_score_objective 5    a siege objective destroyed"
echo "     tsm_score_zone 5         an uplink zone taken (Capture the Uplink)"
echo "     tsm_score_carry 1        every tsm_score_carry_secs (15) seconds carrying"
echo "                              the uplink"
echo "     tsm_score_wave 3         a survival wave cleared while still in play"
echo "     tsm_score_capture 10     a flag carried home and captured (Capture the Flag)"
echo "     tsm_score_return 3       a dropped flag taken back to its pad"
echo " Points are given in a round under way only. tsm_score 0 leaves TS's own"
echo " frags, its kills, alone. Other plugins read them with tsm_points(id) and"
echo " tsm_points_side(side), and a mode gives its own with tsm_points_award(id,"
echo " TSM_POINTS_ZONE, _CARRY, _WAVE, _CAPTURE or _RETURN) (include\tsm_api.inc). With tsm_logging 1"
echo " every award is a line in the debug log ('points: 3 +2 for an elimination')."
echo
echo " THE H9 SCOREBOARD with points on. The H9 client (reTS) heads the frags column"
echo " SCORE and puts the real kills in a K column beside it: every enemy each"
echo " player eliminated on this map, as A and D count this map too, with each"
echo " team's sum in its header (ts_matchmode sends them in H9Kills, byte slot and"
echo " short kills; slot 0 only says the frags are points). A teamkill is no kill"
echo " there. Other clients show the points under their own kill heading. With"
echo " tsm_score 0 no H9Kills is sent, and the board is the one it always was."
echo " Plugins read a player's assists with tsm_assists(id), and with"
echo " tsm_assists_ranked(id) those on kills no bot had a part in (ranked play)."
echo
echo " SIEGE: A FALL GIVES THE ROUND BACK. Every objective but the last leaves the"
echo " round going, and gives both sides back what a new round would, in the same"
echo " round:"
echo
echo "     tsm_siege_rewardlives 1   everyone's lives SET to their class's count"
echo "                               again -- never added to, so a full count stays"
echo "                               as it is -- and everyone eliminated, out of"
echo "                               lives or already waiting, comes back with their"
echo "                               side's next wave. Needs tsm_respawns 1; does"
echo "                               nothing in sudden death unless"
echo "                               tsm_respawn_sudden is 1 or the time below"
echo "                               lifts it first."
echo "     tsm_siege_extratime 1     the clock runs back toward a full"
echo "                               tsm_roundtime, by at most tsm_addtime seconds"
echo "                               (150, 2:30) a fall, never past the round time."
echo "                               See SUDDEN DEATH for what it does to the last"
echo "                               minute."
echo
echo " The last objective ends the round as it always has and gives nothing back."
echo
echo " SIEGE: THE ORDER THE OBJECTIVES FALL IN. The attackers take tsm_obj_1, then"
echo " tsm_obj_2 and on, the next one only, unless the map says otherwise:"
echo
echo "     tsm_linear_obj 1          numbered order, the default: a charge or a"
echo "                               gunshot counts on an objective only when every"
echo "                               lower number has fallen ('Objective 2 has to"
echo "                               fall first.')"
echo "     tsm_linear_obj 0          any order: every objective still standing is a"
echo "                               target, whatever its number, and the round is"
echo "                               the attackers' when none is left standing"
echo
echo " The cvar is read as the siege uses it, so a map's own"
echo " ts\mapconfigs\<map>.cfg sets it for that map alone, and the next map is back"
echo " on ts_matchmode.cfg's value:"
echo
echo "     // ts\mapconfigs\h9_siege_<map>.cfg"
echo "     tsm_linear_obj 0"
echo
echo " In any order a fall that leaves objectives standing gives the round back as"
echo " above, and the last objective to fall, whichever number that is, ends the"
echo " round: it is announced as 'the last one standing'. The markers and the glow"
echo " already show every objective standing, blue to the side that defends it, red"
echo " to the side that attacks it, white to anyone on no side. One satchel burns at"
echo " a time on either setting, and a forward spawn tier N (amx_tsm_spawn_add) is"
echo " used once N objectives have fallen, whichever they were: with objective 3"
echo " down first, tier 1 is in use, and tier 2 once a second one falls."
echo
echo
echo "==============================================================================="
echo " NO ECONOMY  (why weapons cannot be bought)"
echo "==============================================================================="
echo
echo " TS's equipment menu is SLOT-limited, not cash-limited, and it is client-side"
echo " VGUI -- there is no server-side 'buy' command to refuse. usecash 0 does not"
echo " close it either: with the economy off, CashBased() is false, nothing is ever"
echo " charged, and the menu becomes FREE."
echo
echo " So the economy is left ON and the wallet is kept empty, and TS does the"
echo " refusing itself with its own message. tsm_nocash 1 sets:"
echo
echo "     usecash 1          economy on, so a purchase is refusable at all"
echo "     initial_cash 0     no cash at spawn"
echo "     cashforwin 0       no cash for the winning side at round end"
echo "     cashforlose 0      no cash for the losing side either"
echo
echo " and then holds every player's cash at 0 every frame, which is the part that"
echo " actually guarantees it: a MAP can hand out cash directly through the"
echo " victorycash and defeatcash keyvalues on a ts_wingiver entity, and those are"
echo " baked into the .bsp where no cvar reaches them."
echo
echo " The class loadout is applied down that same purchase path, so it would be"
echo " refused too. The money is lent for the few frames that takes and taken"
echo " straight back, keyed on the same bypass flag the buy block uses."
echo
echo " The four cvars above are also set in ts/game.cfg, which TS execs at the top of"
echo " every map load -- before any plugin runs, so the first map of a session is"
echo " covered too."
echo
echo " On a map that is not H9's (WHICH GAME A MAP PLAYS) the plugin puts TS's own"
echo " values back instead -- usecash 0, initial_cash 1200, cashforwin 10000,"
echo " cashforlose 1200, nopowerup 0 -- and holds nobody's wallet: that map plays as"
echo " the game ships."
echo
echo
echo "==============================================================================="
echo " REQUIRED MODULES"
echo "==============================================================================="
echo
echo " What each plugin needs:"
echo
echo "     ts_matchmode     fakemeta, fun, hamsandwich, tsfun"
echo "     ts_uplink        fakemeta"
echo "     ts_survival      fakemeta, fun"
echo "     ts_mechwarrior   nothing beyond AMXX itself"
echo "     ts_advertise     nvault, and AmxxEasyHttp (a third-party module)"
echo "     Apollo RP        engine, fakemeta, fun, hamsandwich, tsfun, tsx, and"
echo "                      sqlite, which ARP_Core loads itself (#pragma loadlib)"
echo
echo " AMXX loads its own modules by itself when a plugin needs one. AmxxEasyHttp has"
echo " to be installed and listed in addons/amxmodx/configs/modules.ini."
echo
echo " ts_matchmode will not load without hamsandwich. Ham_TakeDamage is the only"
echo " friendly-fire block that works on bots -- register_event('Damage') is driven by"
echo " the network message sent to the damaged client, and a fake client is sent none,"
echo " so bot-on-bot friendly fire was never blocked at all."
echo
echo " tsfun provides ts_getusercash / ts_setusercash, which is how the wallet is held"
echo " at zero. Both are in the auto-detect list in a stock modules.ini."
echo
echo
echo "==============================================================================="
echo " RCBOT  (separate Metamod plugin, not part of this one)"
echo "==============================================================================="
echo
echo " Full reference: half-life/rcbot/rcbot_commands.txt"
echo
echo " rcbot addbot                         add one bot"
echo " rcbot config min_bots 0              live value; player can always join (kicks a bot if quota > 0)"
echo " rcbot config max_bots 20             live value; 10v10 bots total, +maxplayers 64 leaves 44 human slots"
echo " rcbot config balance_teams 1         rcbot evens its own bots across sides"
echo " rcbot autowaypoint <0|1|2>           drop waypoints as you walk"
echo " rcbot waypoint on|off|add|delete     manual waypointing"
echo " rcbot pathwaypoint ...               path editing"
echo
echo " Waypoints live in  half-life/rcbot/waypoints/ts/<mapname>.rcw  and are"
echo " REQUIRED -- bots will not navigate a map without them. 45 TS maps ship with"
echo " rcbot's own; the H9 maps carry theirs (h9_te_neuropolis, h9_te_meridian,"
echo " h9_tsrp_hive and the three drainage maps)."
echo " h9_tsrp_newbyzantium carries roam waypoints, laid in its public spaces only"
echo " for the roaming citizens (ROAMING CITIZENS, below)."
echo
echo " ROAM MODE (rcbot-patch CHANGE 8, rcbot-ts-roam.patch). While"
echo " tsrp_roambots.amxx runs citizens it holds tsrp_roambots_active at 1, and"
echo " then every bot roams: random waypoints for goals, at a walk"
echo " (tsrp_roambots_speed), a pause now and then (tsrp_roambots_pause), never a"
echo " jump or a crouch, no pickups, nothing bought, and weapons only with"
echo " tsrp_roambots_weapons 1. Its only enemy is whoever hurt it"
echo " (tsrp_roambots_defend), fought with its hands until he dies or leaves or"
echo " has not hurt it for tsrp_roambots_defend_time seconds, and, in an"
echo " insurgency (tsrp_roambots_insurgency), the players"
echo " tsrp_roambots_insurgent_team names, fought with the weapon in its hands."
echo " It is judged by how far it gets, not how fast it moves: about 5 seconds"
echo " without getting anywhere and it picks another goal, about 12 and it asks"
echo " the plugin to move it (tsrp_roambots_unstick); RCBot's own stuck check never"
echo " kills it. While the plugin holds it (FL_FROZEN, two citizens talking) it"
echo " stands and leaves its view alone. RCBot reads those cvars once a second;"
echo " there is no rcbot command or config setting for it. The same patch lets"
echo " waypoints reach +/-16384 across the map (stock RCBot drops any past +4096),"
echo " for H9's big-world maps."
echo
echo " POWERUPS (rcbot-patch CHANGE 10, rcbot-ts-powerups.patch). A bot walks to a"
echo " powerup it can see, and sets off the one it carries when it sights an"
echo " enemy. While the match mode is on, tsm_bot_powerups 0 stops both, whatever"
echo " nopowerup says: RCBot reads it once a second, as a bot's own 'usepowerup'"
echo " never reaches a plugin, and ts_matchmode refuses a bot's touch of a powerup"
echo " too. The plugin's default is 1; ts_matchmode.cfg and the TeamElimination,"
echo " Siege and Assault presets set 0. nopowerup 1 (game.cfg) already keeps everyone off them;"
echo " this is for a server that gives its players powerups but not its bots. The"
echo " Officer's kung fu and a mode's grants are not pickups and stay as they are."
echo " Needs rcbot_mm.dll built from all eight patches."
echo
echo " tsm_bots IS A COUNT: the plugin keeps that many bots on the server, adding one"
echo " every two seconds through rcbot (rcbot's own fill is switched off, max_bots -1)"
echo " and taking one away the same way when there are too many. It also sets"
echo " balance_teams 1, because only rcbot can move its own bots in a way TS agrees"
echo " with -- moving them plugin-side made bots shoot their own teammates and use the"
echo " wrong spawn points."
echo
echo " THE BOT FLOW. A bot is put on its side, renamed and given its class one at a"
echo " time, through a queue: tsm_bot_flow_step bots (1) every tsm_bot_flow_interval"
echo " seconds (0: 0.35 up to 32 player slots, 0.6 above, so 63 bots on a 64-slot"
echo " server are placed in about 38 seconds). The first human to pick a"
echo " side used to move every waiting bot in the same second -- with 63 bots that"
echo " burst of team changes, name changes and respawns froze a 64-slot server and"
echo " threw its clients off. A bot that already has its side, its name and its"
echo " class is never queued, a bot that leaves is taken out, and a round does not"
echo " go live while bots are still queued, for as long as their pace needs and at"
echo " most 45 seconds ('Waiting for N bot(s) to take their places')."
echo
echo " tsm_bots 0 zeroes rcbot's quota and kicks every bot, a quarter second apart."
echo " A change in the console lasts for the map: ts_matchmode.cfg runs again as every"
echo " map loads and puts its value back. To keep bots off, set tsm_bots 0 in"
echo " ts_matchmode.cfg, or in a map's mapconfig for that map. On a map that is not"
echo " H9's the plugin sets 0 for that map by itself."
echo
echo " With bots on, the bots sit in SPECTATOR until a human picks a side. Filling"
echo " starts from that point, so the first person to join is not dropped into a server"
echo " whose teams were already settled without them. If nothing is happening and the"
echo " server is all bots, that is why -- join a side."
echo
echo " WHAT THE PLUGIN CAN AND CANNOT MAKE BOTS DO"
echo
echo " Can:  put them on the right side, name them, give them a class loadout, keep them"
echo "       supplied with ammunition, stop them damaging their own team, and order them"
echo "       to follow an Officer."
echo
echo " Can:  stop them TARGETING a teammate, indirectly. rcbot picks its own targets and"
echo "       its team support for TS is broken upstream, so there is no way to tell it a"
echo "       player is a teammate -- but the line it traces to ask whether it can SEE one"
echo "       goes through the engine, and that is reachable. tsm_bot_blind_ff makes those"
echo "       traces come back empty, so a teammate is never a candidate."
echo
echo "       The trade: bots shoot through teammates at enemies behind them. Harmless,"
echo "       since friendly damage is refused anyway. Set tsm_bot_blind_ff 0 to undo it."
echo
echo " Cannot:  make them reload or switch weapons sensibly. rcbot never saw the weapons"
echo "       we gave them, because the loadout is written through TS buy commands rather"
echo "       than picked up off the floor. tsm_bot_resupply works around it by keeping"
echo "       them from ever running dry."
echo
echo " Bots are renamed after the side they land on: Enforcer 1, Insurgent 1 and so on"
echo " (tsm_bot_names, tsm_bot_name1, tsm_bot_name2). Set tsm_bot_names 0 to keep"
echo " rcbot's own profile names."
echo
echo
echo "==============================================================================="
echo " ROAMING CITIZENS  (tsrp_roambots.amxx, configs\tsrp_roambots.cfg)"
echo "==============================================================================="
echo
echo " RCBots that walk a roleplay city's public streets, plazas, halls, galleries"
echo " and stairs at the pace of a player's walk key, stop now and then to look"
echo " about or to talk, and never pick anything up or buy, so the city looks lived"
echo " in. They keep out of homes, shops and MSR space because the map's roam"
echo " waypoints do: they are laid in its public spaces only. Players can hurt and"
echo " kill them (tsrp_roambots_god 1 stops that); a citizen someone hurts fights"
echo " that one back with its hands until he dies or leaves, or has not hurt it"
echo " for tsrp_roambots_defend_time seconds (tsrp_roambots_defend); a killed"
echo " citizen is back at once in another district with another face, and its"
echo " body stays where it fell."
echo
echo " WHICH MAPS. Roleplay maps only -- rp_ or tsrp_ at the start of the name, or"
echo " _rp_ or _tsrp_ in it, the same test that turns the match mode off -- and only"
echo " those whose mapconfig asks for them. On every other map the plugin does"
echo " nothing at all. It also stands down where a mapconfig turns the match mode"
echo " back on (tsm_enabled 1)."
echo
echo " TURNING THEM ON, in the map's ts\mapconfigs\<map>.cfg, as"
echo " h9_tsrp_newbyzantium.cfg does (h9_tsrp_hive.cfg too, with the first two):"
echo
echo "  tsrp_roambots 1"
echo "  tsrp_roambots_count 32"
echo "  tsrp_roambots_weapons 0"
echo "  tsrp_roambots_models 'proletarian_healthy:m;proletarian:m;prole_fem:f;prole_bfem:f'"
echo
echo " NAMES MATCH FACES. Each model carries its gender after a colon, ':f' or"
echo " ':m'; one without is neither. A citizen's name comes from the list for its"
echo " face's gender -- tsrp_roambots_names_f, tsrp_roambots_names_m, or"
echo " tsrp_roambots_names for a face with none; empty, the plugin's own 40, 40 and"
echo " 16 -- one no other citizen has had on the map while the list lasts, and the"
echo " new face it gets after a death is one of the same gender, so the name still"
echo " fits. Citizens are named as they join, one every two seconds."
echo
echo " The map needs its roam waypoints too, rcbot/waypoints/ts/<map>.rcw, and the"
echo " places its citizens appear, configs\tsrp_roamspots_<map>.cfg (a district and"
echo " a place on each line). New Byzantium's build lays both, from its plan's"
echo " public spaces (export-map\h9_tsrp_newbyzantium\roamwaypoints.mjs). The"
echo " plugin reads the mapconfig's tsrp_roambots lines itself as well, so they"
echo " hold on a server that does not run mapconfigs; configs\tsrp_roambots.cfg"
echo " holds the server's defaults, and every value goes back to them as each"
echo " roleplay map loads."
echo
echo " SLOTS. tsrp_roambots_reserve slots are always left free for real players."
echo " When people join, a citizen leaves (a dead one, or the one farthest from"
echo " everyone); they come back one every two seconds as people leave. rcbot's"
echo " own fill is switched off (min_bots -1, max_bots -1) while they run."
echo
echo " GETTING STUCK. A citizen that gets nowhere for about 5 seconds picks another"
echo " goal; after about 12 it is moved, quietly, as after a death but without one:"
echo " to another district, with a new face -- once no real player near it can see"
echo " it go. RCBot asks for that (the server command tsrp_roambots_unstick); it"
echo " judges by distance, so a citizen walking into a wall counts as stuck."
echo
echo " TALKING. Two citizens who meet -- within tsrp_roambots_talk_range, level, in"
echo " sight of each other, on the ground and unhurt -- stop with the chance"
echo " tsrp_roambots_talk, face each other and murmur in turns for 3 to 6 seconds,"
echo " then walk on. A pair is asked once as they pass. The murmurs are"
echo " sound\h9\murmur\murmur1.wav to murmur6.wav; each is precached only when it"
echo " is installed, so without them the citizens still stop, silently. A hurt"
echo " talker, or an insurgency, ends a talk at once."
echo
echo " A WORD TO A PLAYER. Press +use (E) on a citizen within reach and it murmurs"
echo " to you, from where it stands, and turns to face you for a moment"
echo " (tsrp_roambots_use). Then that citizen, and you, wait"
echo " tsrp_roambots_use_cooldown seconds before the next. A citizen that is"
echo " talking, hurt in this life, or an insurgent has nothing to say."
echo
echo " INSURGENCY. .insurgency (below) turns every citizen into an insurgent: the"
echo " insurgent version of its face (tsrp_roambots_insurgent_models,"
echo " 'civilian:insurgent' pairs), the weapons of tsrp_roambots_insurgent_weapons"
echo " ('id:magazines' as the class lines), and RCBot sets them on the players --"
echo " every player who is not a bot, or, with tsrp_roambots_insurgent_team set,"
echo " only that team's (the guards, once RP teamplay runs; never the civilians)."
echo " They take up arms one at a time, a quarter of a second apart, as the match"
echo " mode arms its players: the first weapon listed is given last, so it is the"
echo " one in their hands and the one they fight with. A killed insurgent comes"
echo " back an insurgent; of everything TS throws down as it dies, only the gun"
echo " in its hands is left (tsrp_roambots_insurgent_drop 0: nothing). .civilians"
echo " puts them down the same way, one at a time, leaving nothing on the ground,"
echo " and they come back as citizens. A mapconfig can start its map in an"
echo " insurgency (tsrp_roambots_insurgency 1) or switch both commands off"
echo " (tsrp_roambots_commands 0)."
echo
echo " .insurgency  /  .civilians        (chat, roleplay maps; an admin with the"
echo "                                   flags of tsrp_roambots_admin_flag, 'h' by"
echo "                                   default; empty: anyone)"
echo "     Start the insurgency, or end it. Everyone is told in chat."
echo
echo " amx_roambots                      (server console, or an admin)"
echo "     What the citizens are doing: the cvars, how many models, names, spots and"
echo "     murmurs the plugin has, every counter (ticks, postthink calls, joins"
echo "     asked, citizens adopted and sent away, spawns, placements, pickups"
echo "     refused, weapons dropped, thrown weapons taken off the ground or left"
echo "     because TS had slowed them, stuck citizens asked about, waited for and"
echo "     moved, talks, murmurs, insurgents armed and put down, murmurs to"
echo "     players on +use), whether the insurgency's pace is running, and each"
echo "     citizen: name, model, alive, district, where and how fast, and whether"
echo "     it is an insurgent, talking or facing a player. On a map that is not a"
echo "     roleplay map it says it does nothing there."
echo
echo
echo "==============================================================================="
echo " APOLLO RP  (ARP_*.amxx; apollo-rp\ in TSM, ORIGIN.txt says from where)"
echo "==============================================================================="
echo
echo " Apollo RP, github.com/DouglasSherk/Apollo-RP, copied whole with H9's changes"
echo " (apollo-rp\H9.patch): jobs, money and a bank, items, property and door keys,"
echo " jail, robbing, NPCs, zones and roleplay chat. Its own help is in the game:"
echo " arp_help in the console, /menu in chat."
echo
echo " WHICH MAPS. Roleplay maps only -- rp_ or tsrp_ at the start of the name, or"
echo " _rp_ or _tsrp_ in it, the match mode's own test. On any other map ARP_Core"
echo " pauses every ARP plugin before they do anything: they stay loaded (amx_plugins"
echo " lists them as paused) and touch nothing, not the map, the database or a"
echo " player."
echo
echo " ITS DATA. One SQLite database, addons\amxmodx\data\sqlite3\arp.sq3 (arp.ini:"
echo " arp_sql_type, arp_sql_db), opened only on a roleplay map. Players' money, jobs"
echo " and items are shared by every roleplay map; a map's properties, doors and keys"
echo " are its own, in tables named after it: arp_property_<map>, arp_doors_<map>,"
echo " arp_keys_<map>. Its NPCs, jail, rob spots and zones are files in"
echo " configs\arp\maps\<map>\ -- without that folder the map runs ARP with none of"
echo " them, and the core logs 'Configuration directory missing'."
echo
echo " FILES. build.bat builds ARP_Core, ARP_Commands, ARP_Config, ARP_HUD,"
echo " ARP_HungerMod, ARP_Items, ARP_JailMod, ARP_NPCs, ARP_RobMod, ARP_TalkArea,"
echo " ARP_Zones and ARP_TS, lists them in plugins.ini with ARP_Core first, and"
echo " installs configs\arp\ (arp.ini, arp.cfg, the maps' folders), models\arp and"
echo " sound\arp. Edit them in apollo-rp\ in TSM: build.bat copies them over the"
echo " game's. 'build.bat apollo' builds Apollo RP alone."
echo
echo
echo "==============================================================================="
echo " ROCK THE VOTE  (ts_rtv.amxx, configs\ts_rtv.cfg)"
echo "==============================================================================="
echo
echo " Built on 'Rock The Vote' 1.0 by Destroyer7 (AlliedModders, thread 351317),"
echo " whose plugin it is; the original file states no licence."
echo
echo " .rtv, .unrtv, .nominate [name], .unnominate     (chat; PLAYER COMMANDS, above)"
echo
echo " THE ROCK. Each person says .rtv once. When 60% of the people on the server"
echo " have, rounded up, the map is put to a vote. Bots never count and never vote;"
echo " spectators do, because between matches the match mode parks everyone without"
echo " a side on the spectator team, and a ts_ map plays TS deathmatch, which has no"
echo " teams to tell apart. The 60% is of whoever is here now, worked out again as"
echo " people come and go, and a player who leaves takes his .rtv, his nomination"
echo " and his vote with him. Alone on a server, your .rtv is all it takes."
echo
echo " NOT DURING A MATCH. With tsm_rtv_in_match 0 (the default), .rtv is refused"
echo " while a match is in progress: a round frozen, live or just ended, or a match"
echo " halted for uneven sides with its score kept. Warmup, the ready-up before a"
echo " match and the seconds after one are open."
echo
echo " NOT ON A ROLEPLAY MAP. With tsm_rtv_roleplay 0 (the default), a roleplay map"
echo " -- rp_ or tsrp_ at the start of its name, _rp_ or _tsrp_ inside it, the match"
echo " mode's own rule, so h9_tsrp_hive is one -- has no map vote at all: .rtv,"
echo " .unrtv, .nominate and .unnominate are answered 'Rock the vote is off on"
echo " roleplay maps.', and no vote starts there, the one after a match included."
echo
echo " THE VOTE. Everyone gets a menu of tsm_rtv_maps maps (6) for 20 seconds; the"
echo " number keys vote, 0 passes, and .rtv brings the menu back if a TS panel took"
echo " it. Nominations go on first, up to tsm_rtv_nominations (4); the rest are"
echo " drawn at random. Most votes win, a tie is drawn, and the map changes 5"
echo " seconds later. A vote nobody answers keeps the map -- unless tsm_rtv_auto is"
echo " 1, when it picks one of the vote's maps at random."
echo
echo " AFTER A MATCH. With tsm_rtv_auto 1 (the default), a vote starts by itself"
echo " ten seconds after a match is played to its end -- a side reaching the win"
echo " total, or a Wave Survival run ending -- with the map just played kept as the"
echo " last choice, 'Keep <map>', for a rematch. A match cancelled, forfeited or"
echo " left with an empty side starts none."
echo
echo " THE SIDE MENU WAITS. The match mode's side menu comes after the vote: it is"
echo " not offered in the ten seconds before tsm_rtv_auto's vote, nor, while a vote"
echo " runs, to a player who has not answered it with a map or 0, nor to anyone"
echo " while the map changes to the winner. 'The map vote comes first; the side"
echo " menu follows it.' says so, and the menu comes up once he has answered or"
echo " the vote is over (ts_rtv's rtv_vote_running and rtv_player_voted; without"
echo " ts_rtv the menu never waits)."
echo
echo " WHICH MAPS. Read from the maps folder of the install, every time:"
echo "   - the match mode on for this map (tsm_enabled 1): H9's game-mode maps only,"
echo "     every h9_ map that is not a roleplay one -- not h9_tsrp_, not one with"
echo "     rp_ or tsrp_ in its name -- so the te, siege, mw, up, ws and the like."
echo "   - the match mode off (a ts_ map, a roleplay map, any map TS plays as it"
echo "     ships): any other map installed on the server, H9's included."
echo " Never the map being played, and only what the current one allows can be"
echo " nominated."
echo
echo " NOMINATIONS. .nominate takes part of a name: 'neuro' matches every map with"
echo " neuro in its name, h9_te_neuropolis and h9_siege_neuropolis among them, and"
echo " offers them in a menu; a whole name is taken at once. One each, a new one"
echo " replacing the old; a map someone else has nominated is refused, and"
echo " once the vote has tsm_rtv_nominations of them no more are taken. They last"
echo " until their player leaves or the map changes; tsm_rtv_nominations 0 turns"
echo " .nominate off."
echo
echo
echo "==============================================================================="
echo " DIAGNOSTIC PROBE  (ts_probe.amxx: built, not loaded -- ;ts_probe.amxx)"
echo "==============================================================================="
echo
echo " A throwaway diagnostic: it measures what TS does with teams, observer"
echo " mode, models and weapon gives, on the live server. Put it back in"
echo " plugins.ini (remove the ;) to use it. All ADMIN_CFG, from the console."
echo
echo " ts_probe_help                        lists the probe commands"
echo " ts_probe_info                        modules, cvars, the AMX Mod X version"
echo " ts_probe_teams                       every player's team number and name"
echo " ts_probe_obs <target>                do observer vars stick on him?"
echo " ts_probe_model <target> <model>      does a forced model stick?"
echo " ts_probe_dead <target>               the full dead treatment: observer,"
echo "                                      hidden, not solid, unhurt"
echo " ts_probe_undead <target>             undoes ts_probe_dead and ts_probe_obs"
echo " ts_probe_team <target> <team>        tries every way of setting a team, and"
echo "                                      says which works"
echo " ts_probe_give <target> <id> [clips]  does ts_giveweapon get past"
echo "                                      weaponrestriction?"
echo " ts_probe_ammo <target> [id] [clips]  what ts_giveweapon's clips mean, by"
echo "                                      draining reloads"
echo " ts_probe_m60 <target>                every way of giving the M60 (id 32),"
echo "                                      each result logged"
echo
echo
echo "==============================================================================="
echo " ORDER OF OPERATIONS FOR A NEW MAP"
echo "==============================================================================="
echo
echo " 0. Name it for its mode (WHICH GAME A MAP PLAYS; docs\GAME_MODES.txt has the"
echo "    whole setup for each mode)."
echo " 1. Load the map."
echo " 2. amx_tsm_spawn_add 1   at several positions on one side"
echo "    amx_tsm_spawn_add 2   at several positions on the other"
echo "    -- it refuses on the map's own spawn points; step off them"
echo " 3. amx_tsm_spawn_list    confirm no position appears under both teams"
echo " 4. amx_tsm_spawn_save"
echo " 5. rcbot autowaypoint 1, walk the map, save per rcbot's docs"
echo " 6. Restart, then amx_tsm_debug to confirm the spawn cfg loaded"
echo
echo
echo "==============================================================================="
echo " WHICH GAME A MAP PLAYS"
echo "==============================================================================="
echo
echo " The map's name decides, as it loads: h9_te_ Team Elimination, h9_siege_ Siege,"
echo " h9_up_ Capture the Uplink, h9_ws_ Wave Survival, h9_mw_ Mech Warrior, h9_as_"
echo " Assault, h9_ctf_ Capture the Flag; any other h9_ or tsm_ name plays the match mode too. A stock ts_ map,"
echo " a roleplay map and"
echo " TS's own modes under H9 names (h9_dm_, h9_tdm_, h9_ctb_), and a map"
echo " named for TS's capture game (ctb_ or ctf_ at the start, _ctb_ or _ctf_ anywhere:"
echo " ctb_deadheat) play as the game ships: tsm_enabled 0, tsm_bots 0, TS's own cash, powerups and weapon"
echo " rules (weaponrestriction 0: the buy menu works), and the"
echo " plugin picks deathmatch or teamplay rules for them before the world spawns. A"
echo " tsm_enabled or mp_teamplay line in the map's own ts\mapconfigs\<map>.cfg"
echo " decides in place of the name. The full list, and how to set up a map for each"
echo " mode, is docs\GAME_MODES.txt."
echo
echo " The server log says what each map got:"
echo
echo "     [TSM] h9_te_neuropolis: an H9 map, the match mode plays, on teamplay rules."
echo "     [TSM] ts_bikini: not an H9 map, the game as it ships, on deathmatch rules."
echo
echo " A roleplay map -- rp_ or tsrp_ at the start of its name, or _rp_ or _tsrp_"
echo " inside it, h9_tsrp_ among them -- is reported as 'Roleplay': the server's"
echo " game description, which havoc9.org's server list, the in-game browser and"
echo " the other lists show in place of TS's 'The Specialists (DM)', and the H9"
echo " client's scoreboard heading for its list of players (H9Board), where any"
echo " other map without teams reads 'Free for all'. The match mode stays off"
echo " there all the same."
echo
echo
echo "==============================================================================="
echo " CAPTURE THE UPLINK  (ts_uplink.amxx)"
echo "==============================================================================="
echo
echo " dropuplink                      (console; bind a key to it)"
echo " .drop                           (chat)"
echo "     Let the uplink go, if you carry it. It lies where it falls and goes home"
echo "     after tsm_uplink_return seconds untouched. Anyone else's .drop goes out as"
echo "     ordinary chat."
echo
echo " amx_tsm_cap_add [n] [radius]    (admin, ADMIN_CFG)"
echo "     A control zone where you stand: the next free number, or zone n, with a"
echo "     radius of tsm_cap_radius (128) unless one is given. Nothing is kept until"
echo "     amx_tsm_uplink_save."
echo
echo " amx_tsm_cap_del <n>             (admin)"
echo "     Remove zone n."
echo
echo " amx_tsm_cap_list                (admin)"
echo "     Every zone: its number, where it is, its radius, and who holds it."
echo
echo " amx_tsm_cap_give <n> <0|1|2>    (admin)"
echo "     Hand zone n to a side (0 neutral) as though it had been taken: to test the"
echo "     rings, the flags, the lives reward and the win."
echo
echo " amx_tsm_uplink_set              (admin)"
echo "     The uplink's point, where you stand."
echo
echo " amx_tsm_uplink_save             (admin)"
echo "     Write this map's zones and uplink point to configs\tsm_uplink_<map>.cfg,"
echo "     which is read as the map loads."
echo
echo " amx_tsm_uplink                  (admin)"
echo "     The mode's whole state: its build, whether it claimed the map, the zones"
echo "     and who holds them, the uplink and its carrier, the wave interval."
echo
echo " tsm_cap <n> <x> <y> <z> [radius]    (server command)"
echo " tsm_uplink_at <x> <y> <z>           (server command)"
echo "     What configs\tsm_uplink_<map>.cfg is made of. Hand edits are fine."
echo
echo " Taking a zone sets the taking side's lives back to their class counts and"
echo " brings its fallen back at once (tsm_uplink_rewardlives). On an uplink map"
echo " tsm_uplink_wave, not tsm_respawn_wave, sets both sides' respawn waves, and"
echo " .reinforce resets to it too. The mode is described in docs\GAME_MODES.txt."
echo
echo " Score: whoever takes a zone gets tsm_score_zone, and the carrier gets"
echo " tsm_score_carry for every tsm_score_carry_secs seconds he carries it in a"
echo " live round (ts_matchmode's SCORE)."
echo
echo
echo "==============================================================================="
echo " WAVE SURVIVAL  (ts_survival.amxx)"
echo "==============================================================================="
echo
echo " amx_tsm_ws                      (admin, ADMIN_CFG)"
echo "     The mode's whole state: its build, the wave and the best on this map, the"
echo "     gun odds, the mutants up, the breather and the stall clock."
echo
echo " amx_tsm_ws_wave <n>             (admin)"
echo "     Set the wave count, to see how the waves grow without playing up to them."
echo
echo " Each new wave brings the fallen survivors back, sets every survivor's lives to"
echo " their class's count, and is a new round for the once-a-round abilities: .stim,"
echo " .ammo, the class abilities and the Mech's rockets are all ready again."
echo
echo " A survivor who goes down is told plainly in chat how many lives he has left"
echo " and when he is back: at his side's next respawn (the countdown on his screen)"
echo " or when the wave of mutants is cleared; with none left, when his side clears"
echo " the wave. The mode says it through ts_matchmode's tsm_life_lost forward."
echo
echo " Score: every survivor still in play when a wave is cleared gets"
echo " tsm_score_wave (ts_matchmode's SCORE)."
echo
echo
echo "==============================================================================="
echo " MECH WARRIOR  (ts_mechwarrior.amxx)"
echo "==============================================================================="
echo
echo " amx_tsm_mw                      (admin, ADMIN_CFG)"
echo "     The mode's whole state: its build, whether it claimed the map, the"
echo "     Officer's and the Mech's classes with their limits and lives, and who is"
echo "     still in the round on each side."
echo
echo " One Officer a side on two lives, any number of Mechs on three; every other"
echo " class is off the class menu, and every bot plays a Mech. The tsm_mw_* cvars"
echo " below set the counts."
echo
echo " A Mech that does a TS stunt -- a dive, a cartwheel, a wall jump or climb, a"
echo " roll -- sounds a hydraulic surge as it leaps and a heavy stomp as it lands, in"
echo " any mode."
echo
echo
echo "==============================================================================="
echo " ASSAULT  (ts_assault.amxx)"
echo "==============================================================================="
echo
echo " amx_tsm_as_add [n] [radius]     (admin, ADMIN_CFG)"
echo "     A capture point where you stand (at your feet): the next free number, or"
echo "     point n, with a radius of tsm_as_radius (384) unless one is given. Two"
echo "     points make the map an assault map. Nothing is kept until"
echo "     amx_tsm_as_save. Its respawn set is tier n of the spawn file: stand where"
echo "     the side should come back and amx_tsm_spawn_add <team> n."
echo
echo " amx_tsm_as_del <n>              (admin)"
echo "     Remove point n."
echo
echo " amx_tsm_as_list                 (admin)"
echo "     Every point: its number and letter, where it is, its radius, who holds it,"
echo "     and whether the map or the config placed it."
echo
echo " amx_tsm_as_give <n> <0|1|2>     (admin)"
echo "     Hand point n to a side (0 neutral) as though it had been taken: to test the"
echo "     rings, the marks, the reinforcements, the spawn sets and the win."
echo
echo " amx_tsm_as_radius <n> <radius>  (admin)"
echo "     How far point n reaches, 32 units or more."
echo
echo " amx_tsm_as_save                 (admin)"
echo "     Write this map's points to configs\tsm_assault_<map>.cfg, which is read as"
echo "     the map loads. Only the points the config or the editor placed are written:"
echo "     a point that came with the map is the map's."
echo
echo " amx_tsm_assault                 (admin)"
echo "     The mode's whole state: its build, whether it claimed the map, the points"
echo "     and who holds them, both sides' reinforcements, the taking rules, which games"
echo "     are shown the marks and which are given TS's own objective markers."
echo
echo " tsm_as_zone <n> <x> <y> <z> [radius]    (server command)"
echo "     What configs\tsm_assault_<map>.cfg is made of. Hand edits are fine."
echo
echo " Any player of a side standing in a point with no living enemy in it takes it,"
echo " faster with each more of them. A taken point adds tsm_as_capture_reinforcements"
echo " to the taker's reinforcements, opens the respawn set of its number to the taker"
echo " (and closes it for the other side), and sends the taker's fallen back in a wave"
echo " at once. In the wave a side's dead come back at the point it holds nearest the"
echo " enemy's base. On an"
echo " assault map tsm_as_wave, not tsm_respawn_wave, sets both sides' respawn waves."
echo " There are no rounds in Assault unless h9_assault_rounds is 1: the first round"
echo " that ends is the whole match, the match bar says MATCH, and the side that won"
echo " it is the match's winner."
echo " Every point is drawn on every player's screen through the walls: H9 games show"
echo " badges (cl_h9_marks), any other game gets TS's own objective markers. The mode"
echo " is described in docs\GAME_MODES.txt."
echo
echo " Score: whoever stands in a point as it is taken gets tsm_score_zone"
echo " (ts_matchmode's SCORE)."
echo
echo
echo "==============================================================================="
echo " CAPTURE THE FLAG  (ts_ctf.amxx)"
echo "==============================================================================="
echo
echo " dropflag                        (console command, bindable)"
echo "     The carrier lets the flag go where he stands; .drop in chat does the"
echo "     same. Anyone who carries nothing is told so."
echo
echo " amx_tsm_cf_pad <1|2>            (admin, ADMIN_CFG)"
echo "     That side's flag pad where you stand (at your feet). Both pads make the"
echo "     map a flag map. Nothing is kept until amx_tsm_cf_save."
echo
echo " amx_tsm_cf_list                 (admin)"
echo "     The two pads, and where each flag is: at its pad, carried or dropped."
echo
echo " amx_tsm_cf_save                 (admin)"
echo "     Write this map's pads to configs\tsm_ctf_<map>.cfg, which is read as the"
echo "     map loads."
echo
echo " amx_tsm_ctf                     (admin)"
echo "     The mode's whole state: its build, whether it claimed the map, the"
echo "     captures, the rules in force, which flag model and rings it found, and"
echo "     the pads."
echo
echo " amx_tsm_cf_give <flag side 1|2> <0|1|2>   (admin)"
echo "     To test, in a live round: hand side <flag>'s flag to the first player of"
echo "     the side given (a person before a bot), or put it back at its pad (0)."
echo
echo " amx_tsm_cf_tp <side> <pad 1|2>  (admin)"
echo "     To test: <side>'s carrier (else its first person in play) walks onto that"
echo "     pad: the carrier at his own pad, to see a capture."
echo
echo " tsm_cf_pad <side> <x> <y> <z>   (server command)"
echo "     What configs\tsm_ctf_<map>.cfg is made of. Hand edits are fine."
echo
echo " A side takes the enemy's flag by walking over it and scores by bringing it to"
echo " its own pad, while its own flag is at its pad (tsm_cf_needhome). A flag"
echo " changes colour with whoever has it: its own side's at its pad, the carrier's"
echo " while carried, grey where it lies. A dropped flag is taken back at once by its"
echo " own side, or flies home after tsm_cf_return seconds. Every flag and pad is"
echo " drawn on every player's screen through the walls: H9 games show badges"
echo " (cl_h9_marks), any other game gets TS's own objective markers. The first"
echo " round that ends is the whole match unless h9_ctf_rounds is 1. The mode is"
echo " described in docs\GAME_MODES.txt."
echo
echo " Score: a capture gives tsm_score_capture, a return tsm_score_return and a"
echo " second carried tsm_score_carry (ts_matchmode's SCORE)."
echo
echo
echo "==============================================================================="
echo " H9XASH CLIENT  (the H9XASH engine's own; typed in the game's console)"
echo "==============================================================================="
echo
echo " spray                           list the pictures on the ts\logos shelf"
