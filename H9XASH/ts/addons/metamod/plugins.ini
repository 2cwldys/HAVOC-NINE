;; Metamod plugins.ini
; AMX Mod X 1.8.2

win32   addons\amxmodx\dlls\amxmodx_mm.dll
; Enable this instead for binary logging
; win32   addons\amxmodx\dlls\amxmodx_bl_mm.dll

; RCBot -- must be present at server START (declares PT_STARTUP); cannot be meta load'ed
win32   ..\rcbot\dlls\rcbot_mm.dll

; EntMod -- entity admin tools (reconstructed). Loaded always; inert unless the map is an entmap or
; the server sets "entmod 1" (which also de-ranks: no career XP / ELO while active).
win32   addons\EntMod\dlls\EntMod_MM.dll
linux   addons/EntMod/dlls/EntMod_i386.so

; HookMod -- grappling hook (reconstructed). Same entmap/entmod gate; DF_hook_on is its own switch.
win32   addons\HookMod\dlls\HookMod_MM.dll
linux   addons/HookMod/dlls/HookMod_i386.so
