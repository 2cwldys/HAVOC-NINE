; Apollo RP's zones on h9_tsrp_hive (the Zones plugin, ARP_Zones): the three cities, stacked in z.
; A zone is its name on a line, then a block in braces with the two corners of a box: "boundaries1"
; and "boundaries2", each "x y z" (in any order). The HUD's Location line names the zone whose box
; holds the player's origin, and keeps it until he enters another. The boxes must not overlap (a player
; in two of them would flip between them every second). A comment starts with ; in column 0.
; The boxes cover the map sideways (9000 each way; the world is x -3968 to 3792, y -4036 to 4040)
; and meet in z on the two solid caps between the cities: z -1488 (Alexandria below, Paradise City
; above) and z 411 (Paradise City below, Xenon City above). No player's origin is possible within 40
; units of either plane (docs\ARP_CONTENT.txt, 7).
"Alexandria"
{
"boundaries1" "-9000 -9000 -9000"
"boundaries2" "9000 9000 -1488"
}
"Paradise City"
{
"boundaries1" "-9000 -9000 -1488"
"boundaries2" "9000 9000 411"
}
"Xenon City"
{
"boundaries1" "-9000 -9000 411"
"boundaries2" "9000 9000 9000"
}
