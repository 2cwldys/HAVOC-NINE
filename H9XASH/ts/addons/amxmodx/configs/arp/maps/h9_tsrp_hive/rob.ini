; Apollo RP's robberies on h9_tsrp_hive (ARP_RobMod).
; A shop's menu shows "* Rob" when its block in npcs.ini has a robprofile line that names one of these profiles.
; Delete this file, or a robprofile line, and that place cannot be robbed.
;
; A profile is [name], its settings, then its script (the lines that start with !; a line that starts with @
; runs when the robbery ends).
;   minplayers, mincops  players and police (access letter a) that must be on the server
;   flags                an access letter that may not rob here: a, the police
;   cooldown             seconds between two robberies; one clock for the whole map
;   cashsecond, cashmax  what the robber takes a second, and the most he can take (credits)
;   stopon               what ends it, as a sum: 1 cuffed, 2 killed, 4 leaves the radius, 8 has taken it all
;   radius, origin       how far he may stray from where it happens
; ARP_RobMod reads each setting by its word (cuffedend, killedend, leaveend, doneend, start), so a message
; must hold none of the other settings' words. Every line stays under 120 characters.

[Pawn Prawn]

; Settings
cashsecond 10
cashmax 300
stopon 15
cooldown 120
cuffedend "#name# has been arrested while robbing Pawn Prawn!"
killedend "#name# has been killed while robbing Pawn Prawn!"
leaveend "#name# has left Pawn Prawn while robbing!"
doneend "#name# has taken all of the money from Pawn Prawn!"
start "#name# is robbing Pawn Prawn!"
minplayers 3
mincops 1
flags a
radius 200
origin "-795 1900 -259"

; Script
!sound arp/alarm.wav
!glow "255 0 0"
!lights "255 0 0 20 1 20"
!wait 3
!lights "255 0 0 20 1 20"
!wait 3
!lights "255 0 0 20 1 20"
!wait 3
!lights "255 0 0 20 1 20"
!glow "0 0 255"
@!glow "0 0 0"

