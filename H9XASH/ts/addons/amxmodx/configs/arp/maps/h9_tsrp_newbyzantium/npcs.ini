; Apollo RP's NPCs on h9_tsrp_newbyzantium (ARP_NPCs): New Byzantium.
; docs\ARP_CONTENT.txt lists them and says how to move or change one.
; Every NPC stands in a room of the city (a shop, a bar, a clinic, the banking hall, the precinct
; lobby), beside its counter and facing the door. The room of each is in docs\ARP_CONTENT.txt.
; Each NPC is a block that ends with [END]:
;   type    shop, bank, doctor, gunshop or atm
;   name    what the screen says over it (a bank's name must hold the word bank:
;           /withdraw and /deposit look for it)
;   model   an H9XASH player model; an NPC whose model file is missing is left out,
;           and its lines go to the next NPC
;   angle   the way it faces plus 180 (ARP subtracts 180)
;   origin  where a standing player's origin would be: 36 over the floor
;   sell    an item and its price (underscores stand for spaces)
;   heal    the price of a heal (a doctor)
;   addgun  a gun, its price and 0 permitted, 1 restricted, 2 a licence (a gunshop)
;   property  the internal name of the property a shop or a gun shop sells for: arp_profit_fraction of
;             each sale is added to its profit, which its owner takes with /profit, and which goes to
;             the town's treasury when the server takes the property back (arp_h9_tax_treasury).
;             ARP_NPCs reads ANY line that holds the word property as this line (unless it holds
;             name, type, model, angle, origin, sell, heal, addgun or zone: those win), so no other
;             line of a block may hold the word property, and a property's name must hold none of
;             those nine words. An NPC without the line earns nobody anything.
; At most 50 NPCs to a map. A line must stay under 120 characters.
; Only a line that starts with ; is a comment.
; None of the 17 shops and gun shops has a property line: this map's file defines 30 properties, all of
; them state property (no owner, price 0), and none of them holds a shop (docs\ARP_CONTENT.txt, 6 and 9).
; A shop's line goes in when an admin makes its property (arp_addproperty, arp_adddoor).

