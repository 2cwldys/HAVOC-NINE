; Apollo RP's zones on h9_tsrp_newbyzantium (the Zones plugin, ARP_Zones): one zone, the whole city.
; A zone is its name on a line, then a block in braces with the two corners of a box: "boundaries1"
; and "boundaries2", each "x y z" (in any order). The HUD's Location line names the zone whose box
; holds the player's origin. This box covers the map with room to spare (the world is x -5712 to
; 5616, y -8512 to 5712, z -1008 to 4416). A comment starts with ; in column 0.
"New Byzantium"
{
"boundaries1" "-9000 -9000 -9000"
"boundaries2" "9000 9000 9000"
}
