// h9_radio.cfg -- internet radio and the ambient music rotation (h9_radio.amxx). The plugin runs
// this file itself at every map start, before it reads these cvars.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on every build.
// Edit the source copy (the project's TSM folder), or your changes get overwritten.
// One map can differ: put the same cvars in ts\mapconfigs\<map>.cfg (h9_autoconfig runs it
// after this file).

// 1: players tune a station with /radio (the list is h9_radio_stations.ini), and this plugin plays
// the ambient rotation, under the same rule ts_matchmode uses (the match mode on, or a roleplay map
// with tsm_music_rp). 0: the plugin does nothing and ts_matchmode plays the rotation itself.
h9_radio 1
