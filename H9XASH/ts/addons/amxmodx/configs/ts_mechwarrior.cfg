// ts_mechwarrior.cfg -- MECH WARRIOR. Loaded by the ts_mechwarrior plugin as each map loads;
// no need to exec it. The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit it HERE, in D:\Downloads\TSM, or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone.


// ---- the mode -------------------------------------------------------------------

// 1: every map whose name starts h9_mw_ is played as Mech Warrior: the match as usual
// (elimination rounds, respawn waves, sudden death), with only the Officer and the Mech to
// pick from and every bot a Mech. 0: off everywhere, and those maps play as ordinary team
// elimination with every class.
tsm_mechwarrior_mode 1

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_mechwarrior "Mech Warrior"


// ---- the classes ----------------------------------------------------------------

// The two classes are found by their perks in ts_matchmode.cfg's tsm_classN lines (the
// Officer's, perk 4, and the Mech's, perk 7). Every other class is left out of the class
// menu while the mode runs. Changes here take effect from the next round. The lives need
// tsm_respawns 1 in ts_matchmode.cfg.

// Officers a side, and the lives each one has. 0 officers: no Officer at all.
tsm_mw_officers 1
tsm_mw_officer_lives 2

// Mechs a side (0: no limit), and the lives each one has.
tsm_mw_mechs 0
tsm_mw_mech_lives 3
