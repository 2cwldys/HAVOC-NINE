// ts_mechwarrior.cfg -- MECH WARRIOR. Loaded by the ts_mechwarrior plugin as each map loads;
// no need to exec it. The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone.


// ---- the mode -------------------------------------------------------------------

// 1: every map whose name starts h9_mw_ is played as Mech Warrior: the match as usual
// (elimination rounds, respawn waves, sudden death), with only the Officer, the Mech and the
// Combat Engineer to pick from and every bot a Mech. 0: off everywhere, and those maps play as
// ordinary team elimination with every class.
tsm_mechwarrior_mode 1

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_mechwarrior "Mech Warrior"


// ---- the classes ----------------------------------------------------------------

// The classes are found by their perks in ts_matchmode.cfg's tsm_classN lines (the Officer's,
// perk 4, the Mech's, perk 7, and the Combat Engineer's, perk 1). Every other class is left out
// of the class menu while the mode runs. Changes here take effect from the next round. The
// lives need tsm_respawns 1 in ts_matchmode.cfg.

// Officers a side, and the lives each one has. 0 officers: no Officer at all.
tsm_mw_officers 1
tsm_mw_officer_lives 2

// Mechs a side (0: no limit), and the lives each one has.
tsm_mw_mechs 0
tsm_mw_mech_lives 3

// The Combat Engineer is played too: 1, or 0 for the Officer and the Mech alone. He keeps his class's
// own limit a side (tsm_class_limits in ts_matchmode.cfg) and lives (tsm_class_lives). His sentry
// turret (.turret), transporter pads (.transporter) and ammunition resupply (+USE on a teammate)
// work as in any match, and the resupply is what keeps a Mech in ammunition. Every bot still plays
// a Mech, so only people take him.
// tsm_mw_engineer 1
