// h9_staticprops.cfg -- h9_staticprops.amxx: the map's props and sprites that nothing can reach, handed to
// the clients once instead of being sent in every update (COMMANDS.txt, DATAGRAM OVERFLOW).
//
// NOTE: build.bat copies this file over the one in the game's configs folder on every build. Edit the
// source copy of this file (the project's TSM folder), or your changes get overwritten.
//
// This file, and not a map's ts\mapconfigs\<map>.cfg, is where the setting goes: the plugin reads it
// while the map is still loading, because static entities are only taken then, and a mapconfig runs
// after that.
//
// What it does. A ts_model (a crate, a pallet, a bin) or an env_sprite with no targetname, no target,
// no parent and no owner is an entity the server sends every client that can see it, update after
// update, though nothing about it ever changes. On New Byzantium that is some 600 entities in the
// view of a player standing in a street, about half of everything in it. With this on, the engine
// puts them into the map's sign-on data once (EngFunc_MakeStatic) and frees the server's edicts: the
// client draws them from then on and the server does not mention them again. A sprite is taken only if
// it has one frame and is not a one-shot. A prop that is taken is no longer an entity of the game: it
// cannot be shot, touched or addressed (a ts_model's box is a point, so it never could be in any way
// that mattered). A client that is on the map when this is turned on sees no props until the next map.
//
// 0: off (DEFAULT)
// 1: on roleplay maps (rp_ or tsrp_ in the name, the match mode's own test)
// 2: on every map
h9_staticprops 0
