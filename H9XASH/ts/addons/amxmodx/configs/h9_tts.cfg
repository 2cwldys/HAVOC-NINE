// h9_tts.cfg -- h9_tts.amxx's settings (docs\TEXT_TO_SPEECH.txt). The plugin executes this file on every map.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
// One map can differ: put the same cvars in ts\mapconfigs\<map>.cfg (h9_autoconfig
// runs it after this file).
//
// What a player says in chat is spoken to the players near him, in a voice for his model, by THEIR own game:
// Windows SAPI in H9's native client, the browser's speech synthesis in the web client. A game without H9's
// client.dll is sent nothing, and a player who types cl_h9_tts 0 hears nothing. Chat commands (a line that
// starts with . / ! or @), the chat of a muted account and of a player who is dead or not drawn are never
// spoken. The models whose voice a gas mask muffles are listed in h9_tts_gasmask.cfg.

// 1: chat is spoken to the players near the speaker. 0: nothing is sent (DEFAULT: off). Remove the // to turn it on.
// h9_texttospeech 1

// Units from the speaker out to which a line is heard. The volume is full within a quarter of it and fades
// to nothing at the range; walls do not matter.
h9_tts_range 800

// The most characters of a line that are spoken (8 to 150); a longer line is cut.
h9_tts_maxchars 96

// Seconds a speaker must wait between two spoken lines. What he says in between is only written.
h9_tts_gap 1.5

// 1: the speaker hears his own line too, which is how one player alone can tell it works. 0: only the others do.
h9_tts_self 1
