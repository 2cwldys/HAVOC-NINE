repuheavy_recon

// Every model of the MSR families, whatever its skin or sex: the class lists above name only the models the
// classes hand out, and a server or a map can hand out others (repuheavy_fem, RepuHeavyG, rh_agent_soot, ...).
// Type h9_tts at the console to see whether your own model is on this list.
repuheavy*
reputengu*
repughillie*
heavytengu
rh_agent_*
rh_laur_*

// The models of those families that go without a helmet, and so without a mask.
!repuheavy_fem_nhelm
!repuheavy_bfem_nhelm
