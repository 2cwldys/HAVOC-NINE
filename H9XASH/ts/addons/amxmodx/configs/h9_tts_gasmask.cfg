RepuHeavyM
RepuHeavyM_dust
RepuHeavyM_soot
RepuHeavyM_mud
RepuHeavyM_blooded
RepuHeavyM_stripped
RepuHeavyM_soot_blood
RepuHeavyM_smashed

// Officer (tsm_class7)
RepuTengu
RepuTengu_dust
RepuTengu_soot
RepuTengu_mud
RepuTengu_blooded
RepuTengu_soot_blood
RepuTengu_smashed
RepuTengu_stripped

