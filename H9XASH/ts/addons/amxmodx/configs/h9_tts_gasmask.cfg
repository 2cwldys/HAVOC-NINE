// h9_tts_gasmask.cfg -- the player models whose speech a gas mask muffles (h9_tts.amxx, docs\TEXT_TO_SPEECH.txt).
//
// HOW TO EDIT IT. One model name a line, as the model's folder is called (models\player\<name>\<name>.mdl),
// in any case. A line that starts with // is a comment, a blank line is skipped, and anything after the name on
// its line is ignored. A name that ends in * stands for every model whose name starts so (repuheavy* is every
// repuheavy model, the women's and the stripped ones too), and a name with a ! before it (!repuheavy_fem_nhelm)
// takes that model out again, whatever else lists it. Put a name here and a player wearing that model sounds as
// if he spoke through a mask; take the line out and his voice is clear again. h9_tts reads this file as each map
// loads and nothing else
// decides it: not a class, a team or the match mode, so it is the same on a plain TS server.
//
// A gas mask muffles a man's and a woman's voice. A Mech's voice and a droid's (a bot model) are never
// muffled, whatever is listed here.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on every build. Edit the source
// copy of this file (the project's TSM folder), or your changes get overwritten.
//
// TO BEGIN WITH it lists every MSR-side model of ts_matchmode.cfg's tsm_class1 to tsm_class9 (the names left of
// the | in each line's fourth field) -- without the droid msrdroid_bot and the Mech mech_msr_bot -- and the
// MSR team model of server.cfg's mp_teammodels, repuheavy. No insurgent model and no stock TS model is on it.
// models\player holds other MSR-looking folders that no class uses (repuheavy_dust, RepuTenguG, rh_agent_soot,
// ...): add the ones a map or a server hands out.

// MSR team model (mp_teammodels)
repuheavy

// Assault (tsm_class1)
repuheavy_pack
repuheavy_fem_pack
repuheavy_soot_blood
repuheavy_blooded

// Combat Engineer (tsm_class2)
RepuHeavyGld
RepuHeavyGld_dust
RepuHeavyGld_soot
RepuHeavyGld_mud
RepuHeavyGld_blooded
RepuHeavyGld_stripped
RepuHeavyGld_sootbld
RepuHeavyGld_smashed

// Marksman (tsm_class3)
repughillie
repughillie_dust
repughillie_soot
repughillie_mud
repughillie_blooded
repughillie_stripped
repughillie_soot_blood
repughillie_smashed

