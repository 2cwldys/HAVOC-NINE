; packaging.misc.ini -- deliver what is already on disk. Build nothing, bump nothing, and let the
; delta work out what the host actually lacks.
;
; The catch-all of the in-place family. Use it when something small changed, or several small things
; did, and you do not want to think about which of the other files fits: the server list bot, a
; config, a cfg, a download-page note, a hand-built DLL already copied into H9XASH, a doc, an asset.
; Every stream is on, so nothing is left behind; nothing is COMPILED, so nothing takes twenty
; minutes; and the join gate does not move.
;
; FIRST, CHECK THE OTHER FILES -- a precise one is always cheaper:
;   packaging.site-only.ini      the site, h9web and THE SERVER LIST BOT. The bot, its bio and its
;                                data are inside the host package, so a bot-only change is exactly
;                                this file's job and it sends nothing else at all. Prefer it.
;   packaging.engine-inplace.ini a rebuilt engine into the published build.
;   packaging.mod-inplace.ini    a rebuilt plugin or module into the published build.
;   packaging.webclient.ini      a rebuilt browser client into the published build.
;   packaging.hd-only.ini        the HD textures.
;   packaging.ini                an ordinary release, which raises the build number.
;
; WHAT THIS FILE WILL NOT DO, and the mistake to avoid:
;   It COMPILES NOTHING. [ship] engine, plugins, linux, export and webclient are all 0, so a changed
;   .sma, .c, .cpp or patch is NOT built by this run -- it delivers whatever is in H9XASH right now.
;   If you changed source, either build it by hand first, or use the file above that owns it.
;   It also does not run export.bat, so anything that lives in the master tree and has not been
;   exported yet is not here to send.
;
;   AND ONE REAL TRAP: if a plugin WAS rebuilt (by hand, or by an earlier run), its hash changed, and
;   the stage runs a release-prepare --auto of its own that deploy-vps.ps1 cannot be told to skip. It
;   would see the changed plugin and RAISE THE BUILD, which is the one thing this file promises not to
;   do. bump = never does not stop it, because ship.ps1 skips the plugin step here entirely and never
;   gets to record the rebuild. A rebuilt plugin belongs to packaging.mod-inplace.ini, which holds the
;   number properly. If you are not sure whether a plugin was rebuilt, run that one instead.
;
; Use: .\ship.ps1 -Ini .\packaging.misc.ini
;      or the delivery alone: .\deploy-vps.ps1 -Ini .\packaging.misc.ini (add -WhatIf first, and read
;      what it says it would send: on this file that list IS the point)

[stage]
; the stage must run: it re-reads H9XASH and writes the lists the delta sends from. Without it the
; deploy would use the previous run's list, which is current contents at stale paths
run = 1
linux = 1
; lists only, as in packaging.ini
zips = 0
hd = 0

[package]
; the host package carries the site, h9web and the server list bot. make = 1 builds a FRESH one,
; which is also what makes [deploy] site = 1 safe below
make = 1
webclient = 1

[ship]
; nothing is compiled by this file -- see "WHAT THIS FILE WILL NOT DO" above
engine = 0
plugins = 0
; the build number stays where it is
bump = never
linux = 0
export = 0
webclient = 0
deploy = 1
; the check on the host after the delivery
server = 1

[deploy]
host = havoc9-vps
streams = 6
tries = 3
scratch = D:\temp\h9deploy
; safe here because make = 1 built a fresh package. With make = 0 this would send the newest package
; already in dist\ unconditionally, which is a rollback waiting to happen
site = 1
webclient = 1
; an identical bundle is not sent, so this costs nothing when no plugin changed
preset = 1
; the whole point: only files the host has never seen go over
delta = 1
client = 1
updater = 1
updater_files = 1
; the HD pack is never part of an ordinary delivery: packaging.hd-only.ini moves it
hd = 0
linux_server = 1
