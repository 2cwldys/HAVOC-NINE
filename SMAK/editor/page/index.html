<!doctype html>
<meta charset="utf-8">
<title>SMAK editor</title>
<!-- The model editor's page (editor/README.md). Plain HTML, JavaScript and WebGL2, no library. Served by editor/serve.mjs,
     which also does the model work (smak, in Node); the arithmetic of keys is /core.mjs, the same file the command line uses.
     Address: ?model=v_1hswords.mdl&anim=2&frame=20&bone=Bip01 R Hand&cam=first|orbit&body=1&tab=pose|anim|events|textures|save
              &bones=0&onion=1&compare=1&both=1&second=1&body2=3&tex=55&uv=1 -->
<style>
  html, body { margin: 0; height: 100%; background: #1b1e23; color: #d6dade; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  button, select, input { background: #3a3f47; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; font: inherit; }
  button, select { cursor: pointer; } button:hover { background: #4a5059; } button:disabled { opacity: .45; cursor: default; }
  button.on { background: #6b5a2a; border-color: #b9963c; } button.go { background: #2f5d3a; border-color: #4f9a62; }
  input[type=number] { width: 62px; padding: 2px 4px; } input[type=text] { padding: 2px 6px; } input[type=range] { padding: 0; width: 150px; vertical-align: middle; } input[type=checkbox] { vertical-align: -2px; }
  input[data-num] { width: 54px; } input[data-hex] { width: 66px; font-family: ui-monospace, Consolas, monospace; }
  label { white-space: nowrap; }
  body { display: flex; flex-direction: column; }
  #top { min-height: 40px; flex: none; box-sizing: border-box; padding: 5px 10px; background: #23272e; border-bottom: 1px solid #333; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; white-space: nowrap; overflow: hidden; }   /* a second row in a narrow window */
  #top b { color: #e2c47a; margin-right: 4px; } #status { margin-left: auto; color: #9fb4c8; overflow: hidden; text-overflow: ellipsis; max-width: 38%; } #status.bad { color: #ff8f8f; }
  #live { margin-left: 8px; font-size: 11px; color: #7fd49a; white-space: nowrap; } #live::before { content: "\25CF "; } #live.off { color: #ff8f8f; } #live.new { color: #e2c47a; }
  #main { display: grid; grid-template-columns: 236px 1fr 348px; grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
  #left, #right { overflow: auto; background: #1f2228; } #left { border-right: 1px solid #333; display: flex; flex-direction: column; } #right { border-left: 1px solid #333; }
  #mid { display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; }
  #view { flex: 1; min-width: 0; position: relative; } #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; } #over { touch-action: none; cursor: default; }
  #view2 { flex: 1; min-width: 0; position: relative; border-left: 2px solid #111; } #view2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bodies2 { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; } #tag2 { top: auto; bottom: 8px; }
  #texImg.pick { cursor: crosshair; } .chip { display: inline-block; width: 14px; height: 14px; border: 1px solid #888; border-radius: 3px; vertical-align: -3px; }
  #cmp { flex: 1; min-width: 0; position: relative; border-left: 2px solid #111; background: #3a3e46; } #cmp img { width: 100%; height: 100%; object-fit: fill; display: block; }
  .tag { position: absolute; left: 8px; top: 8px; padding: 2px 8px; background: #000a; border-radius: 4px; pointer-events: none; max-width: 90%; }
  #hint { top: auto; bottom: 8px; color: #e6c15a; } #hint:empty { display: none; }
  #tl { height: 150px; border-top: 1px solid #333; background: #20242a; display: flex; flex-direction: column; }
  #bar { padding: 4px 8px; display: flex; gap: 4px 8px; align-items: center; white-space: nowrap; overflow: hidden; } #bar input[type=number] { width: 52px; }
  #track { flex: 1; min-height: 0; width: 100%; display: block; cursor: pointer; }
  h3 { margin: 12px 10px 4px; font-size: 12px; color: #e2c47a; text-transform: uppercase; letter-spacing: .04em; }
  .list { overflow: auto; } #anims { flex: 0 0 38%; } #tree { flex: 1; }
  .row { padding: 1px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .row:hover { background: #2b3038; } .row.sel { background: #44506a; color: #fff; }
  .row small, small, .dim { color: #8a93a0; } .row .mark { color: #e2c47a; } .row.off { color: #666; cursor: default; }
  #tabs { display: flex; border-bottom: 1px solid #333; position: sticky; top: 0; background: #1f2228; z-index: 2; } #tabs button { flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent; background: none; padding: 7px 2px; } #tabs button.on { border-bottom-color: #b9963c; color: #e2c47a; }
  .pane { padding: 4px 10px 16px; } .pane h3 { margin-left: 0; } .pane p { margin: 4px 0; } .pane .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  table { border-collapse: collapse; } td, th { padding: 2px 4px 2px 0; text-align: left; vertical-align: middle; }
  .x { color: #ff7b7b; } .y { color: #7bdc7b; } .z { color: #7baaff; }
  #texImg { image-rendering: pixelated; max-width: 100%; border: 1px solid #444; background: repeating-conic-gradient(#333 0 25%, #444 0 50%) 0 0/16px 16px; display: block; margin: 6px 0; }
  #drop { border: 1px dashed #666; border-radius: 6px; padding: 8px; text-align: center; color: #9aa; margin: 6px 0; } #drop.over { border-color: #e2c47a; color: #e2c47a; }
  .err { color: #ff8f8f; } .warn { color: #e6c15a; } .fine { color: #8fd18f; } ul { margin: 2px 0; padding-left: 18px; } li { margin: 2px 0; }
  .ev input[type=text] { width: 150px; } .ev input[type=number] { width: 48px; } .ev tr.sel td { background: #44506a; }
  kbd { background: #333; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, Consolas, monospace; }
</style>
<div id="top">
  <b>SMAK editor</b>
  <select id="model" title="The model"></select>
  <span id="bodies"></span>
  <button data-act="cam:first" id="camFirst" title="As the game shows a view model (1)">First person</button><button data-act="cam:orbit" id="camOrbit" title="From outside: drag to turn, wheel to zoom, right drag to slide, double click the model to turn about that point (2)">Orbit</button>
  <label title="The skeleton over the model (B)"><input type="checkbox" id="showBones" checked> bones</label>
  <label title="The pose at the keys before and after, faintly (O)"><input type="checkbox" id="showOnion"> onion</label>
  <label title="Textures smoothed as the game draws them, or pixel by pixel"><input type="checkbox" id="showLinear" checked> smooth</label>
  <label title="Both sides of every triangle: a face that is inside out, and a thin sheet from behind, are seen (F). The game shows one side only"><input type="checkbox" id="showBoth"> both sides</label>
  <label title="Another body of this model beside this one, from the same camera at the same frame: chosen at the top of its own view (V)"><input type="checkbox" id="showSecond"> second body</label>
  <label title="smak's own picture of the baked model beside this one, from the same camera: what an agent sees"><input type="checkbox" id="showCompare"> smak's picture</label>
  <button data-act="undo" id="undo" title="Ctrl+Z">Undo</button><button data-act="redo" id="redo" title="Ctrl+Y">Redo</button>
  <button data-act="save" class="go" title="Bake the project onto the original model, write it and check it (Ctrl+S)">Save model</button>
  <span id="status"></span><span id="live" title="Whether the page hears from the editor's server. It takes up by itself, within a second, what an agent or another page changes: the project, the model's file, the list of models.">live</span>
</div>
<div id="main">
  <div id="left"><h3>Animations <small>(played by number)</small></h3><div id="anims" class="list"></div><h3>Skeleton <input type="text" id="boneFilter" placeholder="find" style="width:90px;float:right;margin-top:-3px"></h3><div id="tree" class="list"></div></div>
  <div id="mid">
    <div id="stage"><div id="view"><canvas id="gl"></canvas><canvas id="over"></canvas><div class="tag" id="tag"></div><div class="tag" id="hint"></div></div><div id="view2" hidden><canvas id="gl2"></canvas><div class="tag" id="bodies2"></div><div class="tag" id="tag2"></div></div><div id="cmp" hidden><img id="cmpImg" alt=""><div class="tag">smak's render of the baked model</div></div></div>
    <div id="tl">
      <div id="bar">
        <button data-act="first" title="First frame (Home)">|&lt;</button><button data-act="prev" title="A frame back (Left)">&lt;</button><button data-act="play" id="play" title="Play or pause (Space)" style="width:58px">Play</button><button data-act="next" title="A frame on (Right)">&gt;</button><button data-act="last" title="Last frame (End)">&gt;|</button>
        <label>frame <input type="number" id="frame" min="0" step="1"></label><span id="of" class="dim"></span>
        <label>speed <select id="speed"><option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
        <label title="Play it round and round here, whatever the animation says of itself"><input type="checkbox" id="loop" checked> loop</label>
        <button data-act="prevKey" title="The selected bone's key before (Shift+Left)">key &lt;</button><button data-act="nextKey" title="The selected bone's key after (Shift+Right)">&gt; key</button>
        <span id="tlNote" class="dim"></span>
      </div>
      <canvas id="track"></canvas>
    </div>
  </div>
  <div id="right"><div id="tabs"></div><div id="pane" class="pane"></div></div>
</div>
<script type="module" src="/page/app.mjs"></script>
