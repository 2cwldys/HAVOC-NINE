; packaging.webclient.ini -- the browser client (PLAY on the site) rebuilt and delivered into the
; build that is already published, without raising the build number. The third in-place file,
; beside packaging.engine-inplace.ini and packaging.mod-inplace.ini.
;
; For a fix to the browser build after a release went out: the wasm engine and client library are
; rebuilt, the stage is laid out again from H9XASH, both halves are delivered, and the join gate's
; release is LEFT WHERE IT IS. The browser client has no join gate of its own, so there is nothing
; to refuse an old page -- which is exactly why patching it in place is reasonable here and why
; the other two files say think harder before doing the same to the game.
;
; THE BROWSER CLIENT IS TWO HALVES AND THEY TRAVEL SEPARATELY:
;   1. The wasm engine and client library, plus the game's files, go as their own stream
;      (webclient.zip.recipe.json; the host lays it out with setup.ps1 -WebClientStage).
;   2. The PAGE itself -- client.js, index.html -- rides INSIDE the host package.
; So a page fix needs [package] make = 1 and [deploy] site = 1, and an engine-only fix would get
; away without them. This file sends both, because a half-delivered browser client shows nothing
; useful in a log and the whole delivery is small.
;
; THREE WAYS THIS GOES WRONG, all of them silent:
;   - [package] make = 0 makes [package] webclient UNREACHABLE: the -WebClient and -WebClientList
;     switches ride on the same make-vps-package.ps1 call that make gates. With make = 0 and
;     [deploy] webclient = 1 the delivery falls back to the PREVIOUS run's dist\webclient.list.json
;     -- current file contents at stale paths -- and with delta = 0 it sends the newest
;     havoc9-vps-webclient-*.zip outright, which can be several builds old. Hence make = 1 here.
;   - Nothing in webclient-sync's fingerprint covers GAME CONTENT. It watches the engine, the
;     patches, the client library and its own builder. A changed sprite, sound or map does not move
;     any of them, so the stage is only re-laid by export.bat's :webclient step. Hence
;     [ship] export = 1 rather than auto: auto only fires when the engine or Linux was rebuilt.
;   - verify-release.ps1 never looks at the web client. If the stage is stale, nothing in the
;     release checks will say so: the page will simply be the previous build's art.
;
; COST: [ship] webclient = 1 is a real build -- emscripten, about four minutes, and it takes the
; heavy-job lock -- plus a stage re-lay of over twelve thousand files and a headless-browser smoke
; test. There is no cheap version of this file; if nothing in the browser build actually changed,
; do not run it.
;
; Use: .\ship.ps1 -Ini .\packaging.webclient.ini
;      or the delivery alone: .\deploy-vps.ps1 -Ini .\packaging.webclient.ini (add -WhatIf first)

[stage]
; the stage must run: it writes dist\webclient.list.json, which is what the delta delivery sends
; from. Without it the deploy uses the previous run's list
run = 1
; nothing Linux changed, and the Linux packages are not part of the browser build
linux = 0
; lists only, as in packaging.ini
zips = 0
hd = 0

[package]
; REQUIRED, not optional: [package] webclient rides on this same call, and the page files
; (client.js, index.html) are inside the host package
make = 1
webclient = 1

[ship]
; the browser engine is built by webclient-sync, not by xash.bat. If the WINDOWS engine also needs
; the fix, that is packaging.engine-inplace.ini and a separate run
engine = 0
plugins = 0
; the browser client is not the join gate, and nothing here should move it
bump = never
linux = 0
; 1, not auto: export.bat's :webclient step is the only thing that lays the stage out again from
; H9XASH, and auto fires only when the engine or Linux was rebuilt
export = 1
; the point of this file: rebuild the wasm engine and client, re-lay the stage, smoke test it
webclient = 1
deploy = 1
; the game server on the host is untouched by a browser-client change
server = 0

[deploy]
host = havoc9-vps
streams = 6
tries = 3
scratch = D:\temp\h9deploy
; 1, because the page files travel inside the host package and make = 1 built a FRESH one. This is
; safe here for that reason: the "sends an old package unconditionally" trap needs make = 0
site = 1
; the wasm engine, the client library and the game's files
webclient = 1
; no plugin changed, so this builds a bundle identical to the one the host imported and sends
; nothing. Left at 1 so a run that turns out to carry a rebuilt plugin cannot leave its servers
; reading "not the official file"
preset = 1
delta = 1
; the Windows and Linux download buttons are unchanged by a browser-client fix
client = 0
updater = 0
updater_files = 0
hd = 0
linux_server = 0
