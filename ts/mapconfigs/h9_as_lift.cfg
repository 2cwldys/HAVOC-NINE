// h9_autoconfig map config for h9_as_lift: Assault on the skylift.
//
// The assault mode takes this map by its capture points (configs/tsm_assault_h9_as_lift.cfg). The map is a copy of
// h9_up_lift and still carries that map's Uplink zones, so the Uplink mode is turned off here. ts_matchmode
// places each side on its base from configs/tsm_spawns_h9_as_lift.cfg, and its waves land at the capture points a
// side holds. ts_matchmode.cfg sets these back on the next map.

echo "[h9_autoconfig] h9_as_lift.cfg applied"

tsm_uplink_mode 0
tsm_respawns 1
tsm_roundtime 720
