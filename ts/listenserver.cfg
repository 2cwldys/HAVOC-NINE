// TS's OWN cvars for these, found in the game DLL's cvar table alongside
// weaponstay / bottalk / ammocount / realbullet / botlearn.
//
// These do the job inside the mod, which is the only place that reliably covers
// BOTS. The plugin's versions are client-command hooks, and a fake client sends no
// client commands -- which is exactly why bots could still take powerups and buy
// weapons while players could not.

// No powerups at all.
nopowerup 1

