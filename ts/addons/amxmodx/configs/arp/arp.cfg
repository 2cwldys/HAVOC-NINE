// Apollo RP Configuration File

////////////
// ARP CORE
////////////

// How much money you start with if you have never joined the server before
arp_startmoney "500"

// How often all data is saved in seconds - use 0 to disable saving (not recommended,
// it will not lag the server due to the way it is done)
arp_save_interval "300"

// Lighting - a is darkest, z is lowest, q is normal
arp_lights "q"

// Auxilary HUD
// This HUD is used for messages such as telling a user they have loaded up
// on ammo, they can't target something, etc.
// The RGB and XY cvars are only needed with type set to 1
// Type (1 = print in center, 2 = HUD message) (DO NOT USE 2 IN CS)
arp_hud4_type "2"

// Whether or not when you die you lose the money in your wallet
arp_wallet_death "1"

// Seconds a join waits for the havoc9.org account of its player, which an H9XASH game linked to one proves a
// second or two after it is in game (up to 20 seconds after a map starts): a player no row knows may have made
// his character under an earlier authid, when the address of the server changed. 0: no account is waited
// for, used or recorded, the authid alone
arp_account_wait "30"

// Whether a map's own SQL file, configs/arp/maps/<map>/<map>.sql, is run by itself when the map loads (1) or only when an
// ARP admin runs it by hand (0: console arp_config, entry 3, Load Map SQL Data). It is run before the jobs, properties and
// doors are read, so its rows are there in the same map load and the map needs no reload. Only a file in which every statement
// can be run again and again is run by itself: one statement to a line, each  INSERT OR IGNORE INTO arp_jobs (or arp_property,
// arp_doors) VALUES (...)  with nothing after it but a semicolon. Any other file is left to arp_config and the log says why.
// SQLite only. A map's jobs, properties and doors are read from the tables whatever this says: it only decides whether the
// file fills them at map start.
arp_mapsql_autoload "1"

// What access level you must have in order to get police abilities such as
// com, cuffing, and jail mod
arp_police_access "a"

// What access level you must have in order to get access to the MD and any
// medical addons
arp_medical_access "b"

// What access level you must have in order to be considered a ARP admin
arp_admin_access "z"

// God doors
arp_goddoors "1"

// God windows: 1 makes EVERY func_breakable unbreakable (manhole covers, vents, glass, crates); doors are protected by arp_goddoors
arp_godwindows "0"

// Whether or not to enable fall damage
arp_falldamage "1"

// Performance level: leave at 100 unless you have problems with the core even
// when it is running on its own (i.e. with no other ARP plugins)
arp_performance "100"

// Where to log to
// 0 - disable logging
// 1 - log to AMXX files
// 2 - log to logs/arp/mm-dd-YY.log
// 3 - log to logs/arp/pluginname.log
arp_log "1"

// Welcome messages
// Each line is broken up into a separate cvar
// Use "" to disable
arp_welcome_msg1 "This server is running Apollo RP (http://ApolloRP.org)."
arp_welcome_msg2 "Type 'arp_help' in your console to get started."
arp_welcome_msg3 "" 

/////////////////////////
// ARP H9 ADDITIONS
/////////////////////////

// Every addition H9 made to stock Apollo RP has a switch, and with all of them off (these, and arp_hud_panel, arp_hover_message,
// arp_hunger_enabled, arp_thirst_enabled, arp_mapsql_autoload) the server plays stock ARP. docs\APOLLO_RP.txt has the table.

// 1: Apollo RP's menus are H9 VGUI panels for the games that draw them, and the inventory and exchange windows are available;
// 0: every Apollo RP menu is the classic AMX Mod X text menu, whatever the player's game
arp_h9_vgui "1"

// 1: a dropped item that a player looks toward says what it is and how many (Soda x3), and how to pick it up from close by;
// 0: stock ARP, which says nothing of it
arp_h9_itemhover "1"

// 1: the picture of a dropped item floats over its pack in the world, for everybody who sees the pack: the item's frame of sprites/h9_arpicons.spr, the sheet the inventory window
// draws its tiles from, which sprites/h9_arpicons.txt names (an item that list has no picture for has none). 0: none, as stock ARP. arp_h9_itemicon_max is the most icons that stand
// at a time (0 to 128; 0 makes none; with that many up the oldest makes way, so the packs dropped last keep theirs) and arp_h9_itemicon_scale how large one is (1.0 is 32 units across).
// No icon is made while the server has fewer than 100 free entity slots, and the log says so when this is 1 and the sheet or its list is not on the server.
// arp_h9_itemicon is read from this file when the sheet is precached, before the server has executed it: a change to 1 needs a map change (a change to 0 takes the icons down
// within five seconds).
arp_h9_itemicon "1"
arp_h9_itemicon_max "64"
arp_h9_itemicon_scale "0.6"

// 1: a pack that has just been dropped glows purple for a few seconds: a point light over it that pulses every second and a half, so that it shows in a dark corner and is easy to find and
// pick up (a message to the players who can see the pack, no entity). 0: no light, as stock ARP. arp_h9_itemglow_time is how many seconds a pack glows after the drop (0 to 600; 0 gives none),
// arp_h9_itemglow_radius how far the light reaches (40 to 600 units) and arp_h9_itemglow_color its colour as three numbers, red green blue, each 0 to 255 ("180 60 255" is the purple).
// A change takes effect at once; a pack that is glowing finishes the time it was given.
arp_h9_itemglow "1"
arp_h9_itemglow_time "12"
arp_h9_itemglow_radius "200"
arp_h9_itemglow_color "180 60 255"

// The inventory (ARP_Inventory, docs\ARP_INVENTORY.txt): a player's items are arranged in cells, and a game that draws H9 panels has them in a window.

// 1 gives a player whose game has the inventory window that window for /items and /inventory in place of the text menu (it needs arp_h9_vgui 1).
// 0 gives everybody the text menu. The cell rules below apply to every player either way.
arp_h9_inv_window "1"

// The cells a player has, 8 to 96 (a grid of 8 columns). A pick-up takes what fits and leaves the rest in the pack, a shop refuses before it takes the
// money, a give is refused when the other player has no room for all of it, and an add that nothing asked about (a reward, an admin command) falls at
// the player's feet. Lowering it never takes anything from a player: he keeps his cells until he is back under it.
// 0 is no limit, as stock ARP: nothing is refused and the grid grows to what is needed.
arp_h9_inv_slots "32"

// The count of one kind of item in one cell, 1 to 999. configs\arp\inventory.ini names a limit for an item (1: it does not stack).
arp_h9_inv_stack "20"

// Where a player put his items is kept between his visits: 1 stores the arrangement of his cells in the database (the table arp_h9_cells, made when it is first needed:
// one row for each character, the cells as text with the item names) and gives it back when he joins, as far as he still owns the items; 0 packs the cells at every join and
// writes nothing. The counts of the items are ARP's (arp_items) and are never changed by it.
arp_h9_inv_persist "1"

// A player who presses the use key on a player who is handcuffed or in jail searches him: a window opens with the other player's cells beside his own and what he takes moves
// from the one's inventory to the other's. 1: on (a game that says _h9vgui 8 draws it, any other gets "That player cannot make an exchange now."); 0: the use key on a handcuffed
// player does what it did. arp_h9_search_range is how near the searcher must stay once the window is open (units, looked at every second).
arp_h9_search "1"
arp_h9_search_range "150"

// What the money is called in the inventory and exchange windows and in the messages ARP_Inventory prints: 1 is credits (1,250 credits), 0 is cash ($1,250).
// With 1 a player whose game can draw the credit sign (the client that says _h9vgui 7) is also shown the cent sign in place of the "$" of every amount that any Apollo RP
// plugin prints for him; with 0 every plugin sends what stock ARP sends. The wallet and the bank are ARP's: only the words and the sign change.
// The HUD's money line reads "Credits:" with 1 and "Wallet:" with 0, as stock ARP does.
arp_h9_credits "1"

// The exchange of goods between two players (the use key pressed on another player; ARP_Inventory): the distance, in units, at which an open exchange is
// cancelled. It is looked at every second.
arp_h9_trade_range "250"

// The seconds without a change to an offer after which an open exchange is cancelled.
arp_h9_trade_timeout "120"

// Money in a search: 1 lets the player who searches a handcuffed player take money from his wallet in the search window (a game that says _h9vgui 9 has buttons that
// take 10, 100 or all of it; the bank is never touched, and the take is logged and told to him). 0: items only, as the search was.
arp_h9_search_money "1"

// Restraints: 1 makes Cuffs, Tape and Rope items (the shops' sell lines for them then work). Police cuff with /cuff and need no item; anyone else cuffs with one Cuffs,
// which the cuffing uses up and which goes back to whoever frees him (not when police took them off). Tape gags a mouth until /removetape (chat, team chat and, with
// arp_voice 1, voice), Rope ties a person to the user, who pulls him along (/untie frees him). 0: stock ARP, where none of them exists and the sell lines say BAD ITEM ID.
// This switch is read from this file when the items are registered, before the server has executed it: a change needs a map change.
arp_h9_restraints "1"

// The slack of a rope, in units: a tied player is pulled toward the one who holds the rope when he is further than this, and the rope snaps at four times it.
arp_h9_rope_length "150"

// 1: a handcuff symbol floats over the head of a handcuffed player (sprites/h9_cuffed.spr), for everybody who sees him. 0: none, as stock ARP: the sprite is then not precached
// either, so a client needs no such file. Like arp_h9_itemicon it is read from this file when the sprite is precached, before the server has executed it: a change to 1 needs a map change.
arp_h9_cuffsprite "1"

// What Apollo RP prints in chat (the lines that start with [ARP]: a purchase, a refusal, an item used) as a popup over the crosshair that holds and then fades, for a game
// that draws H9 panels (it needs arp_h9_vgui 1; the three latest show, the newest lowest). 0: chat as stock ARP; 1: the popup in place of the chat line; 2: both.
arp_h9_toast "1"

// What a player looks at says what it is: a property door (the establishment, its owner or that it is for sale, its affiliation from the access letters, sealed or open, and
// restricted when the player may not use it), an NPC (its name and role) and a player (his name, job and affiliation). A game that draws H9 panels gets a plaque panel (it needs
// arp_hud4_type 2, set above); every other game gets the text it always had with an Affiliation line. 0: stock ARP's text, with no Affiliation line and no panel.
arp_h9_plaque "1"

// Team play. 1 puts a roleplay map on TS's team rules with three teams, Middle Sea Republic, Insurrection and Proletarians (in that order: the numbers 1, 2 and 3 are TS's team numbers, and
// the client colours a team by its number, so they are blue, red and yellow), friendly fire on, and every player on the team of his job, whatever he picks: the police letter
// (arp_police_access), the medical letter (arp_medical_access) or g put a job on the Middle Sea Republic, a letter of arp_h9_insurgent_access (below; the Insurrection jobs of H9's two maps
// hold i) on the Insurrection, any other job, and Unemployed, on the Proletarians. A player cannot pick a team himself (jointeam and the team panel are refused); a change of job moves
// him, and TS takes a player who changes team out of play for its respawn time (5 seconds in server.cfg) and respawns him. TS gives a joiner the team with the fewest players
// (mp_defaultteam stays 0) and he is moved when his character is loaded. TS writes no player model (mp_teammodels_force 0): each keeps the one he chose. The citizens of tsrp_roambots
// are Proletarians, and Insurrection while an insurgency lasts. 0: stock ARP, which never touches a team and leaves the map's rules as the server has them.
// TS makes its rules once, as a map loads, so this is read from this file (and from a line in the map's own mapconfig, which has the last word) before the server has
// executed it: a change needs a map change. On a map that does not run team rules (or on a game that is not The Specialists) it does nothing and the log says so once.
// ts\game.cfg must run the command h9_arp_teams (the line is there in H9's), which writes the team list; arp_teams, in the console, shows what TS reports.
arp_teamplay "0"

// The access letters of the Insurgency's jobs and properties, for the Affiliation line of the look-at plaque (arp_h9_plaque): a player whose job holds one shows as Insurgency, and
// so does a door whose property lists one. A job with the police letter (arp_police_access), the medical letter (arp_medical_access) or g shows as Middle Sea Republic, a job with
// the admin letter alone as Administration, any other job as Civilian. The Insurrection jobs of H9's two maps hold i (docs\ARP_CONTENT.txt, 3).
arp_h9_insurgent_access "i"

// The property tax (ARP_PropertyTax, docs\APOLLO_RP.txt, section 11): every property that has an owner costs its owner money every arp_h9_tax_minutes minutes. With arp_h9_tax_manual 0
// (below) it is taken from his BANK (never the wallet) at once and he is told with a popup (a chat line on a game that draws no H9 panels); an owner who is away is charged too, in the
// database, and is shown one popup with what was taken in all when he is back; the bank never goes below 0: what is there is taken, the rest is told to him and forgotten (no debt, no
// eviction). With arp_h9_tax_manual 1 it is owed until he pays it by hand. 1: on; 0: stock Apollo RP, the plugin reads and writes nothing and answers no command. The settings of the tax
// are read at every toll, so a change needs no restart.
arp_h9_tax "1"

// The minutes between two tolls, 1 to 10080. The clock starts with the map: a restart or a map change starts it again, and nobody is charged for the time the server was down. A map that
// is changed more often than this never tolls. Made shorter than the time since the last toll, it tolls at the next second.
arp_h9_tax_minutes "15"

// What each property costs at a toll is arp_h9_tax_flat plus this many per cent of what the property cost its owner (0 to 100, to the hundredth), rounded up to a whole number, and
// at least 1 when the sum is above 0. Apollo RP sets a property's price to 0 when it is bought, so the plugin keeps the price of each sale (the table arp_h9_taxbase); a property it
// has no price for pays the flat sum alone, until its price is given with arp_h9_tax_value <internal name> <price> or it is bought again.
// 1.0 every 15 minutes is 4 per cent of the price in an hour and 96 per cent of it in a day: set what suits the salaries of the map (a Citizen is paid 10 a minute).
arp_h9_tax_percent "1.0"

// A sum in money added for each property, whatever it cost (0 to 10000000, to the hundredth). 0: the percent alone.
arp_h9_tax_flat "0"

// How the tax is paid. 1: BY HAND. A toll takes nothing from a bank by itself: what each property costs at it is added to what that property OWES, and the owner pays by logging in, going to
// the property and saying /renew (also /paytax) while he looks at one of its doors: a menu (an H9 panel, the classic text menu on any other game) with what the property costs and owes and how
// long it has before it is taken back, his bank and wallet, 1. pay what it owes (from the bank, the rest from the wallet), 2. automatic payment for that property on or off, 0. close. Automatic
// payment is an opt-in for each property: at each toll the owner's bank is charged what the property owes plus the toll's amount, all or nothing for his automatic properties together, in the
// game or away; what could not be taken is owed. A property with many doors owes one tax and has one menu. 0 (the plugin's own default): every owner is charged from his
// bank at each toll and what the bank cannot pay is forgiven; /renew is chat like any other line. Read at every toll.
arp_h9_tax_manual "1"

// 1: the SERVER takes back a property that has owed for arp_h9_tax_evict_tolls tolls in a row, or whose debt has reached arp_h9_tax_evict_debt, at a toll, even while its owner is away. It
// needs arp_h9_tax_manual 1: something has to be able to owe (with 0 every owner is charged at once and the rest is forgiven, so nothing is taken back). The owner's name and key and the
// keyholders are cleared, the price goes back to what the owner paid, the lock to what it was before he bought it (sealed when that is not known), and he is told at once, or in his next login
// popup. An owner in the game is warned when a property has used half and three quarters of its allowance. Never in the first toll after a map began. 0 (the plugin's own default): a
// property is never taken back. Read at every toll.
arp_h9_tax_evict "1"

// The tolls a property may owe in a row before it is taken back, counted from the first toll it was not paid at (0: no limit of this kind). 96 tolls of 15 minutes are 24 hours of the
// server's own time: the clock starts with the map, so a server that is down gives its owners no less time. Lowering it takes back, at the next toll after the first of a map and while the database can be used, every property that already owes for more tolls than the new limit, with no warning. Read at every toll.
arp_h9_tax_evict_tolls "96"

// The money a property may owe before it is taken back, 0 to 100000000 (0: no limit of this kind). A property is taken back when it reaches either limit. Lowering it does the same for a debt that is already over it. Read at every toll.
arp_h9_tax_evict_debt "0"

//////////////
// ARP CONFIG
//////////////

// Database to use for backups
arp_sql_backup_db "backup"

//////////////////
// ARP HUNGER MOD
//////////////////

// Whether or not hunger is enabled
arp_hunger_enabled "1"

// Whether or not thirst is enabled: a second need beside hunger, quenched only by drinks (Soda and Milk)
arp_thirst_enabled "1"

////////////
// ARP NPCS
////////////

// How much it costs to refill ammo at the gun shop
arp_ammofill_cost "50"

// How much money of an item sold goes to profit
arp_profit_fraction "0.25"

////////////
// ARP HUD
////////////

// HUD display title, use #hostname# to insert the server's hostname in that spot
// Use "\n" to indicate a line break
arp_hud_title "« #hostname# »"

// HUD x position (-1.0 - 1.0)
arp_hud1_x "0.0"

// HUD y position
arp_hud1_y "0.025"

// HUD red factor (0 - 255)
arp_hud1_r "150"

// HUD green factor (0 - 255)
arp_hud1_g "150"

// HUD blue factor (0 - 255)
arp_hud1_b "255"

// 2nd HUD x position (-1.0 - 1.0)
arp_hud2_x "1.0"

// 2nd HUD y position
arp_hud2_y "0.0"

// 2nd HUD red factor (0 - 255)
arp_hud2_r "200"

// 2nd HUD green factor (0 - 255)
arp_hud2_g "200"

// 2nd HUD blue factor (0 - 255)
arp_hud2_b "255"

// 3rd HUD x position (-1.0 - 1.0)
arp_hud3_x "1.0"

// 3rd HUD y position
arp_hud3_y "0.4"

// 3rd HUD red factor (0 - 255)
arp_hud3_r "255"

// 3rd HUD green factor (0 - 255)
arp_hud3_g "255"

// 3rd HUD blue factor (0 - 255)
arp_hud3_b "255"

// Auxilary HUD x position (-1.0 - 1.0)
arp_hud4_x "0.4"

// Auxilary HUD y position
arp_hud4_y "0.7"

// Auxilary HUD red factor (0 - 255)
arp_hud4_r "200"

// Auxilary HUD green factor (0 - 255)
arp_hud4_g "200"

// Auxilary HUD blue factor (0 - 255)
arp_hud4_b "255"

////////////////
// ARP TALKAREA
////////////////

// Whether or not OOC (i.e. (( talking like this to everyone )) ) is allowed
// 1 - Normal OOC (shows in chat section)
// 2 - HUD OOC (uses HUD 3 to separate OOC and normal chat): the box on the right of the screen, with the arp_ooc_hudtitle above
//     the last lines of /ooc <message>; H9 uses this one
arp_ooc "2"

// Whether or not to color messages
arp_printcolor "0"

// The interval between CNN messages (0 to disable)
arp_cnn "120"

// The interval between advertisements (0 to disable)
arp_advert "60"

// Whether COM APPEARS IN CAPS IN CHAT or if it retains how the person typed it out
arp_capscom "1"

// Whether or not messages should be printed to the console (OOC and IC)
arp_printconsole "1"

// Print mode
// 0 - no standard chat
// 1 - normal print mode, i.e. 'Hawk: this is a sample message'
// 2 - extra print mode, i.e. 'Hawk says, "This is a sample message."'
arp_printmode "1"

// How often the OOC HUD should refresh in seconds
// A refresh removes a single line of text
arp_ooc_refresh "3.0"

// Message range as a factor
// Increasing this multiplies the default range by the amount you choose
// You can also pick values below 1.0 to shrink the range
// This affects all chat commands except for main OOC
arp_message_range "1.0"

// Whether or not to replace "lol", "rofl" and other chat with "haha"
// This only works when arp_printmode is set to 2
arp_message_lol "0"

// Voice talkarea
// Limits voice chat to the same range as normal speech
arp_voice "1"

// Whether or not to log chats
arp_message_log "0"

// OOC HUD title, appears above all OOC chats if arp_ooc is set to 2
arp_ooc_hudtitle "[ARP OOC]"

/////////////////
// ARP JAIL MOD
/////////////////

// This is the table jailed users will be stored in
arp_jail_table "arp_jailusers"

// This is whether or not reconnecting lets you out (1 = keep in, 0 = let out)
arp_jail_reconnect "1"

// This is whether or not dying lets you out (1 = keep in, 0 = let out)
arp_jail_death "1"

// This is the mode it works in
// Use 0 to disable it entirely
// Use 1 to use Harbu style, where if you leave the cell, you are free
// Use 2 for new style, where a cop has to "Free Target Player" in order
// for them to be able to leave
arp_jail_mode "1"

// This is how far you must be within to be kept in jail
// This only takes effect if arp_jail_mode is "1"
arp_jail_distance "50"
