// h9_community.cfg -- h9_community.amxx's settings (docs\H9_COMMUNITIES.txt)
//
// Nothing secret here: the server's key is h9_presence's, in addons\amxmodx\data\h9_presence.key.
// h9_community runs this file when it loads (TSM keeps the master copy, which build.bat copies
// over the server's on every build). ts\mapconfigs\<map>.cfg can change any of these for one map,
// and is where the h9_portal lines go.

// What a player types before a line for the whole community: every server of it and its page
// on havoc9.org see it.
h9_community_prefix ".relay"

// 1: the community's chat shows here and players can relay to it. 0: neither. Announcements
// from the community's admins and H9's always show.
h9_community_chat 1

// 1: players can type /find <name> or /where <name> (or .find and .where).
h9_community_find 1

// Portals: seconds before a player can travel through one again.
h9_community_portal_wait 10

// 1: a portal also asks the player's game to run h9_travel <address>, an engine command H9XASH
// does not have yet (docs\H9_COMMUNITIES.txt, PORTALS). 0: it gives the address to connect to.
h9_community_travel 0
