// ts_survival.cfg -- WAVE SURVIVAL. Loaded by the ts_survival plugin as each map loads; no
// need to exec it. The full account of the mode is docs\GAME_MODES.txt.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit it HERE, in D:\Downloads\TSM, or your changes get overwritten.
//
// A map's own ts\mapconfigs\<map>.cfg (h9_autoconfig) runs before the mode takes the map,
// so it can change anything below for that map alone.


// ---- the mode -------------------------------------------------------------------

// 1: every map whose name starts h9_ws_ is played as Wave Survival. 0: off everywhere,
// and those maps play as ordinary team elimination. Side 2 is bots only: tsm_bots in
// ts_matchmode.cfg sets how many mutants a wave has.
tsm_mutants_mode 1

// What the server browser, the server-list bot, the adverts and the Discord card call
// the game while the mode runs.
tsm_gamedesc_survival "Wave Survival"


// ---- the waves --------------------------------------------------------------------

// The breather, in seconds: once the last mutant of a wave is down, the next wave comes
// this long after, counted down on everyone's screen. Each new wave brings every fallen
// survivor back and sets every survivor's lives to their class's count again (needs
// tsm_respawns 1 in ts_matchmode.cfg).
tsm_ws_wave 30

// The sound every player hears, map-wide and at full volume, as each wave comes. Relative
// to sound\. Empty: silence.
tsm_ws_wave_sound "xom_laugh.wav"

// A wave is only over when its last mutant is dead. After this many seconds with three or
// fewer left and none of them falling, they are taken off the board and the wave counts as
// cleared, so a bot wedged where nobody can reach it cannot hold the run for ever. 0 never.
tsm_ws_stall 120


// ---- the mutants ------------------------------------------------------------------

// The class every mutant plays (its model and its base health), by its number in
// tsm_class_* in ts_matchmode.cfg. 0 leaves the bots to pick.
tsm_ws_class 1

// Each mutant's health, over its class's: this many percent more for every wave after the
// first. 5 makes a wave-21 mutant twice as hard to put down as a wave-1 one.
tsm_ws_hp_per_wave 5

// The chance a mutant carries a gun instead of a blade, by wave: "from:percent" steps, the
// last one reached wins. 40% from wave 1, 60% from wave 16, every one from wave 25.
tsm_ws_gun_odds "1:40,16:60,25:100"

// The guns, one picked at random: weapon:clips, TS's weapon ids (listed in ts_matchmode.cfg).
// 13 AK47, 3 Mini Uzi, 7 MP5K, 20 Spas12.
tsm_ws_guns "13:3,3:3,7:3,20:3"

// The blades, one picked at random: 25 Combat Knife, 34 Katana, 35 Seal Knife, 0 bare
// hands.
tsm_ws_melee "25,34,35,0"

// From the wave after this one, every mutant comes back with the kung fu powerup as well.
// 0 never.
tsm_ws_kungfu_after 30
