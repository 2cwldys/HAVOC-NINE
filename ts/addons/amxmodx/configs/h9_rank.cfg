// h9_rank.cfg -- .rank, a player's havoc9.org rank in game (h9_rank.amxx). The plugin executes
// this on every map. COMMANDS.txt lists these under RANKS; docs\H9_COMPETITIVE.txt is the guide.
//
// .rank shows the asker their own rank: their level, their rating and place on the H9 ladder and
// on this server's table, this season's matches, wins and losses, kills, deaths and K/D. .rank
// <name> shows a player's here, or a havoc9.org account's. Only the asker sees the answer. A bot,
// or a player not signed in to a havoc9.org account here, has no rank; an account whose SHOW MY
// PLAYTIME switch is off keeps its rank private.
//
// Needs h9_presence.amxx with a live key in plugins.ini.

// 1: .rank answers. 0: .rank is left alone, as if the plugin were not here.
h9_rank_command 1

// Seconds between two .rank from one player (1 to 60).
h9_rank_cooldown 5
