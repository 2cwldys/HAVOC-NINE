; h9_radio station list
; Goes in addons/amxmodx/configs/h9_radio_stations.ini
;
; One station per line:   name|url
;
; The name is what players type after /radio and what the list shows, so keep it one word.
; The url must start with http:// or https:// -- nothing else reaches the engine's stream
; opener. The stream has to be MP3, because the decoder behind this is mpg123, the same one
; that plays sound/music/*.mp3; Ogg and AAC stations are refused with a message.
;
; Reload without a map change:  h9_radio_reload   (ADMIN_CFG)

; ---------------------------------------------------------------------------
; Radio Free Zion
;
; This URL is correct -- it is the direct stream its site hands out, and it plays in a
; browser and in VLC. It will NOT play in game until one certificate is added, and here is
; exactly why, because the symptom is confusing:
;
; The server sends only its own certificate and leaves out the Sectigo intermediate that
; issued it:
;
;   openssl s_client -connect stream.radiofreezion.net:8061 -showcerts
;     0 s:CN = stream.radiofreezion.net
;       i:CN = Sectigo Public Server Authentication CA DV R36      <-- not sent
;
; Browsers and Windows media players go and fetch that missing certificate themselves (AIA
; chasing), which is why it works everywhere you have tried it. curl does not, and neither
; does mbedTLS, which is what the engine uses -- both stop with "unable to get local issuer
; certificate" (curl exit 60). Port 8061 is TLS-only, so there is no http:// fallback.
;
; THE FIX: add "Sectigo Public Server Authentication CA DV R36" to valve/cacert.pem. The
; Sectigo ROOT is already in that bundle; only the intermediate link is missing, because
; h9_cacerts.ps1 copies Windows' trusted ROOT stores and an intermediate lives in a different
; store. Adding it costs nothing and weakens nothing. Then uncomment the line below.
;
; Do NOT use http_tls_insecure 1 for this: it turns certificate checking off for every https
; request the client makes, not just this station.
;
; RFZ|https://stream.radiofreezion.net:8061/listen.mp3
; ---------------------------------------------------------------------------

