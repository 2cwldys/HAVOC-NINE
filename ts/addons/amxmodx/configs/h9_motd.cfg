// h9_motd.cfg -- the splash MOTD (h9_motd.amxx). Loaded automatically by the plugin.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
// One map can differ: put the same cvars in ts\mapconfigs\<map>.cfg (h9_autoconfig
// runs it after this file).
//
// docs\HTTP_SERVER_MOTD.txt is the host's guide: where the picture or page goes,
// formats and limits, an nginx example, and what each client shows.

// "text"  - TS's own text MOTD (motd.txt), as on any server (DEFAULT: the splash is off)
// "image" - a picture, h9_motd_url, in place of the text MOTD
// "page"  - a web page, h9_motd_url, in place of the text MOTD
h9_motd "text"

// The picture (image) or the web page (page). https only, with a host name:
//   h9_motd_url "https://example.com/h9/motd.png"
h9_motd_url ""

// page only: a picture H9XASH shows in the page's place, since it draws no web
// pages; empty and it shows the text MOTD there, with an OPEN PAGE button.
h9_motd_image ""

// image only: a web page the picture's OPEN PAGE button offers; empty for none.
h9_motd_link ""

// "connect" - once a connection (DEFAULT); later maps show neither splash nor text
// "map"     - at every map, as TS shows its text MOTD
h9_motd_show "connect"
