// ts_matchmode.cfg -- loaded automatically by the plugin. No need to exec it.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit it HERE, in D:\Downloads\TSM, or your changes get overwritten.

mp_teamplay 1


// ---- team identity ------------------------------------------------------------

// "auto"   - learn the two team names from whoever is connected (DEFAULT)
// "name"   - use tsm_team1_name / tsm_team2_name below, exactly as typed
// "number" - use get_user_team()'s index; only if a 2-player test proved it differs
//
// Leave this on "auto" unless you have a reason. In "name" mode with the names left
// blank the warmup hold REFUSES to engage -- otherwise nobody could ever satisfy
// ready-up and the server would sit frozen forever. That is what switched the
// pre-match freeze off: the names were blank.
tsm_team_mode "auto"

// Only consulted in "name" mode. Auto mode fills these in for you.
tsm_team1_name "msr"
// MUST be 15 characters or fewer.
//
// TS copies the team name with strncpy(dst, src, 16) into a 16-byte buffer. At
// exactly 16 characters there is no room for the terminator, the stored name is
// unterminated, and every later comparison against it fails -- so the mod decides the
// player is on no valid team and shows them as a spectator with no team model.
//
// "insurrectionists" is exactly 16 characters, which is why that side could never be
// joined by anyone, human or bot, no matter which command was used. "msr" is 3 and
// always worked. The long name is still shown to players via tsm_team2_label.
tsm_team2_name "insurgents"


// ---- match format -------------------------------------------------------------

tsm_enabled 1

// Best-of. 9 means first to 5 rounds wins.
tsm_rounds 9

// Seconds frozen at the start of each round.
tsm_freezetime 6

// Round time limit in seconds. Decided on alive count when it expires;
// a tie is a draw. 0 disables the limit.
tsm_roundtime 300

// Draw the round clock on screen. Turns red for the last 15 seconds.
tsm_show_timer 1

// Respawn anyone still dead when a round starts, instead of letting them sit the
// round out waiting for the mod to bring them back.
tsm_force_spawn 1

// Refuse team changes once a match is under way. Deliberately separate from
// tsm_block_spectator, so turning that off for a model test cannot unlock teams.
tsm_lock_teams 1

// Players needed on EACH team before ready-up can start the match.
tsm_min_per_team 1

// Health players are given at the start of each round.
tsm_spawn_health 100


// ---- team balance -------------------------------------------------------------

// Largest allowed difference in team sizes. A gap bigger than this holds the match
// at warmup and the HUD names the team that needs people.
tsm_balance_gap 1

// off     - never check
// warn    - say something but start anyway
// block   - hold ready-up until the teams even out (DEFAULT)
// shuffle - block, and let amx_tsm_shuffle try to move people
//
// IMPORTANT: no TS native sets a player's team -- tsfun, tsx and tsconst have no
// team setter at all. So a FORCED move is best-effort: amx_tsm_shuffle tries the
// userinfo key and the entvar and logs which, if either, stuck. Blocking is the
// part that is guaranteed to work, which is why it is the default.
tsm_balance_mode "block"

// Stop a round whose sides have gone uneven instead of playing it out short-handed.
//
// Without this a mid-round disconnect is only corrected at the NEXT round start,
// where tsm_autofill runs -- so the round somebody left carries on 3v2 and whoever
// wins it keeps the win. At 1 that round is abandoned once the sides are confirmed
// uneven: everyone goes back to ready-up, the round is replayed from the start, and
// THE ROUND WINS ALREADY EARNED ARE KEPT. A halt never resets the score, and it is
// not a restart -- amx_match_restart and amx_match_cancel are the ones that zero it.
//
// Play resumes the same way a match starts: everyone on a side types .ready again,
// and the sides have to be even for it to take. Nothing is lost while it waits.
//
// The threshold is tsm_balance_gap above rather than a number of its own, so the
// plugin only ever holds one definition of an even game. With the default gap of 1,
// one person leaving a 5v5 is NOT enough to stop a round -- it takes a gap of 2.
// tsm_balance_mode "off" switches this off along with every other balance check.
// The model anyone out of play wears.
//
// Applied on every route onto the spectator team -- choosing Spectate from the .team
// menu, being defaulted there on join, the end-of-match park, and a mid-match joiner
// who is bounced back off a playing side. It is ALSO forced on an eliminated player,
// who keeps their side (so their class model keeps being re-asserted) but is out of the
// fight. Enforced per frame exactly the way a class model is, so TS re-applying its own
// pick does not undo it, and dropped the moment the player is back in play.
//
// It has to be a model that is installed and precached. Empty leaves them visible.
tsm_spectator_model "Invisible"


tsm_halt_on_leave 1

// Whether a halt counts PEOPLE rather than bodies.
//
// tsm_halt_on_leave arms the check when a human leaves, but the check itself asked
// whether the sides were even counting everyone -- and rcbot refills a gap within a
// second or two, well inside tsm_halt_delay. So a player could walk out of a live
// match, a bot would step into the space, the totals stayed even and nothing ever
// halted. The match carried on with a bot standing in for the person who had left.
//
// With this on, the same tsm_balance_gap is applied a second time to the human head
// count, and a side with NO humans left halts regardless of the gap -- there is
// nobody there to play the rest of the match against.
//
// 0 restores the old behaviour, where bots filling in keeps a match alive.
tsm_halt_humans 1

// Seconds to wait after somebody leaves before the sides are counted.
//
// This is the grace period for the gap closing by itself. With tsm_bots 10 that is
// usually rcbot: balance_teams moves its own bots between sides on rcbot's schedule
// rather than ours, so a human leaving a 5v5 reads as a gap for a second or two and
// then does not. Counting immediately would halt matches rcbot was about to fix.
//
// Raise it on a bot server. Lower it for a human-only league match, where there is
// nothing to wait for. 0 is floored to 0.1 -- a zero delay is not a valid task time.
tsm_halt_delay 3.0

// 1 never halts, while leaving the rest of the balance settings doing their job.
//
// The per-match version of this is an admin command:
//
//   amx_match_continue   resume the halted match as it stands, keeping the score,
//                        and stop halting it again for the rest of THAT match
//
// Use the command for "this one match is fine short-handed" and this cvar for "never
// stop a round over team sizes on this server".
tsm_halt_bypass 0


// ---- solo testing -------------------------------------------------------------

// 1 lets a match run with only ONE team occupied, for testing without a second
// player. Ready-up stops requiring both sides, and rounds will not end by
// themselves -- walk the score with:
//
//   amx_tsm_simwin <1|2>      award the current round to a team
//   amx_tsm_simelim [target]  eliminate someone as if they had been killed
//
// Turn this OFF for real matches.
//
// Set this to 1 right now -- it is what lets you test the whole flow by yourself.
// Without it, ready-up needs a player on each team and amx_match_start is the only
// way in.
tsm_test_solo 0


// ---- spawn points -------------------------------------------------------------

// auto   - per-map spawn cfg if one exists, otherwise scan map entities (DEFAULT)
// config - ONLY the per-map cfg; refuses to guess from entities
// entity - ignore the cfg and always scan entities
//
// Entity scanning is a guess by nature: TS maps are deathmatch maps, so their spawn
// pool was never laid out for two teams. One map here reported a single spawn point
// in total, which cannot separate anything. Placing spawns by hand is better:
//
//   amx_tsm_spawn_add <1|2>      add a spawn where you stand, facing where you look
//   amx_tsm_spawn_list           show what is configured
//   amx_tsm_spawn_tp <1|2> <n>   teleport to one to check it
//   amx_tsm_spawn_clear <1|2|0>  clear (0 = both teams)
//   amx_tsm_spawn_save           write configs/tsm_spawns_<mapname>.cfg
//
// The saved file is re-read automatically every time that map loads. Configured
// spawns also store facing; entity spawns cannot.
tsm_spawn_mode "auto"


// ---- how players are held -----------------------------------------------------

// 2 - clamp maxspeed from the POST think hooks (DEFAULT, and the only one that works)
// 1 - the engine's FL_FROZEN flag, which TS ignores outright
//
// Use 2. FL_FROZEN was proven useless here by players walking around during warmup
// with the flag set. The clamp must come from a POST hook because TS writes its own
// maxspeed every frame, so anything written earlier is simply overwritten.
tsm_freeze_method 2


// ---- warmup -------------------------------------------------------------------

// Hold players during warmup / ready-up: frozen and immune until the match goes
// live. 0 lets them play freely in warmup instead.
tsm_warmup_hold 1

// Hide players during warmup as well as freezing them.
tsm_warmup_hide 1


// ---- per-round loadout reset --------------------------------------------------

// REMOVED. Resetting weapons each round needed ts_giveweapon from the tsfun module,
// and that module's natives are not available on this server. Calling a native that
// does not exist raises a runtime error that aborts the rest of the function it was
// called from -- which is what silently broke the round-start release for a long
// time. Players keep their weapons between rounds for now.
tsm_reset_loadout 0


// ---- eliminated players -------------------------------------------------------

// How an eliminated player is stopped from acting:
//   1 - zero the usercmd buttons only
//   2 - buttons AND movement speed (DEFAULT -- buttons alone did not hold in testing)
//   3 - neither; rely on being parked out of the arena
tsm_disarm 2

// How far above their death spot a dead player is parked when nobody is left to
// watch on their team.
tsm_hold_height 900

// Put a player back on their match team if the mod drifts them to spectator.
tsm_block_spectator 0


// ---- kill reporting -----------------------------------------------------------

// Team-scoped elimination messages.
tsm_report_kills 1

// Include the killer's remaining health and armour. This is real competitive intel
// and is sent ONLY to the relevant teams -- set 0 if you want the kill feed without
// giving away how hurt people are.
tsm_report_hp 1


// ---- server browser -----------------------------------------------------------

// The "Game" column in the server browser. This is the mod's game description, which
// the engine asks the game DLL for on every server query -- it is not the hostname,
// and TS does not expose it as a cvar. Overriding it is how the custom modes in the
// browser list (Fu/Stunt/Boost, Zombie TDM, TSRP) get their own entry instead of
// showing as "The Specialists (DM)".
//
// Blank leaves TS's own text alone. Changes take effect within a second; no restart.
tsm_gamedesc "Match Mode"

// Shown instead of tsm_gamedesc above, only on maps that have siege objectives
// (tsm_obj_1 and on, placed by the map or by .objective). A map with none keeps
// showing tsm_gamedesc as normal.
tsm_gamedesc_siege "Siege"


// ---- debugging ----------------------------------------------------------------

// Master switch for everything this plugin logs. OFF by default.
//
// EVERY line ts_matchmode emits goes through this: the debug log below, the verbose
// trace, and the warnings about things like a missing class model. With it at 0 the
// plugin is silent, which is what a server nobody is debugging should be -- at
// tsm_debug_log 3 the trace writes on every tick for every player and buries the
// console in a way that costs real time in the frame.
//
// Turn it to 1 FIRST when something looks wrong. The misconfiguration warnings are
// gated by it too, so a silent plugin is not evidence that nothing is being reported.
//
// Replies to console commands you type, such as tsm_spawn's usage text, are not
// logging and are never gated -- a command that answers nothing looks broken.
tsm_logging 0


// 0 off
// 1 write addons/amxmodx/logs/tsm_debug.log
// 2 also echo to the server console
// 3 VERBOSE -- adds per-tick tracing: freeze countdown, menu offers, team rewrites,
//   model writes and every weapon handed out. Use this when chasing a crash.
// 4 verbose, echoed to the console as well (very noisy)
//
// This is a dedicated log you can tail while playing. It exists because the AMXX
// log interleaves with chat and every other plugin, and that mixing is what made
// the round-start ordering unreadable -- console lines from log_amx and chat lines
// from client_print flush on different paths, so a pasted console looks out of
// order when it is not.
tsm_debug_log 0

// Lets an admin force open the func_door or func_door_rotating they are aiming at
// with tsm_opendoor, locked or not. The door opens once, then closes on its own
// timer and keeps its own lock. A debugging aid: 0 (default) refuses the command.
amx_tsm_forcedoor 0


// ---- classes / loadouts -------------------------------------------------------

tsm_classes 1

// Which class someone gets if they never pick one.
tsm_default_class 1

// Name ; team1 weapons ; team2 weapons ; models ; health ; armour ; perk
//
// MODELS is team1|team2, and each side may be a comma-separated list to pick
// from at random:
//
//     repuheavy|XCCPSoldier-wartorn,XCCPmutant
//
// | splits the two sides, the same as mp_teammodels, where | also separates teams.
// Random choices are listed with , rather than mp_teammodels' ; because ; is
// already this table's field separator and cannot be reused.
//
// A blank side wears that side's ASSAULT model, so Marksman and Breacher follow
// whatever class 1 is set to.
//
// A random pick is made once and kept for the whole MATCH, not re-rolled each
// round -- someone whose appearance changed every round would be unrecognisable
// to their own side.
//
// EVERY model named here must also be in mp_teammodels in ts/game.cfg. TS only
// precaches that list, and a model written at runtime that was not precached
// shifts the model index table and crashes clients with "Bad model on beam".
//
// Weapons are "tsweaponid:extraclips" pairs. The two weapon lists let ONE class be
// asymmetric -- Assault carries an M4A1 for MSR and an AK47 for the Insurrectionists
// off a single menu entry. Leave the second list blank to give both teams the same.
//
// Perk: 0 none, 1 Combat Engineer, 2 Breacher, 3 Medic, 4 Officer, 5 Regeneration.
//
// A Breacher's +USE forces open doors that are locked against everyone else. See
// tsm_breach_entities at the bottom of this file for what it can reach and what it
// cannot.
//
// An 8th field sets a MOVEMENT MULTIPLIER -- 1.0 is normal, 0.75 is a quarter slower,
// 1.1 is slightly faster. Absent means normal. It applies only while a round is LIVE,
// so a Heavy is not lumbering around warmup before being handed the M60.
//
// TS weapon ids (from ts/ts_fgd.fgd -- 8, 10, 16 and 29 are gaps in TS's own list):
//   1 Glock18    2 Beretta     3 Mini Uzi    4 Benelli M3   5 M4A1
//   6 MP5SD      7 MP5K        9 Socom Mk23 11 Usas12      12 Desert Eagle
//  13 AK47      14 FiveSeveN  15 Steyr Aug  17 Skorpion    18 Barrett M82
//  19 HK Pdw    20 Spas12     21 Akimbo Colts 22 Glock 20  23 HK UMP
//  24 M61 Grenade 25 Combat Knife 26 Mossberg 500 27 M16A4 28 Ruger Mk1
//  30 Akimbo FiveSeveN 31 Raging Bull 32 M60  33 Sawed Off 34 Katana
//  35 Seal Knife 36 Contender G2
// ---------------------------------------------------------------------------
// THESE THREE WERE BROKEN AND HAVE BEEN REPAIRED with engineLayout.
//
//   XCCPsgts_helmet_off     XCCPsgts_mask_only     XCCPsgts_wrecked
//
// All three are edits of XCCPsgts and all three carry orphaned data after the
// texture block -- 39142, 39142 and 45506 bytes of it. A sound GoldSrc model ends
// exactly where its last texture ends; XCCPsgts itself does, and so does every
// other model in this file. Whatever produced these three left the file
// inconsistent with its own offset table.
//
// The engine reads a model purely by those offsets, so it walks into the orphaned
// region and dies with exit code -1073740791 (0xC0000409, STACK BUFFER OVERRUN).
// There is no FATAL line and no minidump, which is why this took so long to pin
// down: the console simply stops.
//
// To check a model before adding it: its textures must end at the file's last
// byte AND be in the table's order. smak's check() names this exact fault and says
// to pass the model through engineLayout, which is what repaired these.
// ---------------------------------------------------------------------------
// LENGTH LIMITS ON THESE LINES. Read this before adding a model.
//
// NOTHING WARNS YOU WHEN YOU GO OVER. The string is silently cut and the leftover
// fragment is used as a model name, so a player gets TS's default model and the
// server logs the same warning every frame. It has already happened twice:
//
//   96-character list  ->  the last name lost its final letter
//   95-character cut   ->  "ins_proletarian" arrived as "ins_prol"
//
// The limits, each one character less than its buffer, for the terminator:
//
//   one model name ........  22   <- the tight one, and it is NOT ours
//   one side's list ....... 159       (TSM_MODELLIST in ts_matchmode.sma)
//   both sides and the | .. 343       (TSM_MODELFIELD)
//   the whole quoted spec . 223       (spec/rest/carry, 224)
//   names on one side .....   8       the parser's own guard
//
// THE 22-CHARACTER NAME LIMIT IS TS'S, NOT THIS PLUGIN'S, and it is fatal rather
// than cosmetic. TS builds models/player/<name>/<name>.mdl into 64 bytes of its
// own and does not check it: 19 characters of fixed text plus the name twice has
// to fit in 63. A longer name is cut mid-word and the engine shuts the server
// down with
//
//   FATAL ERROR (shutting down): Mod_NumForName: models/player/X/X not found
//
// with nothing in the AMXX log at all. The plugin now refuses to precache such a
// name and says so, but the only real fix is a shorter folder name.
//
// Where each class stands today, longest first:
//
//   class1  spec 126/223   side2 81/159   5 names   longest XCCPSoldier-wartorn (19)
//   class7  spec 111/223   side2 67/159   4 names   longest XCCPRurik_battle-worn (21)
//   class2  spec  76/223   side2  8/159   1 name
//   class4  spec  68/223   side2  7/159   1 name
//
// So the insurgent Assault side has room for about 78 more characters, or three
// more names before the parser's guard of 8 is the thing that stops you.
//
// To check from in game rather than by counting: tsm_model prints the list your
// own model was drawn from and "pick n of m". If m is smaller than the number of
// names you put in the config, the list is being truncated somewhere.
// ---------------------------------------------------------------------------

// Class 3's model side for the insurgents is left BLANK on purpose: a blank side
// falls back to that side's Assault model, so insurgent marksmen are dressed as
// assaults rather than as nothing.
//
// Class 4 carries perk 5, the slow regeneration, along with 200hp and 0.60 speed.
// 24:0 is one M61 grenade with no spare.
tsm_class1 "Assault;5:3,22:2;13:3,22:2;repuheavy_pack,repuheavy_fem_pack,repuheavy_soot_blood,repuheavy_blooded,msrdroid_bot|XCCPSoldier-wartorn,XCCPmutant,XCCPsgts_helmet_off,ins_proletarian,ins_prole_helm,insdroid_bot;100;0;0"
tsm_class2 "Combat Engineer;23:3,22:2;23:3,22:2;RepuHeavyGld,RepuHeavyGld_dust,RepuHeavyGld_soot,RepuHeavyGld_mud,RepuHeavyGld_blooded,RepuHeavyGld_stripped,RepuHeavyGld_sootbld,RepuHeavyGld_smashed|XCCPsgts;100;0;1"
tsm_class3 "Marksman;18:2,22:2;18:2,22:2;repughillie,repughillie_dust,repughillie_soot,repughillie_mud,repughillie_blooded,repughillie_stripped,repughillie_soot_blood,repughillie_smashed|;85;0;0"
tsm_class4 "Heavy;32:2,22:2,24:0;32:2,22:2,24:0;RepuHeavyW,RepuHeavyW_dust,RepuHeavyW_soot,RepuHeavyW_mud,RepuHeavyW_blooded,RepuHeavyW_stripped,RepuHeavyW_soot_blood,RepuHeavyW_smashed|XCCPsgg;200;50;5;0.60;1.50"
tsm_class5 "Breacher;4:4,22:2;4:4,22:2;;125;0;2"
tsm_class6 "Medic;22:4;22:4;RepuHeavyM,RepuHeavyM_dust,RepuHeavyM_soot,RepuHeavyM_mud,RepuHeavyM_blooded,RepuHeavyM_stripped,RepuHeavyM_soot_blood,RepuHeavyM_smashed|ins_medic_belt,ins_medic_fem;100;0;3"
tsm_class7 "Officer;1:4,34:0;1:4,34:0;RepuTengu,RepuTengu_dust,RepuTengu_soot,RepuTengu_mud,RepuTengu_blooded,RepuTengu_soot_blood,RepuTengu_smashed,RepuTengu_stripped|XCCPRurik,XCCPRurik_battle-worn,XCCPRurik_scuffed,XCCPRurik_wrecked;100;0;4"
tsm_class8 "Recon;12:2,15:2,34:0;12:2,15:2,34:0;repuheavy_recon|;75;0;6;1.20"
// Class 9 carries perk 7, the Mech: the .rocket ability, no stim/heal, the hp
// watch, the nodraw and the whole mech sound suite. The perk is the SEVENTH
// ';' field of the class line, between armour and speed -- a 0 here reads as
// no perk and silently disables every one of those checks.
tsm_class9 "Mech;32:2;32:2;mech_msr_bot|mech_ins_bot;300;0;7;0.60"

// ---------------------------------------------------------------------------
// HOW MANY OF EACH, A SIDE
// ---------------------------------------------------------------------------
//
// One number per class, in tsm_class1..9 order, separated by commas. 0 means no limit.
//
//     Assault 0 (unlimited) - Combat Engineer 4 - Marksman 2 - Heavy 2
//     Breacher 4 - Medic 2 - Officer 1 - Recon 4 - Mech 1
//
// The limit is per TEAM, so each side may field its own two Medics, and it counts the whole side
// rather than who is currently alive: a Medic who has just been killed has not freed his slot.
//
// The class menu shows what is left beside each name -- "(1 left)", or "(full)" -- and a full class
// is refused if somebody takes the last slot while the menu is on screen. Bots obey it too; without
// that they fill the Officer and Medic slots on their way round and the humans arrive to find the
// side already composed.
//
// If the numbers add up to less than a side can hold, the limits stand aside rather than leave
// somebody with no class at all. Leave this blank to turn the whole thing off.
tsm_class_limits "0,4,2,2,4,2,1,4,1"

// force    - set the model per class and re-assert when TS reverts it
// teamonly - leave TS's own mp_teammodels alone (DEFAULT)
//
// TS is server-authoritative about models: CTSGameRules::GetPlayerModel re-applies the
// team model on every userinfo change and on spawn, so a plain set is reverted within
// about 30 frames. "force" fights that; "teamonly" does not try.
// force   = each class wears its own model, per side (see the class table).
// teamonly = classes do not change how you look; TS mp_teammodels decides.
//
// The escape hatch: teamonly switches every class model off at once without
// touching the table, which is the first thing to try if a model ever crashes
// clients.
tsm_model_mode "force"


// ---- class models ------------------------------------------------------------

// There is no tsm_model_post any more, and the post hook it controlled is gone.
//
// CHalfLifeTeamplay::ClientUserInfoChanged used to force-write the "model" userinfo key
// to CTSGameRules::GetPlayerModel() -- a RANDOM pick from that team's mp_teammodels
// slots -- and the branch that did it was reached unconditionally. Since writing the key
// is itself what triggers that handler, a write from the pre hook could never win, so a
// post hook was added to get the last word. That exchange is what flooded the reliable
// stream and took the server down.
//
// mp_teammodels_force 0 is the fix: it makes the mod leave the key alone, so the class
// model is written once, from the pre hook, and it stands. There is nothing left to
// arbitrate, so the post hook and this cvar are both gone.

// With mp_teammodels_force 0, TS stops overwriting our model key.
// This lets us set the class model ONCE at spawn/ready and it sticks.
mp_teammodels_force 0

// The shortest gap, in seconds, between two writes of the SAME player model.
//
// It only ever applies to a repeat: when the model we are asking for is the same one we
// last wrote, and the live key has since moved, so something is putting it back. A
// DIFFERENT model is a real assignment -- a class was picked, the round started -- and is
// never held. So this cannot stop a model being applied; it can only stop the same model
// being re-applied in a loop.
//
// THIS IS WHAT STOPS CLIENTS BEING DROPPED WITH "Illegible server message".
//
// Writing the model key makes the engine broadcast svc_updateuserinfo to EVERY client,
// on the reliable stream, which is ordered and cannot be dropped -- so it queues. TS
// answers each write by re-applying its own mp_teammodels pick, which raises the event
// again, and the two can argue indefinitely. A capture of that showed twenty-one of
// those messages in one packet and then svc_bad: the client could not parse the stream
// and closed the connection itself, which looks exactly like a kick and leaves nothing
// in the server log.
//
// With mp_teammodels_force 0 there is no argument, so a healthy server writes once per
// model change and never reaches this. It is kept as the thing that makes the write safe
// if that setting is ever put back.
//
// amx_tsm_debug reports "model=N (held=N)". A held count climbing steadily means
// something is still putting the key back repeatedly and this is absorbing it.
tsm_model_floor 1.0

// ---- class icons -------------------------------------------------------------

// A sprite above each player's head showing their class, visible ONLY to their own
// side. Spectators and players who have not picked a side see none of them.
//
// This exists because per-class MODELS are tightly limited by TS: a team gets at most
// 3 entries in mp_teammodels, each capped at 15 usable characters, and the mod picks
// among them at random. Icons carry the same information with none of those limits.
//
// Per-viewer visibility is done in AddToFullPack, which is asked once per
// (viewer, entity) pair -- the only place something can be shown to one player and
// withheld from another on the same frame.
//
// The icons are made at map load, ahead of the map's own entities. The engine sends a
// client at most 256 entities a frame, so in a view crowded past that (the upper halls
// of neuropolis) the icons keep their place and the map's highest-numbered entities are
// the ones left out.
//
// NOTE: sprites/tsm_class.spr is NOT shipped with TS; it is built by
// tools/make-class-icons.py and included in the server package. Clients need the file
// or the icons simply draw nothing, so leave sv_allowdownload on or serve it from
// fastdl. One frame per class, in class order, so the sheet and the class table above
// stay in step on their own.
tsm_class_icons 1

// Units above the player's ORIGIN (already hull-center, i.e. feet+36) to float the icon --
// not above the feet. 52 puts it about 88 units above the feet, clear of the head.
tsm_icon_height 52.0

// Sprite scale. The sheet is 64x64 per frame, so 0.25 draws it at about 16 units --
// readable across a room without covering the player behind it.
tsm_icon_scale 0.25


// ---- sudden death -------------------------------------------------------------

// Seconds left in a round at which EVERY player gets marked to the other side. 0 is off.
//
// The problem it solves is the end of a round where both sides are hiding and neither can find the
// other: a clock running down on two people in opposite corners is not tension, it is waiting. Past
// this mark a red marker of each player's class floats over his head, shown only to the side he is
// NOT on -- the class icon's mirror, through the same AddToFullPack hook.
//
// The marker is a glow sprite, which is the one rendermode GoldSrc draws after the world with the
// depth test off. The engine runs its own visibility trace on glow sprites, so how much of this
// survives in TS is a question for the server: if it turns out to hide behind walls, set this to 0
// and nothing else about the round changes.
//
// It needs sprites/tsm_class.spr, the same sheet as the class icons.
//
// While sudden death is on, EVERY living player (bots included) loses 1 health every 5
// seconds, so nobody can out-last the clock on a full bar. This is not closeable by
// healing and has no cvar: the clock was already the thing meant to end the round.
tsm_sudden_death 60

// Sound played to everyone the moment sudden death begins. Name relative to sound\,
// e.g. "xom_laugh.wav". Empty disables it. The file must exist on the server (the
// plugin precaches it only if it is there, so a missing file is not a crash).
tsm_sudden_sound "xom_laugh.wav"

// While sudden death is on, the round goes louder and greener on the H9XASH engine:
//
//  1. THE X-RAY. tsm_sudden_xray 1 shows every living enemy -- cloaked ones too --
//     to the other side THROUGH WALLS, solid walls included, so everyone can find
//     everyone: a glow silhouette in the drawn player's own side colour, MSR blue
//     and Insurgents red. Teammates are not marked. It is the H9XASH engine that
//     draws it (engine-h9-xray.patch: renderfx 64, a glow shell with the depth test
//     off), and the plugin sends every enemy to each player from anywhere on the
//     map while it runs. On Steam it is never sent, and the red icons above carry
//     the feature alone. 0 turns the through-wall view off.
//
//  2. THE TOXIC BOG. While sudden death runs the plugin holds four ENGINE cvars
//     (written by the engine patch, engine-h9-suddendeath.patch -- on a stock
//     engine they are unknown cvars that do nothing) at the values below and
//     zeroes them out the moment the round or the match ends, however that
//     happens, wherever it happens:
//
//       h9_fog_r / h9_fog_g / h9_fog_b   fog colour, 0-255 per channel
//       h9_fog_density                   fog strength, 0-255; the engine scales it
//                                        by 0.01/255, so 90 is "the far wall is gone"
//
//     tsm_sudden_fog_* is what the plugin puts INTO those cvars while sudden death
//     runs; the defaults are a sick swamp green dim enough that the map stays
//     walkable while the far side of it stops existing. Set a channel to 0 or the
//     density to 0 and the bog simply does not come.
tsm_sudden_xray 1
tsm_sudden_fog_r 40
tsm_sudden_fog_g 140
tsm_sudden_fog_b 45
tsm_sudden_fog_density 90


// ---- ambient music -------------------------------------------------------------

// Background music, on a queue that plays the six tracks below in a random order, one
// at a time and never overlapping.
//
// Each track is played by HL's own MP3 player: the plugin sends every player with
// music on "mp3 play sound/music/<track>.mp3". MP3 playback is 2D non-spatial -- no
// world position, so walking away does not affect it, and it follows the listener.
// The MP3s are precached with precache_generic so clients download them from the
// server on first connect.
//
//     tsm_music 0
//
// in the client console turns it off -- that stops the current track with the MP3
// player's own "mp3 stop" and keeps every later queue track from reaching them.
// tsm_music 1 turns it back on and rejoins the track playing at the moment. The
// choice is mirrored into the client's userinfo (setinfo tsm_music), so it survives a
// reconnect. On by default.
//
// The tracks are itsadream, ihateher, fivefingers, deadinsects, twoplustwo and
// contaminated. Their lengths are written into the plugin (the queue arms the next
// track for when the current one ends), so replacing one with a longer file will cut
// it off early or leave a gap.
//
// Volume, 0.0 to 1.0. 1.0 with the normalised files is the welcome jingle's level;
// anything below that is a matter of taste, not audibility. It sets the tracks played
// as wavs; the mp3 tracks play at each player's own MP3Volume, which this never changes.
tsm_music_volume 0.6


// ---- round-start anthems -------------------------------------------------------

// One second into every round, each side hears its OWN short team stinger locally
// on its own machine -- playvol, a NORMAL sound channel, so it plays OVER the
// ambient mp3 instead of cutting it (two mp3s could never mix: HL has exactly
// one mp3 stream). The wav files ship in ts\sound\start; the .mp3 masters sit
// beside them in the source tree as reference. A random pick per side per round:
//
//     side 1 (MSR)        : fortherepublic / instructions / lordcommander
//     side 2 (Insurgency) : slaythem / ripout / eliminatetheimpure
//
// Players with the music switch off (tsm_music 0) hear neither the anthems nor
// the ambient queue.
//
// 0 turns the anthems off entirely.
tsm_startsound "1"

// THE ROAR follows for team 2 alone: four seconds after the Insurgents'
// anthem, the monster's cry goes out locally -- playvol, full volume -- to
// every Insurgents player only (mutantroar.wav in ts\sound, existence-gated,
// so a missing file just keeps the cue quiet). Side 1 and bystanders never
// hear it;bots never do either. It is a match cue, not music, so the ambient
// music switch does not silence it -- tsm_startsound 0 does, with the anthems.
//
// THE BADUM mirrors the roar for team 1: four seconds after the MSR anthem,
// the drum cue goes out locally to every MSR player only (badum.wav in
// ts\sound, existence-gated). Side 2 and bystanders never hear it; bots never
// do either. Same tsm_startsound 0 gate as the anthems and the roar.


// ---- no economy ---------------------------------------------------------------

// Economy ON, wallet empty. This is what stops weapons being bought.
//
// usecash 0 does NOT stop buying: the equipment menu is slot-limited and always
// available, and usecash only layers an economy over it -- switched off, nothing is
// ever charged and the menu is free. Switched ON with no money, TS refuses every
// purchase itself, with its own message.
//
// So this sets usecash 1, initial_cash 0, cashforwin 0, cashforlose 0, and then holds
// every player's wallet at 0 every frame. The per-frame part is the one that matters,
// because a map can hand out cash through a ts_wingiver entity that no cvar covers.
//
// The class loadout is applied down the same purchase path, so it would be refused
// too. The money is lent for the few frames that takes and taken straight back.
tsm_nocash 1

// Refuse the client commands TS's buy menu sends (tkw / tka / tki / rst_cfg / cashala).
//
// Keep BOTH this and tsm_nocash on. This stops the menu saving a NEW loadout; it does
// nothing about one already saved in a player's config, which TS re-applies at every
// spawn without sending any command for this to catch. Starving the wallet is what
// stops that one. Neither setting closes the exploit on its own.
tsm_block_buy 1


// ---- combat engineer ----------------------------------------------------------

// How far the +USE check reaches, in units.
tsm_eng_range 96

// Seconds between one resupply and the next, per engineer.
//
// It used to be a single use per round, which made the perk a lottery: the first
// teammate to walk past took it and the engineer was done for the round however it
// went. The medic has always been on a cooldown and the two perks are the same shape
// -- walk up to a teammate, hand them something -- so they match. Longer than the
// medic's, because ammunition lasts and health does not.
tsm_eng_cooldown 30.0

// Magazines handed over per resupply. One resupply per engineer PER ROUND.
tsm_eng_clips 3


// How long the engineer's yellow glow stays on whoever was resupplied, and how
// thick that shell is.
//
// It mirrors the medic's red one. Without it the engineer is the only perk whose
// work is invisible -- nobody, including the person resupplied, could tell anything
// had happened.
//
// renderamt is a SHELL THICKNESS for a glow shell, not an alpha: 0 is a shell with
// no thickness, which is exactly as invisible as no glow at all.
tsm_eng_glow 1.5
tsm_eng_shell 16


// THE STIMPACK. Everyone gets one a round, whatever class they are.
//
// It is not a perk and no class owns it: it is the answer to being on 30 health with
// no medic anywhere, which otherwise has no answer at all.
//
// Somewhere between tsm_stim_min and tsm_stim_max health, rolled when it is used, so
// spending it early might buy very little and spending it is a decision rather than a
// known quantity. CAPPED AT THE PLAYER'S OWN CLASS HEALTH, as the medic's heal is --
// a Heavy tops out at 200 and a Marksman at 85, and a stim must not push anyone past
// what their class is worth.
//
// Using it at full health is REFUSED AND DOES NOT SPEND IT. Taking someone's only
// stimpack for a heal that did nothing would only teach them to watch the number before
// pressing the key.
//
// It glows WHITE, where the medic glows red and the engineer yellow, so what happened
// is readable across a room. The sound is tsm_medic_sound rather than one of its own,
// so there is a single healing sound on the server to change instead of two that drift.
//
// Spent once a round, not once a life: it comes back when the next round starts and NOT
// on a mid-round respawn.
//
// Typed as .stim in chat, or bound to a key with:  bind x stim
tsm_stim 1
tsm_stim_min 25
tsm_stim_max 50
tsm_stim_glow 1.5
tsm_stim_shell 16


// The sounds the two perks play, heard by anyone nearby rather than only by the two
// players involved.
//
// These are STOCK HALF-LIFE sounds and every client already has them. A custom wav
// has to reach every client before they can hear it -- without fastdl they get
// silence -- and precaching a path that does not exist is a FATAL Host_Error on map
// load. If you replace these, the file must exist on the server and be downloadable.
//
// Empty disables that sound.
tsm_medic_sound "items/medshot4.wav"
tsm_eng_sound "items/9mmclip1.wav"

// The join jingle, played ONLY to the player who just connected -- not to the server --
// at full volume. Same rules as above: the file must exist on the server under sound\
// (the plugin precaches it only if it is there) and reach the client. Empty disables it.
tsm_welcome_sound "welcome.wav"


// Slow health regeneration, for any class carrying perk 5. The Heavy has it.
//
// 10 every 15 seconds is two thirds of a point a second, which cannot out-heal
// anything being shot at it. That is the point: it is what lets a Heavy who breaks
// contact come back, not what keeps one alive in a firefight.
//
// tsm_regen_pause is how long they have to go WITHOUT BEING HIT before it resumes.
// Any damage restarts it -- enemy fire, a fall, a grenade -- so a player under fire
// never ticks.
//
// Regeneration stops at the class's own health, so a Heavy tops out at its 200.
tsm_regen_amount 10
tsm_regen_interval 15.0
tsm_regen_pause 15.0

// Comma-separated entity classnames a combat engineer may operate with +USE.
// Empty = inert, so +USE against the world behaves exactly as stock TS. Fill this in
// once maps ship entities meant for it.
tsm_eng_entities ""


// ---- scoreboard ---------------------------------------------------------------

// Short names for the on-screen score line. Blank = first three letters of the team
// name, so INSURRECTIONISTS becomes INS.
tsm_team1_short ""
tsm_team2_short ""


// ---- forcing the mod's team list ----------------------------------------------

// Re-apply mp_teamlist after the map has loaded.
//
// WHY THIS EXISTS: teamlist, teammodels, mapteams and defaultteam are worldspawn
// KEYVALUES. The map sets them when it spawns, which is AFTER server.cfg and
// listenserver.cfg have run -- so with mp_teamoverride 1 the map wins and your
// correctly written config lines are discarded a moment later. That is why
// mp_teamlist kept reverting to names nobody configured and mp_teammodels kept
// emptying out.
//
// The list is built from tsm_team1_name and tsm_team2_name, so the mod's teams and
// this plugin's idea of the teams cannot drift apart.
//
// Setting mp_teamoverride 0 in listenserver.cfg is the other half of the fix.
tsm_force_teamlist 1

// Optional. Blank leaves mp_teammodels alone; set it to force models too.
// Format: | separates TEAMS, ; separates alternatives WITHIN a team.
//   "repuheavy|seal;merc"  -> team 1 repuheavy, team 2 seal or merc
tsm_force_teammodels ""


// ---- team menu wording --------------------------------------------------------

// Long names shown in the "Pick a side" menu. These are PURELY display text -- the
// mod is still joined using the short names in tsm_team1_name / tsm_team2_name, so
// changing these cannot break team detection.
tsm_team1_label "the Middle Sea Republic"
tsm_team2_label "the Insurrectionists"


// ---- menu timing --------------------------------------------------------------

// Seconds to wait after someone joins before offering the "Pick a side" menu.
//
// TS opens its own buy menu on spawn. That is a VGUI panel and it holds keyboard
// focus, so an AMXX menu drawn while it is up renders perfectly and never receives a
// single keypress -- which is exactly why the side menu appeared and then ignored all
// input. Waiting lets the player dismiss TS's menu first.
//
// Type .team at any time to bring the side menu back.
tsm_menu_delay 3


// ---- class weapons ------------------------------------------------------------

// 0 - classes set health, armour, model and perk but hand out NO weapons
// 2 - write TS's own armament and respawn (DEFAULT)
//
// Mode 1 -- spawning a ts_groundweapon entity per weapon -- has been REMOVED.
// Creating those entities floods every connected client with entity traffic in one
// frame. With a full server that overran the network buffer (SZ_GetSpace: overflow)
// and clients read the truncated message as a beam, crashing with "Bad model on beam
// (not sprite)". Precaching all 36 weapons did not help -- the precache table was
// never the problem.
//
// This plugin now creates NO weapon entities for anyone. Humans are armed through
// TS's own armament commands; bots keep whatever rcbot gives them.
tsm_weapon_mode 2


// ---- spectator team -----------------------------------------------------------

// A real third TS team for people who are not playing.
//
// Without one, "has not picked a side" and "is watching" are the same state to TS, and
// someone sitting in it is still a live body in the world. With it, the mod and this
// plugin agree about who is in the match.
//
// The plugin appends this to mp_teamlist automatically (tsm_force_teamlist), so the
// live list becomes "msr;insurrectionists;spectator". Blank disables it.
tsm_spectator_team "spectator"

// That team's position in mp_teamlist -- 1 and 2 are the playing sides, so 3.
// (TS's own menu uses 5 for "auto assign", which is NOT spectate.)
tsm_spectate_index 3


// ---- ammunition ---------------------------------------------------------------

// Spare magazines added to every weapon on top of what its class line asks for.
tsm_clip_bonus 6

// Hard ceiling on total spare magazines per weapon, so no class combination can turn
// into an ammo dump.
tsm_clip_max 14

// HOW MUCH of those magazines TS actually holds, as a percentage of the full stack.
//
// The class figure reaches ts_giveweapon as raw ROUNDS, not clips -- the odd handful of
// 9-ish spare bullets everyone saw instead of proper mags. Once each weapon lands, the
// plugin rewrites the reserve in real ammunition at figure x magazine size x this
// percent. 100 is every listed magazine held in full; 50 is the halved first tuning;
// anything 0 or below skips the rewrite and leaves ts_giveweapon's small reserve
// standing. TS still clamps whatever that weapon's own cap is, so "six M60 mags"
// lands wherever TS says the M60 tops out.
tsm_clip_sparepct 100


// ---- loadout timing -----------------------------------------------------------

// Seconds between writing a player's armament and the respawn that applies it.
//
// rst_cfg and tkw are CLIENT commands: the server tells the client to run them and the
// client sends them back. That round trip is not instant, so respawning too early runs
// BuyArmament before the last tkw has arrived -- which hands out a partial loadout and
// loses the magazines attached to the missing entries.
//
// The plugin now counts the commands back and waits for them, using this only as the
// starting delay. Raise it if the log reports "respawned with N command(s)
// unconfirmed" on a busy or high-ping server.
tsm_arm_delay 2.5


// Attachments asked for on every weapon of a class loadout.
//
// It is a bitmask, handed to ts_giveweapon as its fourth argument:
//
//     1  silencer        2  laser sight        4  flashlight        8  scope
//
// 0 asks for a bare weapon and is what the plugin has always sent. It is here as a
// setting rather than buried in the source because the M4A1 has been turning up
// SILENCED anyway, and this is the only thing that could be asking for it -- there is
// exactly one ts_giveweapon call in the whole plugin, and TS's own buy path is bypassed
// entirely, so nothing else in the loadout is attaching anything.
//
// If 0 still comes back silenced then TS attaches it of its own accord and no value here
// will change that; there is no ts_setuserwpn to take one off afterwards. To find out,
// set tsm_dbglog to 3 and look for the line reading
//
//     give: <id> asked for extra 0, ended up holding mode N extra N SILENCED
//
// printed once per player per arming. That readback deliberately runs ONCE, after every
// weapon is given, and only when debug logging is on: it used to sit inside the
// weapon loop, and when ts_getuserwpn errored there -- which it does when TS has not yet
// switched the player to a weapon -- the whole call aborted, taking with it the
// set_task a few lines below that opens the class menu. The menu then never appeared
// during the countdown and the weapons still arrived, so it looked like a menu fault.
tsm_wpn_extra 0


// Whether a class's HEIGHT is applied at all.
//
// The last field of a tsm_classN line, after the speed multiplier, is how tall that
// class is drawn: 1.0 is normal, and the Heavy is set to 1.10. Set this to 0 to put
// every class back to normal height without touching the class lines.
//
// READ THIS BEFORE RAISING IT. It scales what is DRAWN and nothing else. GoldSrc gives
// every player the same movement hull -- the engine's own, not the entity's -- so a
// taller Heavy still fits through exactly the same gaps and ducks under exactly the same
// pipes. And his HITBOX does not grow with him: the head you can see above the normal
// silhouette is not a head you can shoot. At 1.10 that is a few inches and reads as a
// big man; past about 1.25 it is a man you can shoot through, so the plugin clamps it
// there whatever the class line asks for.
//
// It is applied when the loadout is handed over and comes off on its own the moment a
// round or the match ends, because the same ST_LIVE test that gates the speed multiplier
// gates this -- there is no state left behind to get stuck.
tsm_class_scale 1


// ===========================================================================
//  WHY THERE IS NO PANEL BEHIND THE MENUS
// ===========================================================================
//
// One was built and taken out again, and the reason is worth keeping so it is not tried
// a second time.
//
// A server plugin CAN put an image on screen -- the class icons over players' heads are
// exactly that. What it cannot do is make one behave like UI. The only way to get a
// picture in front of a player's eye is a world entity placed there, and a world entity
// is sent to the client as a position and then INTERPOLATED, while the client predicts
// its own view instantly from the mouse. The panel therefore lagged every turn and swam
// across the screen, sat over the player's own character, and could be occluded by
// anything that got between the eye and it.
//
// The engine gives a plugin three screen-space tools and no more: positioned TEXT
// (hudmessage), a full-screen colour FADE, and the fixed status-icon slot. There is no
// message meaning "draw this sprite at these screen coordinates". Nothing server-side
// closes that gap.
//
// sprites/tsm_panel.spr and sprites/tsm_banner.spr are kept, with their PNGs in
// export-mdl, and modelling/make-menu-panel.mjs still draws them.



// ---- ammunition ---------------------------------------------------------------

// Spare magazines of every ammo type handed out with the loadout.
//
// This used to go through TS's tka command, which is a PURCHASE -- so with
// weaponrestriction 1 it was refused along with the weapons, and players spawned
// holding guns with nothing in them. It is now given the same way the combat
// engineer's resupply is: a ts_groundammo entity created, handed over and removed
// in one call. A pickup rather than a purchase, so the restriction has no say.
//
// Every ammo type is given rather than only the matching one, because the
// weapon-to-ammotype mapping lives in the mod's weapon table and is not reachable
// from a plugin. Only the types your weapons actually use get consumed, so a small
// number here stays modest in practice.
//
// 0 disables it and leaves players with only what each weapon carries.
tsm_ammo_mags 6


// Put anyone who arrives without a side onto the spectator team automatically.
//
// Joining used to leave people simply teamless, which is NOT the same thing -- TS
// still had them as a live body in the world with no team, free to wander around
// during a match. On the spectator team they are held and invisible like any other
// non-participant, and the side menu is what lets them in.
//
// The wait before this happens is tsm_menu_delay.
tsm_default_spectator 1


// ---- keeping the sides even ---------------------------------------------------

// Fill a side that is short at the start of a round.
//
// 0 = never
// 1 = pull in late joiners who are sitting the match out (DEFAULT)
// 2 = late joiners first, then people who deliberately chose to spectate
//
// Sides are locked once a match starts, so without this a mid-match disconnect leaves
// the rest of the match 2v1. Filling happens between rounds, never mid-round -- being
// dropped into a firefight already in progress is worse than playing a round short.
tsm_autofill 1

// Teammates cannot damage each other. Enforced by the plugin rather than by
// mp_friendlyfire, because the plugin owns team membership and TS may not agree about
// who is on whose side.
tsm_friendlyfire 0


// Remove weapons and ammo that PLAYERS dropped, at the start of every round.
//
// Buying is already refused, but that does not stop someone dropping what they are
// holding during warmup and collecting it once the round is live -- which smuggles a
// whole extra loadout past the class system.
//
// Only dropped items are removed. Weapons the mapper placed are recorded when the map
// spawns and are left alone, so map pickups keep working normally.
tsm_sweep_drops 1

// How long, in seconds, a dropped weapon or ammo pickup is left lying before it is
// reclaimed. 0 never reclaims by age.
//
// THIS IS WHAT STOPS THE SERVER RUNNING OUT OF ENTITY SLOTS. Every pickup on the
// ground holds an edict, the engine has a fixed number of them, and when they are
// gone it refuses to create anything at all -- no loadouts, no ammunition, no bodies,
// just "could not create ts_groundammo" once a second until the map changes.
//
// The sweep used to be skipped entirely whenever bots were enabled, because rcbot
// arms its bots by spawning a ts_groundweapon for them to walk into and sweeping by
// classname took those too -- bots ran at people punching. Age is the thing the
// classname cannot tell you: a bot reaches its weapon in about a second, and a rifle
// beside a corpse is still there minutes later. 60 is far longer than any bot needs
// and far shorter than a round.
tsm_drop_life 60.0


// ---- recon: cloak -------------------------------------------------------------

// Master switch for .cloak / .uncloak. 1 = usable, 0 = both commands are refused
// outright, same shape as tsm_classes for the class system as a whole.
//
// Recon shimmers near-invisible on .cloak: the player model stays drawn, at a very
// low render alpha (tsm_cloak_opacity). .uncloak reverses it. Both ends play one of
// two sounds (cloak.wav / cloak2.wav, uncloak.wav / uncloak2.wav, picked at random) at
// ordinary distance falloff -- audible up close, not map-wide -- plus a blue flash seen
// by anyone nearby. Usable only in a live round.
//
// The cloaker cannot see the effect on himself: the client draws its own player at its
// own opacity, whatever the server sends. amx_tsm_cloak <player> toggles a cloak on
// anyone, a bot included, so it can be looked at from outside.
//
// Bots neither see nor target a cloaked player until the cloak ends. It is not damage
// immunity: shots and blasts still hurt him.
//
// TAKING OR DEALING ANY DAMAGE BREAKS IT, forcing the same uncloak sound and flash:
// cloak is for moving unseen, not for fighting from inside it. It also ends silently
// (no sound, no flash) if the match takes the player out of the round some other way
// -- elimination, the warmup hold, becoming a spectator -- since those are the match
// ending it, not the player choosing to.
tsm_cloak_enabled 1

// How long a cloak lasts on its own, in seconds, before it expires -- the uncloak sound
// and flash fire the same as if .uncloak had been typed. 0 means it never expires by
// itself: only .uncloak or taking/dealing damage would end it.
tsm_cloak_duration 30.0

// How long .cloak waits after a cloak ends -- by .uncloak, expiry, or being broken --
// before it works again, in seconds. 0 means no wait at all.
tsm_cloak_cooldown 30.0

// How solid a cloaked Recon looks, 0-255. 0 is fully invisible, 255 is not cloaked
// at all. The first number shipped (40) read as barely dimmed in an actual match --
// this is now a cvar specifically so a number like that can be tried and changed in
// game instead of needing a rebuild each time.
tsm_cloak_opacity 10.0


// ---- officer: scan ------------------------------------------------------------

// The Officer's .scan. Once per cooldown, every cloaked ENEMY inside a sphere of
// tsm_scan_radius units around the Officer is exposed to his ENTIRE side for
// tsm_scan_time seconds -- not just to the Officer, to everyone wearing his colour.
// Then the scanner recharges.
//
// The reveal is a blue glow shell, the medic's glow, on both engines: for those ten
// seconds the cloaked man's body is drawn SOLID to your side, with the shell around
// it, wherever you have a line of sight to him. During sudden death on H9XASH the
// x-ray's through-wall shell takes the blue one's place, over a body still drawn
// solid. Your side's bots can see and engage him too. His own side keeps seeing
// whatever it did before -- the shell goes only to the side that scanned him.
//
// The mark is TIME, not state: it is set the moment the scan fires and runs out on its
// own. Uncloak inside the window and the blue simply stops mattering; recloak and the
// mark is still live and will find you again. The shell is only ever shown while he is
// ACTUALLY cloaked (alive, in the round, under it).
//
// The cooldown is measured from use, like the cloak's and the Mech's rocket: with the
// defaults the scanner is charged again 20 seconds after the blue fades. .scan re-arms
// at the start of every round.
//
// tsm_scan_sound is the ping the scan makes, played FROM the Officer at ordinary
// falloff -- the people standing near him of BOTH sides hear that a scan went off.
// The wav lives in sound\ (sound\scan.wav) and is named here; the build copies it to
// the servers. Empty plays nothing, and the plugin precaches the wav only if the file
// is there, so an empty or missing name is not a crash.
tsm_scan_radius 1024
tsm_scan_cooldown 30.0
tsm_scan_time 10.0
tsm_scan_sound "scan.wav"


// ---- bots ---------------------------------------------------------------------

// Master switch. OFF by default.
//
// With this at 0 the match mode skips bots in every single player enumeration, so a
// server running bots for any other reason is completely unaffected -- they are not
// counted, not assigned, not held, not reported. Flip it to 1 only when you want bots
// playing the match.
//
// The bots themselves come from rcbot (a separate Metamod plugin) -- this plugin does
// not create them. It only decides whether they count as participants.
tsm_bots 10

// both - spread bots across BOTH sides, filling whichever is short (DEFAULT)
// 1    - all bots on team 1
// 2    - all bots on team 2
tsm_bot_teams "both"

// spread - round-robin the classes, so a bot side is not all one class (DEFAULT)
// 0      - every bot uses tsm_default_class
// <n>    - every bot uses class n
tsm_bot_class "1"

// Arm bots from their class.
//
// Bots are armed by spawning the weapon as an entity, NOT through the armament path
// humans use -- that path works by asking the CLIENT to run commands and send them
// back, and a fake client has no client to do it.
//
// NOTE: rcbot already arms TS bots the same way (UTIL_makeTSweapon spawns a
// ts_groundweapon with tsweaponid/wextraclip/wduration keyvalues). So this can
// DUPLICATE what rcbot gives them. If bots end up with more than their class should
// have, set this to 0 and let rcbot handle it -- they just will not match their class.
// Accepted and ignored -- no weapon entities are created for anyone.
tsm_bot_loadout 0

// Count bots as ready. A bot cannot type .ready, so with this at 0 a side holding one
// can never satisfy the ready gate and the match will not start.
tsm_bot_ready 1


// ---- powerups -----------------------------------------------------------------

// Remove TS's powerups from match play.
//
// Powerups are a deathmatch feature -- whoever happens to be standing near one when a
// round starts gets an advantage nobody chose. This hides the pickups at every round
// start and refuses the command that activates one.
//
// Pickups are hidden and made intangible rather than deleted, so the map's own respawn
// logic has nothing to trip over and they come back if this is switched off.
tsm_no_powerups 1

// ---- death ---------------------------------------------------------------------

// CEILING, not a delay.
//
// A killed player becomes an invisible spectator when TS RESPAWNS them -- that is the
// moment the body has finished dying. This value only exists so a corpse cannot lie
// there forever if the respawn never comes, so it wants to be comfortably longer than
// a respawn takes. Too short and it fires first, which looks like the body vanishing
// the instant you kill someone.
tsm_death_delay 4

// Both teams hear death/officer_perished.wav, on every client at full volume, when an
// Officer is slain. 0 turns it off.
tsm_officerslain_sound 1

// Seconds bots sit out after a match before picking sides again.
//
// Bots are parked as spectators when a match ends, so the next match's sides are
// re-picked and rebalanced rather than inherited. They have to come back on their
// own: a bot cannot use the side menu, and waiting for the next match to start
// deadlocks -- that match needs players on both sides to begin, and every bot is
// sitting out.
//
// 0 is not valid; keep it long enough to see the reset happen.
tsm_bot_return 6.0


// ===========================================================================
//  BOT NAMES
// ===========================================================================

// Rename bots after the side they are on, so the scoreboard reads as two teams
// rather than as a list of rcbot profile names.
//
// The number is the lowest free one on that side, so the set stays dense as bots
// join, swap sides and leave instead of climbing forever.
//
// 0 leaves rcbot's own profile names alone.
tsm_bot_names 1

// The prefixes. A blank prefix leaves that side's names untouched.
tsm_bot_name1 "Enforcer"
tsm_bot_name2 "Insurgent"


// ===========================================================================
//  BREACHER PERK  (class perk 2)
// ===========================================================================

// What a Breacher can force open with +USE.
//
// HL locks a door in two ways and only one is reachable from a plugin:
//
//   SF_DOOR_USE_ONLY in spawnflags lives in entvars, so the Breacher clears it.
//   That is what makes a door that refuses to be touched open respond at all.
//
//   A master entity (the "master" keyvalue, normally a multisource) lives in the
//   door's private data, which a plugin cannot read or write. A door locked that
//   way cannot be forced directly -- put the MASTER, or the trigger feeding it,
//   in this list instead of the door. Firing the master is what unlocks it.
//
// Comma separated, no spaces around the commas, 24 entries maximum.
tsm_breach_entities "func_door,func_door_rotating,func_wall_toggle,func_button"

// How far ahead a Breacher can reach, in units. Separate from tsm_eng_range so
// the two perks can be tuned apart.
tsm_breach_range 96

// The map's DECLARED breach doors, by targetname: eight lists, comma or space
// separated, each door named with its targetname. A door on any of these lists is
// breach objective territory -- a Breacher's +USE forces it and prints "Breached."
//
// The "Breached." flash only appears on a real breach: a door that was LOCKED
// (spawnflag "Use Only", 32) or one named on a list below. An ordinary unlocked
// door under the crosshair behaves like stock TS -- it opens for anyone the map
// already allows and prints nothing.
tsm_breachdoor_1 ""
tsm_breachdoor_2 ""
tsm_breachdoor_3 ""
tsm_breachdoor_4 ""
tsm_breachdoor_5 ""
tsm_breachdoor_6 ""
tsm_breachdoor_7 ""
tsm_breachdoor_8 ""

// A Breacher cannot force an engineer door open. See the block below for what
// those are -- forcing one works by clearing its lock, so refusing the Use
// afterwards would leave the door unlocked for the rest of the map and open to
// anyone who walked into it.


// ===========================================================================
//  ENGINEER DOORS  (doors a map reserves for one class)
// ===========================================================================

// A map marks a door for this by giving it the targetname "tsm_eng_door" and the
// spawnflag 256, which is SF_DOOR_USE_ONLY in the Half-Life SDK: the door stops
// opening when somebody walks into it and answers +USE alone. This plugin then
// refuses that +USE for everyone except the class named here.
//
// h9_te_neuropolis has two of them, one at each spawn, on the corridors running
// south into the run-down quarter that joins the two bases. Any other map works
// the same way the moment it names a door that.
//
// MATCHED BY NAME, NOT BY NUMBER. The class number is only a position in
// tsm_class1..tsm_class7, so reordering those -- a one-line edit -- would hand
// the doors to whichever class landed in that slot without a word. The name is
// what an operator actually sets, so it is what this follows. Case does not
// matter; rename the class in tsm_class2 and rename it here to match.
//
// The holder has to be ALIVE and IN A LIVE ROUND, the same condition the Officer
// perk is under. Classes are only handed out at the freeze before a round, so
// during warmup nobody has one and the doors stay shut for everybody -- that is
// the gate working, not a fault.
tsm_eng_door_class "Combat Engineer"


// ===========================================================================
//  LOADOUT ORDER
// ===========================================================================

// Which weapon a player spawns holding.
//
// TS leaves the most recently issued weapon selected, and the class lines are
// written primary-first because that is the readable way round -- so the sidearm
// was always issued last and everyone spawned holding a pistol with their rifle
// on their back.
//
// 1 issues the list back to front, so the FIRST weapon on the class line is the
// one in their hands. 0 issues it literally, which is the old behaviour.
tsm_arm_order 1


// ===========================================================================

// Stop a bot firing while a living teammate is in its line of fire.
//
// rcbot picks its own targets and has no setting that makes it respect a side --
// the team deathmatch bug is open upstream and affects TS, HLDM and Opposing
// Force alike. Blocking the damage is not enough by itself: the bots still stand
// there emptying magazines into each other instead of fighting.
//
// This treats the symptom. The targeting decision happens inside rcbot and cannot
// be reached from a plugin. Traced only on the frames a bot is actually holding
// attack, so the cost is small.


// ===========================================================================
//  MEDIC PERK  (class perk 3)
// ===========================================================================

// +USE on a teammate heals them. The Medic carries a sidearm and no primary, so
// the heal is what the class is for.

// Hit points per heal. Capped at the TARGET's own class health -- a Heavy's 125
// is part of what that class costs, so topping anyone past their own ceiling
// would undo the class table.
tsm_medic_heal 50

// Seconds between heals, per medic. Reset at the start of every round, the same
// way the engineer's one resupply is.
tsm_medic_cooldown 15.0

// How far the medic can reach, in units.
tsm_medic_range 96

// How long the red glow stays on the person who was healed.
//
// Drawn with renderfx (a glow shell), NOT rendermode -- the elimination hide owns
// rendermode and renderamt, and writing those from here would un-hide the body of
// someone who died while still glowing.
tsm_medic_glow 1.5


// ===========================================================================
//  TEAM OBJECTIVE BANNERS
// ===========================================================================

// What each side reads in BIG LETTERS, upper-middle of the screen, one second
// after a round starts and for five seconds after. Side 1 is the MSR side and
// draws BLUE; side 2 is Insurgency and draws RED.
//
// "" (EMPTY) SHOWS NOTHING. Leave them empty and the feature is not there.
//
// Several rows are written with a pipe: every | starts a new row, and the rows
// stack beneath each other. Six rows will not fit legibly -- three is sensible.
//
// Examples:
//
//   tsm_obj_msg_1 "HOLD THE GATES|DO NOT LET THEM BREACH"
//   tsm_obj_msg_2 "BREACH THE GATES|PLANT THE CHARGE|TAKE THE YARD"
tsm_obj_msg_1 ""
tsm_obj_msg_2 ""


// ===========================================================================
//  SIEGE OBJECTIVES
// ===========================================================================

// WHICH SIDE IS THE ATTACKERS. 1 = MSR (blue), 2 = Insurgency (red). The siege
// chain is tsm_obj_1..9, taken in order; a player of the other side who tries is
// told "That is yours to defend.". An objective that falls blows up and the round
// goes on, the attackers moving to the next one, and every fall sends the three-layer
// HL1 explosion and the ground shake to everyone. Only the LAST objective ends the
// round in this side's favour. Every new round starts the chain over at objective 1,
// every body back.
tsm_obj_team 2

// The class who may PLANT the satchel -- hold +USE through the plant, the
// fuse does the rest afterwards. This server plants with the Breacher alone:
// nobody else may, and every other class's only route to an objective is a
// breakable body taken by gunfire. Empty ("") would open planting to every
// class of the attacking side.
tsm_obj_class "Breacher"

// THE SATCHEL FLOW. Nothing blows on a press of E: planting an objective is a
// hold of tsm_obj_time seconds (the planter's own loading bar fills at screen
// centre while the engine's satchel-reach clack rings from the objective's
// spot), then the server's own sound\plant.wav rings ONCE as the satchel is
// in. It burns tsm_obj_fuse seconds and the explosion at its end is
// what destroys the objective's body; only the LAST objective's blast ends the
// round (victor set, then the slay when tsm_obj_slay is 1). tsm_obj_range is
// the aim reach in units.
tsm_obj_time 10.0
tsm_obj_fuse 5.0
tsm_obj_range 96
tsm_obj_slay 1


// ===========================================================================
//  THE SIEGE ALARM
// ===========================================================================

// The ALARM. The first successful attack of a round on anything the other side
// owns -- a charge set on a tsm_obj siege objective, or one of the breach
// doors forced -- starts the siren (sound/bloblarm.wav), and it then loops for
// the remainder of the round, as exactly ONE copy: a second attack changes
// nothing, the loop simply carries on. It stops when the round does.
//
// The siren is heard by EVERYONE, both sides, wherever they stand: each player's
// own client plays it. Both sides also read a line just under screen centre, in
// their own colour, redrawn each time the loop ticks: the side under attack reads
// tsm_alarm_msg, the attacking side tsm_alarm_msg_attack.
//
// 0 = the alarm stands down entirely (no siren, no line).
tsm_alarm 1

// The siren's volume, 0.0 to 1.0.
tsm_alarm_vol 0.3

// The warning line itself; a pipe "|" is a row break, same as the round
// banners above. Empty hides the line -- the siren (still gated by tsm_alarm)
// keeps running without it.
tsm_alarm_msg "BREACH|IN PROGRESS"

// The attacking side's line, in the same place, the same way.
tsm_alarm_msg_attack "YOUR TEAM IS CURRENTLY SIEGING THE MAP"


// ===========================================================================
//  DEATH LINGER
// ===========================================================================

// Seconds after a kill during which this plugin does not touch the dying player
// at all, before taking them out of play as a spectator.
//
// It is a LEAVE-ALONE window, not a mechanism that holds a body up. The body on
// the floor is not the player entity: TS registers its own `deadcorpse` entity
// and spawns one during the death sequence, so the corpse persists on its own and
// nothing here needs to keep the player drawn.
//
// That matters because every attempt to hold the body WAS the bug. Clearing the
// attack button to refuse the respawn was the worst of them -- TS completes the
// death sequence at the respawn, so blocking it did not preserve a body, it
// delayed the corpse by exactly this value and the body appeared that many
// seconds late with its death animation already finished.
//
// tsm_death_delay remains the CEILING, for the case where TS never respawns them
// at all. This value must be lower than that.
// MUST OUTLAST TS'S OWN CORPSE, which lives exactly 10 seconds.
//
// The mod's timings are hardcoded, not configurable, and they are these:
//
//   death           PlayerDeathThink waits out the death animation, then waits for
//                   either any button except IN_SCORE, or death_time + 3.0
//   corpse created  TSCreateDeadCorpse(player, 10.0) -- the 10.0 is a lifetime
//   0.00 - 3.33 s   corpse fully opaque
//   3.33 - 10.0 s   corpse fades linearly to invisible, stepped every 0.5 s
//   10.0 s          UTIL_Remove -- the corpse is gone
//
// Two things follow. Setting EF_NODRAW on the player BEFORE the corpse is created
// makes TSCreateDeadCorpse return without creating anything, so no body appears at
// all. And hiding the player while the corpse is still on the floor cuts the fade
// short, which reads as the body vanishing early -- at 4.0 that landed exactly as the
// fade began, which is why bodies still went, just less abruptly.
//
// So this waits out the whole 10 seconds. tsm_death_delay is the ceiling and must be
// higher still.
tsm_death_linger 10.5


// ===========================================================================
//  HOLDING TS'S CORPSE ON THE FLOOR
// ===========================================================================

// READ THIS BEFORE TURNING A KNOB, because the obvious one is not the one you want.
//
// There are TWO entities involved and they are not the same thing:
//
//   the PLAYER   -- hidden by us after tsm_death_linger. This is the thing that gets
//                   EF_NODRAW. It is not the body you see on the floor.
//   the CORPSE   -- TS's own `deadcorpse`, spawned during the death sequence. THIS is
//                   the body. We never created it and, until now, never touched it.
//
// tsm_death_linger only ever governed the first one, which is why raising it stopped
// helping: at 10.5 it already outlasts the corpse entirely. TS gives its corpse a
// HARDCODED ten second life -- opaque to 3.33, fading in half-second steps to 10.0,
// then removed outright. The body going at ten seconds was TS taking it, on its own
// clock, and no value of ours reached that.
//
// So the corpse is now held directly. One think does both the fade and the removal, so
// holding its nextthink in the future stops both at once. Nothing is drawn over it,
// nothing is moved, and no player is touched -- every earlier attempt touched a player
// and every one made it worse. Hiding a player BEFORE the corpse is created makes
// TSCreateDeadCorpse return without creating anything, so no body appears at all.

// How long the corpse stays, in total. THIS is the "bodies do not last long enough"
// setting. TS's own is 10; this doubles it. 0 gives TS its corpses back and restores
// exactly the behaviour you had before.
tsm_corpse_hold 20.0

// How many of those seconds are spent FADING OUT at the end. This is the "bodies blink
// out" setting, and it does NOT make them last longer -- the total is tsm_corpse_hold
// either way. At 5.0 of a 20.0 hold the body is solid for fifteen seconds and then eases
// away over five.
//
// It cannot be skipped. Released without it, the corpse's own fade timer has long since
// expired, so the first think it is allowed to run goes straight to removal -- which is
// the body vanishing mid-air that this whole section exists to stop.
tsm_corpse_fade 5.0



// A ceiling on how many are held at once. A held corpse is an edict that is not being
// recycled, and a busy round on a 32 slot server puts a lot of bodies down. Past this
// many, the newest are left to TS -- which is the behaviour we already had, not a
// failure. Running the engine out of entities costs the round, not the corpses.
tsm_corpse_max 24

// NOTHING ENFORCES THE LINGER, deliberately. TS owns the death sequence: it plays
// the animation, drops its `deadcorpse`, and respawns on its own schedule. The
// hide applies to the respawned player, never to the corpse.
//
// tsm_debug_log 2 writes a per-frame deathtrace for four seconds after each death
// -- solid, nodraw, rendermode, renderamt, sequence, modelindex, deadflag and
// movetype -- which is how visibility was ruled out as the cause.

// Thickness of the medic's red glow shell.
//
// For a glow shell renderamt is the shell THICKNESS, not an alpha -- at 0 the
// shell has no thickness and is exactly as invisible as no glow at all.
tsm_medic_shell 16


// ===========================================================================
//  OFFICER PERK  (class perk 4)  --  .follow / .unfollow
// ===========================================================================

// An Officer orders bots on their own side to follow them.
//
//   .follow     take up to tsm_squad_max free bots under command
//   .unfollow   stand the whole squad down
//
// HOW THIS WORKS, AND WHAT TO EXPECT
//
// rcbot has NO follow command -- there is nothing in its command set to order a
// bot to a player -- so the plugin steers them itself by writing their velocity
// towards the officer. rcbot is still pathing them on its own frames, so this is
// a tug of war rather than a handover: they trail along, they do not form up.
//
// Bots already following another officer are not poached, so two officers do not
// spend the round taking the same squad off each other.
//
// Inside tsm_squad_dist, squad bots within 40 units of the officer get a gentle
// outward push so they don't crowd the officer. Any player can type .unstick to
// clear themselves and push nearby teammate bots off them (3s cooldown).

// How many bots one officer can command.
tsm_squad_max 20

// How close they try to stay, in units. Inside this they are left to rcbot.
tsm_squad_dist 160

// Beyond this distance the bot is TELEPORTED to a clear spot BESIDE the officer,
// never onto them. The plugin searches a ring of 8 positions behind the officer
// and picks the first clear one (TraceHull down, bodies block).
//
// Blunt, and deliberately so: nudging a velocity cannot beat rcbot pathing a bot
// across the map, so without this an order would be decorative the moment a bot
// wandered off. Raise it if the warps look too eager.
tsm_squad_warp 1200

// How fast they are steered, in units per second.
tsm_squad_speed 240


// ===========================================================================
//  ROUND END DELAY
// ===========================================================================

// Seconds between the last enemy dying and the round actually ending.
//
// Ending on that frame froze and hid everyone mid-kill -- the winning shot and
// the round ending were the same instant, so nobody saw it happen. This is also
// what lets the final death play out, because the round-end state holds every
// player the moment it begins.
tsm_roundend_delay 4.0

// ===========================================================================
//  BOT RESUPPLY
// ===========================================================================

// Seconds between topping a bot up with ammunition. 0 turns it off.
//
// Bots run dry and then keep pulling the trigger, because rcbot never sees the
// weapons we hand out: the class loadout is written through TS's own buy commands
// (tkw and tka) and applied by BuyArmament at spawn, so no pickup ever happens for
// rcbot to observe. Its ammo count, its reload decision and its decision to switch
// to something that still has rounds are all working from an inventory it does not
// have.
//
// Keeping them topped up sidesteps all three: a bot that never runs out never needs
// to reload or switch. It does not make rcbot correct, it makes being wrong cost
// nothing.
//
// One bot per second at most, round-robin. Creating a batch of entities in a single
// frame is what flooded clients with SZ_GetSpace: overflow when loadouts used to be
// handed out that way.
tsm_bot_resupply 20.0


// ===========================================================================
//  FRIENDLY FIRE
// ===========================================================================

// 0 blocks all damage between players on the same side.
//
// Enforced through Ham_TakeDamage, which is the game DLL's own function and so
// fires for bots as well as humans. The previous mechanism was built on
// register_event("Damage"), which is driven by the network message sent to the
// damaged CLIENT -- and a fake client is sent no messages, so it never fired once
// for a bot victim. Bot-on-bot friendly fire was completely unprotected.
//
// This REQUIRES hamsandwich in addons/amxmodx/configs/modules.ini. Without it the
// plugin will not load at all.
//
// It stops teammates hurting each other. It does NOT stop a bot aiming at one --
// that choice is made inside rcbot and cannot be reached from a plugin.
tsm_friendlyfire 0


// ===========================================================================
//  BOTS TARGETING THEIR OWN SIDE
// ===========================================================================

// 1 hides teammates from a bot's line of sight.
//
// This is what stops bots shooting their own side, and it works by removing the
// input rather than by arguing with the decision. rcbot picks its own targets,
// its team support for TS is broken upstream, and nothing it exposes changes
// that -- so there is no way to tell it a player is a teammate. What there IS, is
// the line it traces to ask the engine whether it can see them. Come back empty
// and that player is not a candidate, and no team logic is needed anywhere.
//
// SIDE EFFECT, and it is deliberate: bots shoot straight THROUGH a teammate at
// whatever is behind them. Reporting a wall instead would make them hold fire
// every time a teammate crossed their line, and friendly damage is refused
// outright by the friendly-fire block, so a bullet that passes through costs
// nothing.
//
// This runs on a hot path -- every line of sight every bot tests. The guards are
// ordered cheapest first and the bot lookup is cached, but if it costs frames on
// a full server, set this to 0 and the old behaviour returns immediately.
//
// amx_tsm_debug reports how many traces have been hidden. If that is 0 while bots
// are alive and fighting, the hook is not reaching them.
tsm_bot_blind_ff 1


// ===========================================================================
//  OFFICER SQUADS -- rcbot native
// ===========================================================================

// .follow takes the men standing NEAR the officer and holds them on him.
//
// Handing off to rcbot own squad menu was the previous answer, and rcbot does path
// and hold formation better than anything steered from outside. What it cannot do is
// answer what an officer is asking in an elimination round -- "these men, with me,
// now". Its squad is picked from a list rather than from who is beside you, and it
// re-decides on its own schedule.
//
// The cost is pathing, and it is paid below with line of sight.

// How close a bot must be WHEN .follow IS TYPED to be taken under command.
// This is a one-off reach, not a leash: once taken, a bot is kept at tsm_squad_dist.
//
// The nearest are taken first, up to tsm_squad_max. A bot already commanded by
// another officer is left alone and reported, rather than pulled off him -- two
// officers steering one bot drag it between them every frame.
tsm_squad_reach 2000

// Steering, ON.
//
// This is what makes .follow follow. It is in tension with rcbot, which re-decides
// where its bots are going every frame, and that tension is settled by LINE OF SIGHT:
// in sight the plugin steers, out of sight it does not touch the bot at all and
// rcbot own pathing brings it round. Steering is a straight pull, so through a wall
// it would pull a bot into the wall and hold it there -- worse than not helping.
//
// 0 hands following back to rcbot entirely, and .follow then does nothing useful.
tsm_squad_steer 1


// ===========================================================================

// Half-angle, in degrees, of the cone a bot will not fire into when a teammate
// is inside it. 0 disables the check.
//
// This replaced a single ray down the crosshair, which only ever caught a teammate
// who was dead centre AND nearest -- a bot leading a moving target, spraying, or
// aiming a few degrees off went straight through it. That is why the old check
// could log tens of thousands of hits and still leave bots shooting their own side.
//
// Raise it if bots still hit each other. Lower it to 6-8 if they hold fire too much
// in crowded rooms.

// Seconds the fire stays held once a teammate has been seen in the cone.
//
// Blocking only the frames the test passes cannot stop a burst: the bot pulls the
// trigger, the teammate drifts a degree out of the cone, and the rest of the
// magazine goes through anyway.


// There is no tsm_model_verify any more. It only ever existed to periodically re-check
// whether TS had moved a player's model, and the re-check was itself the
// model-changing-every-few-seconds problem -- TS moves the model on its own schedule,
// the check notices, we write ours back, and the player watches it flip. The model is
// written when something happens instead: class picked, round started, userinfo changed.
// Those events are what fw_userinfo is for, and tsm_model_floor is what keeps the writes
// from becoming a flood.

// Seconds between forcing a bot to reload. 0 turns it off.
//
// Not aggressive on purpose: too short an interval interrupts them mid-burst,
// because a reload they did not ask for cancels the shot they were taking.
//
// They need forcing at all because rcbot never saw the weapons we hand out --
// the loadout is written through TS own buy commands and applied at spawn, so no
// pickup ever happens for it to observe, and its ammo tracking is working from an
// inventory it does not have.
tsm_bot_reload 5.0

// Which class a BLANK model field borrows from, per side. 1 is Assault.
//
// Leaving a class's model blank is how you say "look the same as that class"
// rather than leaving a hole -- it inherits that class's list for the side,
// random picks included. Marksman, Breacher and the Insurgent Officer all do this.
tsm_model_fallback_class 1

// ===========================================================================
//  ADDING OR CHANGING A MODEL -- the two places that must agree
// ===========================================================================
//
// 1. the class table above, so the plugin hands it out
// 2. mp_teammodels in ts/game.cfg, so TS PRECACHES it
//
// Miss the second and the server does not warn you -- it closes. A model that was
// never precached is a fatal Host_Error the instant anything tries to set it:
//
//     Host_Error: PF_setmodel_I: no precache: models/...
//
// The plugin audits this at map load and logs a WARNING naming any class model
// missing from mp_teammodels, so check the AMXX log after changing either one.
//
// game.cfg is the file that matters: server.cfg and listenserver.cfg are exec'd
// only AFTER the first map has spawned, so a value set solely there arrives too
// late for the first map and is re-read on every later one. Keep all three the
// same.


// ===========================================================================
//  THE REST
// ===========================================================================
//
// Settings that work and had no entry here. They are listed at their defaults, so
// pasting this section changes nothing -- it only puts the knobs where they can be
// found.


// ---- the class menu during the freeze --------------------------------------

// How often, in seconds, the class menu is re-offered to somebody who has not picked.
//
// It is re-offered for the whole countdown rather than shown once, because a single
// menu_display is fragile: anything that takes keyboard focus -- a TS VGUI panel,
// another menu -- swallows it and it never comes back, which is why the class menu
// appeared never to show at all.
//
// The offers are spread across frames rather than all sent on the tick that decides
// them. One ShowMenu carrying seven classes is a few hundred bytes, and a full server
// asked at once put several kilobytes into one packet, which is enough to overflow a
// client and drop it with "Illegible server message".
tsm_class_retry 1.0

// Refuse the client command that opens TS's own team panel. The plugin owns team
// membership, and TS's panel writes straight past it.
tsm_block_teamvgui 1


// ---- the round's loadout ---------------------------------------------------

// What a player spawns holding, as id:clips pairs. The default is an MK23 with three
// clips and a combat knife. The ids are the TSW_* enum, the same numbers the class
// table in tsm_class1..7 uses.
tsm_loadout "9:3,25:0"

// Strip weapons a player dropped on death before the next round.
//
// Off, and the reason is worth keeping. It cannot tell a dropped CLASS weapon from
// anything else -- tsweaponid is a private member of the entity and not an entvar, so
// a plugin cannot read it -- and it was taking sidearms players were meant to keep.
// Stripping before the respawn removes the overflow that caused the drop in the first
// place, which is why this is no longer needed.
tsm_clean_drops 0

// Accepted and ignored. It belonged to the old kill-and-respawn reset, and it is still
// registered so configs written for that era load without an unknown-cvar error.
tsm_reset_delay 1.0


// ---- movement and bodies ---------------------------------------------------

// Put a released player's maxspeed back when TS leaves it at 0.
//
// Applied from the POST PlayerPreThink hook, which is the only place it survives: TS
// re-applies its own value and anywhere earlier is simply overwritten.
tsm_force_maxspeed 1

// How long, in seconds, a player who has just been eliminated is left alone before
// being taken out of play.
//
// It exists so the body can be seen. Taking somebody out of play the instant they die
// hides the edict while TS is still killing them, and the corpse the mod is about to
// produce never appears. They are not loose during the wait: elimination is flagged on
// the frame of death, so they already have no weapon. 0 disables it.
tsm_death_grace 2.5


// ---- spawn points ----------------------------------------------------------

// Keep the map's own spawn entities out of the custom set.
//
// Once a map has custom positions saved, those are the only acceptable places to put
// somebody -- the map's own deathmatch spawns are exactly what the custom ones were
// made to replace, so letting them back in silently undoes the work.
tsm_spawn_prune 1

// How close, in units, one of the map's own spawns has to be to a custom one to count
// as the same place and be dropped.
tsm_spawn_prune_dist 64


// ---- looking at a teammate -------------------------------------------------

// Look at someone on your side and their class and health are shown. 0 turns it off.
tsm_hover_info 1

// How far that reaches, in units.
tsm_hover_range 640






