// tsrp_roambots.cfg -- ROAMING CITIZENS on the roleplay maps. Run by the tsrp_roambots plugin
// as each roleplay map loads; no need to exec it. On any other map the plugin does nothing.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit the source copy of this file (the project's TSM folder), or your changes get overwritten.
//
// These are the server's defaults for every roleplay map. A map asks for citizens, and sets
// its own numbers, in its ts\mapconfigs\<map>.cfg (h9_autoconfig), which wins over this file:
// the plugin reads that file's tsrp_roambots lines itself as well, so they hold on any server.
// The citizens need the patched RCBot (rcbot-patch CHANGE 8) and the map's roam waypoints.


// 1: citizens on every roleplay map. Leave it 0 here and turn it on per map.
tsrp_roambots 0

// How many citizens at most. Fewer whenever real players need the slots.
tsrp_roambots_count 12

// Slots always kept free for real players (at least 1): a citizen leaves when people join.
tsrp_roambots_reserve 2

// 0: citizens carry nothing and pick nothing up. 1: RCBot arms them as usual (they never fire).
tsrp_roambots_weapons 0

// The faces they wear, ";" between model names (ts\models\player\<name>\<name>.mdl), each with
// its gender after a colon: ":f" a woman, ":m" a man; a model without one is neither. A citizen's
// name comes from the list for its face's gender, and a new face after a death keeps the gender.
tsrp_roambots_models "proletarian_healthy:m;proletarian:m;prole_fem:f;prole_bfem:f"

// Their names, ";" between them: women's, men's, and for a face with no gender. Empty: the
// plugin's own lists (40 women's, 40 men's, 16 either). No citizen is given a name another has
// had on this map while the list lasts.
tsrp_roambots_names_f ""
tsrp_roambots_names_m ""
tsrp_roambots_names ""

// The walk, in units a second: 120 is a player holding the walk key. Read by RCBot.
tsrp_roambots_speed 120

// The chance, in percent, that a citizen stops and looks about before each walk. Read by RCBot.
tsrp_roambots_pause 40

// 1: citizens cannot be hurt. 0: they can be killed, and come back elsewhere in the city.
tsrp_roambots_god 0

// 1: a citizen someone hurts fights that one back, with its hands, until he dies or leaves the
// server. 0: it never fights. Read by RCBot.
tsrp_roambots_defend 1

// How long, in seconds, a citizen goes on fighting him without being hurt again before it lets
// him be. Read by RCBot.
tsrp_roambots_defend_time 30

// RCBot lets a player off at his death, when he leaves, and tsrp_roambots_defend_time seconds after
// his last blow (an rcbot_mm.dll built from the source of 2026-11-03 10:04 or later: an older build
// holds him for the citizen's whole life). N here sets tsrp_roambots_defend_time to N; 0: it is
// left as it is.
tsrp_rb_forgive_seconds 0

// What the plugin does when a player's hostility ends in its record (a new life, leaving, a team or
// class change). 0: nothing more. 1: it sends "rcbot roamforget <player>" (an RCBot build that has
// the command; any other prints that it does not exist). 2: each citizen that was hostile to him
// is sent away once no player has it in sight, and another comes in (for an older RCBot build).
tsrp_rb_forget_cmd 0

// The chance, in percent, that two citizens who meet stop, face each other and murmur for a few
// seconds, and how close they are when they do (units). 0: they never stop to talk.
tsrp_roambots_talk 40
tsrp_roambots_talk_range 150

// THE INSURGENCY. An admin types .insurgency in chat: every citizen wears the insurgent version
// of its face, takes the weapons below, and is set on the players, one citizen every quarter of a
// second; .civilians puts them down the same way, leaving nothing on the ground, and they come
// back as citizens. 1 here (or in a mapconfig) starts the map in an insurgency. Read by RCBot.
//
// With Apollo RP's team play running (arp_teamplay 1 in arp.cfg) the citizens are on the Proletarians' team and,
// in an insurgency, on the Insurrection team: .insurgency puts them all on it at once and moves each as it
// takes up arms (TS takes it out of play for 5 seconds and it comes back armed, in another district),
// .civilians moves them back. They set themselves on every player and every bot that is not on the
// Insurrection team (the Middle Sea Republic's guards, when there are any, are bots) and never on one that
// is. Without team play none of this runs.
tsrp_roambots_insurgency 0

// "civilian:insurgent" pairs of faces, ";" between them. A face with no pair keeps its own.
tsrp_roambots_insurgent_models "proletarian_healthy:ins_prole_helm;proletarian:ins_proletarian;prole_fem:ins_prole_fem;prole_bfem:ins_prole_bfem"

// The insurgents' weapons: "TS weapon id:spare magazines", "," between them, as the match mode's
// class lines (13 the AK47, 22 the Glock 20; a grenade's or a knife's figure is how many). The
// first one is the one in their hands, and the one they fight with.
tsrp_roambots_insurgent_weapons "13:3,22:2"

// What a dying insurgent leaves on the ground: 1 the gun in its hands, 0 nothing. TS would throw
// down everything it carried; the rest is taken away.
tsrp_roambots_insurgent_drop 1

// 0: insurgents are set on every player who is not a bot; with team play, on every player and every bot
// that is not on the Insurrection team, and never on one that is. A team number: only on that team's players
// (and, with team play, its bots): 1, the Middle Sea Republic's, sets them on its players and guards and
// never on the Proletarians. Read by RCBot.
tsrp_roambots_insurgent_team 0

// The admin flags a player needs for .insurgency and .civilians (as in users.ini; "h" is
// ADMIN_CFG). Empty: anyone may use them.
tsrp_roambots_admin_flag "h"

// 0: .insurgency and .civilians do nothing on this map (for a mapconfig).
tsrp_roambots_commands 1

// 1: a player who presses +use (E) on a citizen gets a murmur from it, and it turns to face him
// for a moment. 0: citizens ignore +use.
tsrp_roambots_use 1

// Seconds before the same citizen, or the same player, has another of those.
tsrp_roambots_use_cooldown 8

// 1: log every placement, refused pickup and dropped weapon (amx_roambots shows the counts).
tsrp_roambots_debug 0
