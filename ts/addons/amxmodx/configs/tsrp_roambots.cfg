// tsrp_roambots.cfg -- ROAMING CITIZENS on the roleplay maps. Run by the tsrp_roambots plugin
// as each roleplay map loads; no need to exec it. On any other map the plugin does nothing.
//
// NOTE: build.bat copies this file over the one in the game's configs folder on
// every build. Edit it HERE, in D:\Downloads\TSM, or your changes get overwritten.
//
// These are the server's defaults for every roleplay map. A map asks for citizens, and sets
// its own numbers, in its ts\mapconfigs\<map>.cfg (h9_autoconfig), which wins over this file:
// the plugin reads that file's tsrp_roambots lines itself as well, so they hold on any server.
// The citizens need the patched RCBot (rcbot-patch CHANGE 8) and the map's roam waypoints.


// 1: citizens on every roleplay map. Leave it 0 here and turn it on per map.
tsrp_roambots 0

// How many citizens at most. Fewer whenever real players need the slots.
tsrp_roambots_count 12

// Slots always kept free for real players (at least 1): a citizen leaves when people join.
tsrp_roambots_reserve 2

// 0: citizens carry nothing and pick nothing up. 1: RCBot arms them as usual (they never fire).
tsrp_roambots_weapons 0

// The faces they wear, ";" between model names (ts\models\player\<name>\<name>.mdl).
tsrp_roambots_models "proletarian_healthy;proletarian;prole_fem;prole_bfem"

// Their names, ";" between them. Empty: the plugin's own list of 48.
tsrp_roambots_names ""

// The walk, in units a second: 120 is a player holding the walk key. Read by RCBot.
tsrp_roambots_speed 120

// The chance, in percent, that a citizen stops and looks about before each walk. Read by RCBot.
tsrp_roambots_pause 40

// 1: citizens cannot be hurt. 0: they can be killed, and come back elsewhere in the city.
tsrp_roambots_god 0

// 1: log every placement, refused pickup and dropped weapon (amx_roambots shows the counts).
tsrp_roambots_debug 0
