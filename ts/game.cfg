// game.cfg -- executed by TS from InstallGameRules(), at the top of every map load.
//
// WHY THIS FILE EXISTS
//
// TS decides its gamerules ONCE per map load, inside CWorld::Precache:
//
//     exec game.cfg
//     g_teamplay = DecideGamePlay(mapname, mp_teamplay)
//     if (g_teamplay > 0) -> CHalfLifeTeamplay      (teams work)
//     else                -> CHalfLifeMultiplay     (teams are a no-op)
//
// On CHalfLifeMultiplay the team functions are inherited base stubs:
// GetTeamIndex always returns -1, GetIndexedTeamName always returns "", and
// ChangePlayerTeam is a single `ret` -- so "jointeam 1" does nothing at all, silently,
// get_user_team() reads -1 with an empty name, and no TeamInfo/TeamNames messages are
// ever sent so the scoreboard has nothing to draw.
//
// server.cfg is NOT good enough for this: hlds execs it after the first map has
// already spawned, so mp_teamplay arrives after gamerules were chosen. game.cfg is
// read at the only moment that matters.
//
// mp_teamlist and mp_teammodels are here for the same reason -- the CHalfLifeTeamplay
// constructor reads them immediately after this file is executed, and nothing re-reads
// them for the life of the map.

echo [TSM] game.cfg executing -- gamerules are about to be chosen

// Both spellings. The HL SDK registers this cvar as mp_teamplay, but the mod reads a
// C variable named `teamplay` and TS may register it under the bare name. Setting
// both costs nothing and removes the guess.
mp_teamplay 1
teamplay 1
mp_theonemode 0
lastmanstanding 0

mp_teamlist "msr;insurgents;spectator"
// Every model a class can wear MUST be listed here.
//
// TS precaches this list at map load. A model written at runtime that was not
// precached shifts the model index table and crashes clients with "Bad model on
// beam (not sprite)" -- so the class table in ts_matchmode.cfg and this line have
// to be kept in step.
//
// Format: | separates TEAMS, ; separates the models WITHIN one team. So this
// line is msr | insurgents | spectator, and each of those is a ;-separated list.
//
// The class table in ts_matchmode.cfg uses the same convention for its model
// field, except that it lists random choices with , because ; is already taken
// as its field separator.
mp_teammodels "repuheavy;repuheavym;repuheavyw;scda_Spy02;reputengu|XCCPSoldier-wartorn;XCCPmutant;XCCPsgg;XCCPsgts;XCCPRurik|Invisible"
mp_teamoverride 0

// TS own friendly-fire rule, set HERE and not only in server.cfg.
//
// server.cfg is exec by hlds only AFTER the first map has spawned, so on the first
// map of a session this arrived too late and the mod spent that whole map at its
// default. Same trap as mp_teamplay.
//
// The plugin blocks friendly damage itself through Ham_TakeDamage, so this is the
// mod agreeing rather than the mechanism being relied on -- but rcbot asks the MOD
// about teams, not this plugin, so what TS believes is what its bots act on.
mp_friendlyfire 0

// No automatic map change. Set here as well as in server.cfg because hlds execs
// server.cfg only AFTER the first map has spawned -- so on the very first map the
// timer would already be running at 30 minutes before server.cfg zeroed it.
mp_timelimit 0
mp_fraglimit 0

// TS's OWN cvars for these, found in the game DLL's cvar table alongside
// weaponstay / bottalk / ammocount / realbullet / botlearn.
//
// These do the job inside the mod, which is the only place that reliably covers
// BOTS. The plugin's versions are client-command hooks, and a fake client sends no
// client commands -- which is exactly why bots could still take powerups and buy
// weapons while players could not.

// No powerups at all.
nopowerup 1

// No forced respawn. TS respawns a dead player either when they press fire or
// on this timer, and in GoldSrc the corpse IS the player entity -- so a respawn
// does not leave a body behind, it carries it off to the spawn point. That is
// what made bodies vanish on death.
//
// ts_matchmode blocks the fire-button half per frame, for tsm_death_linger. This
// closes the other half, which no per-frame button clear can reach.
mp_forcerespawn 0

// No economy. The buy menu is slot-limited rather than cash-limited, so usecash 0
// does not close it -- it makes CashBased() false, nothing is ever charged, and the
// menu hands weapons out for FREE. The economy stays ON and the wallet is kept
// empty instead, which makes TS refuse each purchase itself.
usecash 1

// The three places TS hands out cash on its own: at spawn, and at the end of a
// round for the winning and the losing side.
initial_cash 0
cashforwin 0
cashforlose 0

// What has no cvar: a map can give cash directly through the victorycash and
// defeatcash keyvalues on a ts_wingiver entity, which are baked into the .bsp.
// That is why ts_matchmode holds every player's wallet at zero per frame as well,
// and why these four lines narrow the window rather than close it.

