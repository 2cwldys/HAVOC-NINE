# SSH for the havoc9.org VPS (vps/linux/setup.sh puts it in /etc/ssh/sshd_config.d/, only once an
# SSH key can sign in, so nobody is locked out). The 05- name puts it before a cloud image's own
# 50-cloud-init.conf: sshd keeps the first value it reads.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4
LoginGraceTime 30
