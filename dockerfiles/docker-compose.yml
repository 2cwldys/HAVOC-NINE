# HAVOC 9 dedicated server, built from this clone.
#
#   cd dockerfiles
#   cp server.env.example server.env        # edit it, or leave it alone
#   docker compose up -d --build            # the first build takes a while: 1.89 GiB of game
#   docker compose logs -f
#
# Run it from this folder; the build context is the repository root above, which is how the image
# takes the game from the clone. docs/DOCKER.txt is the long version.
services:
  h9xash:
    build:
      # the repository root, so the Dockerfile can copy H9XASH/ and linux/ out of the clone
      context: ..
      dockerfile: dockerfiles/Dockerfile
      args:
        # The build this image carries. dockerfiles/VERSION holds it and release-prepare.mjs keeps
        # it in step with every other place the number appears.
        H9_BUILD: ${H9_BUILD:-dev}

        # Where the 32-bit binaries come from. They are build output and are NOT in git:
        #   download  fetch the published H9XASH-linux-server.zip (44 MiB) -- the default
        #   local     use H9XASH-linux/ in this clone, if you built it yourself
        H9_BINARIES: ${H9_BINARIES:-download}

        # Where the game content comes from:
        #   clone     this clone's H9XASH/ -- the default, and no Git LFS bandwidth is spent
        #             at build time because the files are already on disk
        #   release   the published package, so no clone and no LFS at all (CI, or a machine
        #             that should not hold a 2 GB checkout)
        H9_CONTENT: ${H9_CONTENT:-clone}

        # Only matters when you mount a volume over the server: these must own it on the host.
        # On Linux: id -u and id -g
        PUID: ${PUID:-10099}
        PGID: ${PGID:-10099}

        # 1 also installs Node.js for the P2P helper (docs/P2P_JOIN.txt), used only when p2p.ini
        # beside the server says enabled=1. Costs about 60 MB.
        WITH_P2P: ${WITH_P2P:-0}

    image: h9xash-server:${H9_BUILD:-dev}
    container_name: h9xash

    # Without this the engine is PID 1, and PID 1 ignores the default signals: `docker stop` would
    # wait the full timeout and then kill it, losing whatever it had not written.
    init: true

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - server.env

    volumes:
      # What the server must keep across a new image: the AMX Mod X vault and its sqlite3 data,
      # which hold accounts, stats and everything a plugin remembers. Without this they live and
      # die with the container, which is fine for a scrim server and wrong for a ranked one.
      - h9-data:/opt/h9xash/ts/addons/amxmodx/data

      # Server configuration you want to edit from the host rather than rebuild for.
      # - ./server.cfg:/opt/h9xash/ts/server.cfg:ro

      # To run a server kept entirely outside the image, mount the whole folder instead. It then
      # replaces the image's copy and must hold a complete server, binaries included.
      # - ${H9_SERVER_PATH:-./server}:/opt/h9xash

    # GoldSrc is UDP, rcon included. Without /udp this publishes a TCP port, the container comes up
    # looking healthy, and nothing can reach the server. It is the most common mistake there is
    # with a game server in Docker.
    ports:
      - "${H9_PORT:-27015}:${H9_PORT:-27015}/udp"

    healthcheck:
      start_period: 120s

volumes:
  h9-data:
