; packaging.mod-inplace.ini -- a rebuilt plugin or module into the build that is already published,
; without raising the build number. The mod twin of packaging.engine-inplace.ini.
;
; For a plugin or module fix found after a release went out and before anyone has it: the plugins are
; recompiled AT THE CURRENT BUILD, exported, re-staged and delivered, and the join gate's release is
; LEFT WHERE IT IS.
;
; KNOW WHAT IT COSTS. Two installs can now call themselves the same build. Anyone who already has the
; release keeps the old plugin and the gate still lets them in, and no check anywhere will ever tell
; you which of the two a given server is running. That is only acceptable while the answer to "has
; anyone downloaded it yet" is no. Any other time, raise the number with packaging.ini.
;
; HOW THE NUMBER IS ACTUALLY HELD, because three things try to raise it:
;   1. bump = never makes ship.ps1 call release-prepare --release instead of --auto. --release
;      rebuilds and exports with "to = before" (release-prepare.mjs:190) and can never raise the
;      build. --auto would: a changed plugin hash is its entire trigger.
;   2. --release does not write dist\.release-state.json, and the stage runs a release-prepare --auto
;      of its own (stage-h9xash.ps1:672) that deploy-vps.ps1 cannot be told to skip. With the
;      pre-patch hashes still recorded there, that run would raise the build after all. ship.ps1
;      therefore runs release-prepare --record straight after --release. Without that record, this
;      file does NOT work -- it just bumps one step later.
;   3. ship.ps1 passes its -Ini through to deploy-vps.ps1. It did not always: a custom ini's
;      [package] and [deploy] sections used to be discarded and packaging.ini used instead.
;
; preset = 1 IS NOT OPTIONAL HERE. A rebuilt .amxx gets a new SHA-256 even with no source change
; (amxxpc is not deterministic -- docs\SHIP_A_VERSION.txt), and the host learns hashes only from the
; delivered bundle. Deliver the plugin without its hash and every server that takes it flips from
; "ok" to "not the official file": a red broken chain in the server browser and matches answered
; not_rated. The import is add-only, so the published build's hashes stay official and a server still
; running the old plugin keeps its green chain.
;
; BUILD ONLY WHAT CHANGED, for the same reason: a rebuild of everything re-hashes everything, and the
; preset list then names files no server is running yet.
;
; reTS IS NOT A SHIP STEP. ship.ps1 only COMPARES the reTS trees (ship.ps1:137); it never builds them.
; A client.dll or mp.dll change must be built by hand first with reTS\scripts\build-win32-dropin.ps1,
; its .dll.patch note restored and edited, and the result copied into both H9XASH copies. Then run
; this. Everything already sitting in H9XASH is picked up by the stage, so content changes ride along
; the same way.
;
; THE BROWSER CLIENT IS LEFT STALE ON PURPOSE. A server-side plugin cannot affect it, so for the
; ordinary case that is simply correct. If the change is CONTENT the browser must also show (a sprite,
; a sound, a map), this file is not enough and the three switches below do not fix it on their own:
; set [package] make = 1 and [package] webclient = 1 and [deploy] webclient = 1, and re-lay
; webclient-build\stage from H9XASH by hand first (what export.bat's :webclient step does). Nothing in
; webclient-sync's fingerprint covers game content and verify-release.ps1 never looks at the web
; client, so a half-done job here ships a browser client whose art is the previous build's and no
; check catches it. Leaving [ship] webclient = 0 is deliberate: with the engine or the patch chain
; ahead of webclient-bin\INPUTS.json, auto means a four-minute emscripten build under the heavy lock.
;
; Use: .\ship.ps1 -Ini .\packaging.mod-inplace.ini
;      or the delivery alone: .\deploy-vps.ps1 -Ini .\packaging.mod-inplace.ini (add -WhatIf first)

[stage]
; stage-h9xash.ps1: the client packages and the updater's files, from the rebuilt H9XASH
run = 1
linux = 1
; lists only, as in packaging.ini: the host builds the ZIPs from the delta
zips = 0
hd = 0

[package]
; the site and h9web are unchanged, so the host package is neither rebuilt nor sent.
; make = 0 also makes [package] webclient unreachable: both ride the same make-vps-package.ps1 call
make = 0
webclient = 0

[ship]
; no engine change; if the engine changed too, use packaging.engine-inplace.ini and let it build
engine = 0
; the plugin step must run: 0 would skip the rebuild this file exists for
plugins = 1
; the lever -- see "HOW THE NUMBER IS ACTUALLY HELD" above
bump = never
; auto: a plugin build means the Linux packages carry the new plugin too
linux = auto
export = auto
; stale on purpose; read the browser-client paragraph above before changing this
webclient = 0
deploy = 1
server = 1

[deploy]
host = havoc9-vps
streams = 6
tries = 3
scratch = D:\temp\h9deploy
; MUST be 0 while [package] make = 0: with site = 1 the deploy sends the newest host package already
; in dist\ unconditionally, which re-installs an old one for nothing and can roll the site back
site = 0
; MUST be 0 while [package] make = 0: with no package built, the web client is sent from the previous
; run's list -- current file contents at stale paths, and with delta = 0 it sends an old ZIP outright
webclient = 0
; not optional -- see above. Cheap when nothing changed: an identical bundle is not sent
preset = 1
; delta: only files the host has never seen go over, which for a plugin fix is the plugin
delta = 1
client = 1
updater = 1
updater_files = 1
hd = 0
linux_server = 1
