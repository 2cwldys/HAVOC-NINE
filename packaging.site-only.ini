; packaging.site-only.ini -- deliver the site and h9web alone, and nothing else.
;
; For a change to havoc9.org or to h9web's code that does not touch the game: the host package is
; rebuilt (it carries h9web\lib, h9web\bin, h9web\modules and the whole havoc9.org tree) and sent,
; and no client, updater, preset, delta or HD work is done.
;
; The stage is off, so release-prepare does not run and the build number is left alone: a site fix
; is not a new release and players are not asked to update for it. bump = never says the same
; thing again, so neither switch alone can raise it.
;
; Use: .\deploy-vps.ps1 -Ini .\packaging.site-only.ini
;      add -WhatIf first to see what it would send.

[stage]
; no staging: no release-prepare, no version bump, no H9XASH packaging
run = 0
linux = 0
zips = 0
hd = 0

[package]
; the host package: this is what carries the site and h9web
make = 1
webclient = 0

[ship]
engine = 0
plugins = 0
; never: a site change is not a new join gate
bump = never
linux = 0
export = 0
webclient = 0
deploy = 1
server = 0

[deploy]
host = havoc9-vps
streams = 6
tries = 3
scratch = D:\temp\h9deploy
; the host package, and only it
site = 1
webclient = 0
preset = 0
; off: no file streams are delivered, so the delta path is not entered
delta = 0
client = 0
updater = 0
updater_files = 0
hd = 0
linux_server = 0
