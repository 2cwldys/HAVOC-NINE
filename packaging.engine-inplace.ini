; packaging.engine-inplace.ini -- a rebuilt engine into the build that is already published,
; without raising the build number.
;
; For an engine fix found after a release went out and before anyone has it: the engine is
; rebuilt, the client packages and the updater's files are delivered again, and the join gate's
; release is LEFT WHERE IT IS. bump = never says so, and it is the whole point of this file:
; packaging.ini uses bump = engine, which treats a new engine as a new gate and asks every
; player to update.
;
; Know what that costs before using it: two installs can now call themselves the same build.
; Anyone who already downloaded the release keeps the old engine and the gate still lets them
; in. That is only acceptable while the answer to "has anyone downloaded it yet" is no. Any
; other time, raise the number with packaging.ini.
;
; The site and the host package are not touched (nothing in them changed) and the browser build is
; left stale on purpose: it is rebuilt with the next ordinary release.
;
; The build number is held here by plugins = 0 alone: ship.ps1 returns before it chooses a
; release-prepare flag (ship.ps1:230), and the stage's own release-prepare --auto compares PLUGIN and
; MODULE hashes, which a rebuilt engine does not change, so it reports "kept". A run that also has a
; rebuilt plugin in it is a different job: use packaging.mod-inplace.ini, which holds the number the
; harder way and explains how.
;
; Use: .\ship.ps1 -Ini .\packaging.engine-inplace.ini
;      or the delivery alone: .\deploy-vps.ps1 -Ini .\packaging.engine-inplace.ini (add -WhatIf first)
; Both honour this file. ship.ps1 only started passing its -Ini down to deploy-vps.ps1 with the change
; that added these two files; before that a custom ini's [package] and [deploy] sections were
; discarded and packaging.ini was used for the delivery.

[stage]
; stage-h9xash.ps1: the client packages and the updater's files, from the rebuilt H9XASH
run = 1
linux = 1
; lists only, as in packaging.ini: the host builds the ZIPs from the delta
zips = 0
hd = 0

[package]
; the site and h9web are unchanged, so the host package is neither rebuilt nor sent.
; make = 0 also makes [package] webclient unreachable: both ride the same make-vps-package.ps1 call
make = 0
webclient = 0

[ship]
; the reason this file exists
engine = 1
; no plugin or module changed, so release-prepare has no build to make
plugins = 0
; never: the engine fix goes into the build that is already out there
bump = never
linux = auto
export = auto
; the browser build is stale on purpose; it moves with the next ordinary release
webclient = 0
deploy = 1
server = 1

[deploy]
host = havoc9-vps
streams = 6
tries = 3
scratch = D:\temp\h9deploy
; MUST be 0 while [package] make = 0: with site = 1 the deploy sends the newest host package already
; in dist\ unconditionally, which re-installs an old one for nothing and can roll the site back
site = 0
; MUST be 0 while [package] make = 0: with no package built, the web client is sent from the previous
; run's list -- current file contents at stale paths, and with delta = 0 it sends an old ZIP outright
webclient = 0
; no plugin changed, so this builds a bundle identical to the one the host imported and sends nothing.
; Left at 1 rather than 0 so that a run which turns out to carry a rebuilt plugin after all cannot
; leave its servers reading "not the official file"
preset = 1
; delta: only the files the host has never seen go over, which for an engine fix is the engine
delta = 1
client = 1
updater = 1
updater_files = 1
hd = 0
linux_server = 1
