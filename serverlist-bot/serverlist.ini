; serverlist.ini -- the H9 server list's settings (h9_serverlist.py).
;
; Nothing secret in here. The heartbeat key and the Discord token live in serverlist.cfg.

[http]
; The address and port the list is served on. A list on a machine behind a router needs the
; router to forward this port to it.
host = 0.0.0.0
port = 8080

[list]
; The game folder the list is for. Xash servers report it as "ts".
gamedir = ts
; How often each listed server is queried again, in seconds.
poll_seconds = 30
; A server that has not answered for this many seconds is taken off the list.
expire_seconds = 300
; How long one query waits for an answer, in seconds.
probe_timeout = 2

[discord]
; A Discord server id. Commands register there at once. Empty means global commands, which
; can take up to an hour to appear.
guild_id =
; The role that may use /addserver and /removeserver. Empty means members with Manage Server.
role_id =
