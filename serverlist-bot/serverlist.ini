; serverlist.ini -- the H9 server list's settings (h9_serverlist.py).
;
; Nothing secret in here. The heartbeat key and the Discord token live in serverlist.cfg.

[http]
; The address and port the list is served on. On the VPS nginx is in front of it and passes
; https://havoc9.org/serverlist/ on to this port, so it listens on this machine only. For a
; list players reach directly instead (a LAN test, a home connection with this port
; forwarded): host = 0.0.0.0.
host = 127.0.0.1
port = 8081
; The address players are given for the list (networking.ini's list_bot). When it is set,
; the Discord bot fetches the list there once a minute and turns red with "server list
; unreachable" while that fails. Empty means no such check: leave it empty for a test list on
; this PC, and on a home connection unless the router can reach its own public address from
; inside (NAT loopback).
public_url = https://havoc9.org/serverlist
; 1: a game server may announce itself with a heartbeat that has no key (h9_heartbeat.ps1 beside
; h9xash_server.bat sends one every two minutes). The list then takes only the address the
; heartbeat comes from, and lists it only while it answers a query from this game folder. A
; heartbeat with the key in serverlist.cfg may name any address. 0: the key is needed.
open_heartbeats = 1

[list]
; The game folder the list is for. Xash servers report it as "ts".
gamedir = ts
; How often each listed server is queried again, in seconds.
poll_seconds = 30
; A server that has not answered for this many seconds is taken off the list.
expire_seconds = 300
; How long one query waits for an answer, in seconds.
probe_timeout = 2

[discord]
; A Discord server id. Commands register there at once. Empty means global commands, which
; can take up to an hour to appear.
guild_id =
; The role that may use /addserver and /removeserver. Empty means members with Manage Server.
role_id =
