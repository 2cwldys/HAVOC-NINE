; serverlist.ini -- the H9 server list's settings (h9_serverlist.py).
;
; Nothing secret in here. The heartbeat key and the Discord token live in serverlist.cfg.

[http]
; The address and port the list is served on. On the VPS nginx is in front of it and passes
; https://havoc9.org/serverlist/ on to this port, so it listens on this machine only. For a
; list players reach directly instead (a LAN test, a home connection with this port
; forwarded): host = 0.0.0.0.
host = 127.0.0.1
port = 8081
; The address players are given for the list (networking.ini's list_bot). When it is set,
; the Discord bot fetches the list there once a minute and turns red with "server list
; unreachable" while that fails. Empty means no such check: leave it empty for a test list on
; this PC, and on a home connection unless the router can reach its own public address from
; inside (NAT loopback).
public_url = https://havoc9.org/serverlist
; 1: a game server may announce itself with a heartbeat that has no key (h9_heartbeat.ps1 beside
; h9xash_server.bat sends one every 15 seconds). The list then takes only the address the
; heartbeat comes from, and lists it only while it answers a query from this game folder. A
; heartbeat with the key in serverlist.cfg may name any address. 0: the key is needed.
open_heartbeats = 1
; How many heartbeats a minute one address may send without the key (429 past it). A server sends
; one every 15 seconds, and a few a minute while it loads a map. A heartbeat with the key is not held to it.
heartbeats_per_minute = 60

[list]
; The game folder the list is for. Xash servers report it as "ts".
gamedir = ts
; How often each listed server is queried again, in seconds. A server that does not answer is off the list at that moment
; (and a server that says it is closing, at once); a seed or keyed one is still queried and is back when it answers.
poll_seconds = 5
; A server that has not answered for this many seconds is forgotten altogether (it is not on the list from its first missed
; query); a heartbeat or /addserver brings it back.
expire_seconds = 120
; How long one query waits for an answer, in seconds.
probe_timeout = 2
; What heartbeats without the key may put on the list, so that one machine cannot fill it with
; servers it makes up: from one address, and in all (a server already on the list is always
; refreshed). A heartbeat with the key, servers.txt and /addserver are not held to these.
max_per_address = 8
max_open_servers = 100

[discord]
; A Discord server id. Commands register there at once. Empty means global commands, which
; can take up to an hour to appear.
guild_id =
; The role that may use /addserver and /removeserver. Empty means members with Manage Server.
role_id =
; A file holding the H9XASH build the site hands out (on havoc9.org's Windows host
; C:\havoc9\site\downloads\.build, written by each delivery of deploy-vps.ps1). The bot's About
; Me names it (never its status line) and follows the file by itself, so a version increase
; reaches the bio with the deploy (README.md, "The build in the bio"). Empty: the bio is left alone.
build_file =
; A channel id to announce a new build in, as one embed, when build_file changes. It follows the
; same file the bio does, so the post goes out when the site is actually handing the build out --
; not when a deploy started, and not when one uploaded and was then refused by the host, which is
; how 1.68 passed unnoticed. Empty: no announcement, and the bio still follows the build.
;
; The build it last announced is kept in announced_build beside this file, so restarting the
; service does not post the same release again. The first run with no such file records what is
; being served and says nothing: announcing a release that happened before this existed would be
; wrong. Delete that file to have the current build announced once.
release_channel =
; An image for the foot of that embed, by URL. A Discord embed carries exactly one colour, which
; is H9 orange, so this is the only place the purple can go. Unreachable or empty: Discord leaves
; the image out and the embed still reads correctly.
release_image =
