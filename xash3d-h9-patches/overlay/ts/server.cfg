echo Executing server.cfg

// The server's name is not set here: this file runs on every map load and would overwrite the launch line's +hostname. An unnamed
// server is named by the ts_matchmode plugin (HAVOC 9 TEAM ELIMINATION); any name set elsewhere stays.
sv_aim 0
pausable 0
respawntime 5
// 0 = no time limit, so the map never changes on its own.
// Match mode runs its own best-of and its own round clock (tsm_roundtime); a map
// change part-way through a match would throw the score away.
mp_timelimit 0
mp_fraglimit 0
slowmatch 1
roundtime 180
weaponstay 30
ammocount 0
weaponrestriction 1
realbullet 0
mp_friendlyfire 0
spectacularness 50
lastmanstanding 0
mp_theonemode 0
mp_teamlist "Middle Sea Republic;Insurrectionists;Spectator"
mp_teammodels "repuheavy|XCCPmutant|Invisible"
mp_teamplay 1
sv_cheats 0
sv_voicecodec voice_speex
sv_voicequality 5
sv_maxspeed 330
sv_lan 0

// A browser player's first join fetches the map's game files (300 MB on h9_te_neuropolis) before it can spawn. The engine
// drops a client that has not spawned sv_connect_timeout seconds after it connected (60), whatever it still sends, and bans
// its address for 2 minutes: for a browser player that is the relay's address, every browser player of the server at once.
sv_connect_timeout 600
sv_connect_timeout_ban 0

// TS's OWN cvars for these, found in the game DLL's cvar table alongside
// weaponstay / bottalk / ammocount / realbullet / botlearn.
//
// These do the job inside the mod, which is the only place that reliably covers
// BOTS. The plugin's versions are client-command hooks, and a fake client sends no
// client commands -- which is exactly why bots could still take powerups and buy
// weapons while players could not.

// No powerups at all.
nopowerup 1

