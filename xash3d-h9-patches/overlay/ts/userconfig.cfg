// H9XASH: run at startup by the last line of config.cfg.
//
// Main-menu music. h9xash.bat writes menu_music_resolved.cfg on every launch with a
// random track from menu_music.txt. Xash has no "mp3 on" command; "mp3 loop" alone
// starts the track.
wait 4
MP3Volume 0.2
exec menu_music_resolved.cfg

// The TS HUD in H9 purple, the values the Steam install's config.cfg carries (stock
// 125 150 165). Set here because Xash starts from the stock config.cfg.
hud_r "190"
hud_g "160"
hud_b "255"

// The console text in the same purple as the main menu (BaseText in trackerscheme.res).
con_color "223 213 245"
