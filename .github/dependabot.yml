version: 2
updates:
  # SMAK is a submodule of deoroot/SMAK: a pull request moves its pointer to the newest commit of the branch main, daily
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /h9web
    schedule:
      interval: weekly
