name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  h9web-tests:
    name: h9web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: node --test (h9web has no dependencies)
        working-directory: h9web
        run: node --test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the project's own rules (tools/secret-scan.mjs)
        run: node tools/secret-scan.mjs
      - name: gitleaks (default rules plus .gitleaks.toml)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  public-docs:
    name: public documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: no machine paths, real addresses or secrets in the AI-context files
        run: node tools/lint-public-docs.mjs

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          submodules: false  # only SMAK is needed, and it is init'd explicitly below.
                             # Do NOT pull the xash3d-fwgs engine submodule (or its nested
                             # submodules) here -- it is large and irrelevant to this audit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: SMAK, the newest commit of deoroot/SMAK (the submodule's pointer is moved to it by Dependabot)
        run: git submodule update --init --remote SMAK
      - name: SMAK (the only package with dependencies)
        working-directory: SMAK
        run: |
          if [ -f package-lock.json ]; then npm audit --omit=dev --audit-level=high; else echo "no lockfile: nothing to audit"; fi
