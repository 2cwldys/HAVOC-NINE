; What each job of this map is paid (ARP_PayScale; docs\APOLLO_RP.txt, section 8).
; One job to a line:  "<job name>" <salary>
; The name is the one arp_joblist lists, in quotes when it holds a space. The salary is a whole
; number from 0 to 100000000: what the job is paid at each payday, into the bank (every 60
; seconds at arp_performance 100, so 10 is 10 a minute). A line that starts with ; is a
; comment, and so is a blank line. A job with no line is paid what its row in this map's jobs
; table says.
; A line wins over the row, whatever the database holds, so a change here is a change of pay
; with no UPDATE: edit a number and change the map (this file is read when the map loads).
; Every salary, a line's too, is then paid at arp_h9_pay_percent per cent (configs\arp\arp.cfg;
; 100 pays it as it is). A name that is no job of this map is said once in the log and does
; nothing. Lines are read 127 characters at a time, so keep a line shorter. Write the file in
; plain ASCII (a byte-order mark at its start would make its first line a refused one).
; arp_h9_pay_dump (the server's console, or an ARP admin's) lists every job's row, line and pay.

; Unemployed pays nothing, so that a character takes a job to be paid.
"Unemployed" 0

