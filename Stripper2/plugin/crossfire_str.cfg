//
// crossfire_str.cfg
//
// The [strip] section should be first.  Provide the name of the entity that
// you want to remove from this map.  The entity name can be followed by a
// location (map X, Y, and Z coordinate) and by a random strip percentage.
//
// If you specify a random percent, that item will be removed, on the
// average, the percent of time you specify.  This means that if you set
// a percent to 40%, then 40% of the time an item will be removed from the
// map.  This DOES NOT mean that 40% of the time when you load this map,
// there won't be any of those items.  This means that if there are normally
// 10 items spawning in a map, you would only get about 6 of them each time
// the map is loaded.  There currently is no way to configure an item so
// that all of them appear sometimes and none of them appear other times.
//
// For example the following are all valid entries...
//
// weapon_crossbow
// item_healthkit 100%
// weapon_rpg 50%
// ammo_shotgun (-140 920 -1450)
// weapon_handgrenade (40 -720 1554) 80
//
// The '%' character at the end of the random stripping percentage is not
// required and can be left off (as shown in the last example).

// The above entries will...
// ALWAYS cause the crossbows to be removed (no percent is the same as 100%)
// ALWAYS cause healthkits to be removed
// Remove 50% of the RPGs in the map.
// ALWAYS remove the shotgun located at (-140 920 -1450)
// Remove the hand grenade located at (40 -720 1554) 80 percent of the time.


[strip]
weapon_rpg  // remove all the RPGs

[add]
{
   classname/weapon_rpg  // add a new RPG in the pit area
   angle/45
   delay/0
   origin/-265 470 -1790
}


// The "evil" teleporter will teleport a player into a "player_weaponstrip"
// entity that will remove ALL weapons from that player.

// Add a sprite for the "evil" teleporter...
{
   classname/env_sprite
   PRECACHE_SPRITE(sprites/enter1.spr)
   frame/1
   framerate/10
   rendermode/5
   renderamt/255
   scale/0.80
   spawnflags/1  // SF_SPRITE_STARTON
   model/sprites/enter1.spr
   origin/-480 940 -1660
}

// Add an ambient wind sound slightly above the "evil" teleporter
{
   classname/ambient_generic
   PRECACHE_SOUND(ambience/wind1.wav)
   spawnflags/2  // 2=small, 4=medium, 8=large
   message/ambience/wind1.wav
   health/3  // volume (1-10)
   origin/-480 940 -1600
}

// Add the "evil" teleporter that strips weapons from the player...
{
   classname/trigger_teleport
   target/teleport_1
   origin/-480 940 -1660
   bbox_min/-20 -20 -20
   bbox_max/20 20 20
}

// Add a trigger so that the player touches it when falling through
// the air after being teleported.  It triggers "strip_1"...
{
   classname/trigger_multiple
   target/strip_1
   origin/100 240 -1560
   bbox_min/-20 -20 -2
   bbox_max/20 20 2
}

// Add a player weaponstrip entity to remove all weapons from the player...
{
   classname/player_weaponstrip
   targetname/strip_1
   origin/100 240 -1570
}

// Add the teleporter destination (near the stairway leading to the other
// side of the map)...
{
   classname/info_teleport_destination
   targetname/teleport_1
   angle/0
   origin/100 240 -1500
}

// Add a new player spawn point in the room with the "secret" door...
// (one of these 3 will be randomly chosen when the map loads)
{
   {
      classname/info_player_deathmatch
      angle/90
      origin/500 1300 -1780
   }
   {
      classname/info_player_deathmatch
      angle/90
      origin/480 1270 -1780
   }
   {
      classname/info_player_deathmatch
      angle/90
      origin/520 1240 -1790
   }
}

// Duplicate one of the "button" brush models near the "secret" door...
{
   classname/func_wall
   model/*24
   origin/250 1366 -152
}

// Duplicate another "button" brush model on the other side of the wall
// near the "secret" door...
{
   classname/func_wall
   model/*31
   origin/1044 86 -152
}

// Add a func_button entity to open the "secret" door leading to the blue
// room (located in the small room with the HEV wall charger)...
{
   classname/func_button
   origin/640 1430 -1800
   angles/0 180 0
   mins/639 1438 -1798
   maxs/641 1442 -1802
   health/0
   target/secret_door
   spawnflags/1
}

// Add a monstermaker that spawns snarks in the middle of the heliport area...
{
   classname/monstermaker
   origin/0 -900 -1200
   angle/-2
   monstercount/-1        // no limit on number of snarks
   m_imaxlivechildren/-1  // no limit on number of snarks
   monstertype/monster_snark
   delay/1  // 1 second apart (but won't spawn while something is below it)
}

// Add another monstermaker spawning snarks directly above the pit area...
{
   classname/monstermaker
   origin/-150 650 -1500
   angle/0
   monstercount/-1        // no limit on number of snarks
   m_imaxlivechildren/-1  // no limit on number of snarks
   monstertype/monster_snark
   delay/3  // 3 seconds apart
}

