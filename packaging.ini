; packaging.ini -- what a release builds and delivers (deploy-vps.ps1 reads it).
;
; Nothing secret in here, ever: the host is named by an SSH shortcut ("Host havoc9-vps" in your own
; %USERPROFILE%\.ssh\config, which holds the address, the user and the key file). 1 = yes, 0 = no.

[stage]
; Run stage-h9xash.ps1 first: dist\H9XASH.zip, H9XASH-linux.zip, H9XASH-linux-server.zip and the
; updater's files in dist\files. 0 delivers what dist\ holds already.
run = 1
; Also the Linux packages (H9XASH-linux.zip, H9XASH-linux-server.zip). 0: Windows only.
linux = 1
; 0 (the default): with a delta delivery ([deploy] delta = 1) the stage writes LISTS of what each package would hold (dist\*.zip.list.json, and
; dist\webclient.list.json for the web client) and the host builds the ZIPs, so nothing of a gigabyte is compressed or read back on this PC.
; 1: the ZIPs are written too (to keep a copy in dist\, or for a delivery with delta = 0, which sends them whole).
zips = 0
; The AI-upscaled HD textures (docs\HD_TEXTURES.txt): publish them into dist\files\hd as their
; own store, with their own manifest.json and their own blobs. Nothing is shared with the
; client's files beside it, which is what lets the pack be served from somewhere else and makes
; removing it one deletion. They are an optional download, never part of the client, and
; publishing 10.5 GB has no place in an ordinary release, so this is off unless a release means
; to move them. The textures themselves live in H9XASH\ts\materials, which no package holds.
hd = 0

[package]
; Make the host package (make-vps-package.ps1 -Target windows): the site, h9web and the server list. The host installs it; it is never put in the downloads.
make = 1
; Also pack the web client's files from webclient-build\stage (export.bat makes them).
webclient = 1

[ship]
; ship.ps1: one command for a whole release (docs\SHIP_A_VERSION.txt): builds what changed, stages, deploys, verifies. For each step 1 = yes, 0 = no, auto = when its
; inputs changed since the last run.
engine = auto
plugins = auto
; the build number (it is also the join gate's release): auto = release-prepare raises it when a plugin or module changed; engine = also when the engine was rebuilt
; (a new engine is a new gate: players on the old one are asked to update); always = every run; never = leave it
bump = engine
linux = auto
export = auto
webclient = auto
deploy = 1
; update-game.ps1 on the host: a check after the deploy (the update itself is asked for with ship.ps1 -UpdateServer, with the server stopped)
server = 1

[deploy]
; The SSH shortcut of havoc9.org's host.
host = havoc9-vps
; How many uploads run at once: one SSH stream to the host carries only a few MB/s, the connection more.
streams = 6
; How many goes at any one file before the delivery is given up. scp cannot resume, so a
; dropped stream re-sends that archive (at most 400 MB) rather than the whole delivery.
tries = 3
; Where the deploy keeps its own scratch files (the updater's archive can be 2 GB). Empty: dist\.deploy.
scratch = D:\temp\h9deploy
; What goes over. Each file is sent only when the host does not have that very file already.
; The host package: installed with its setup.ps1 (a backup first; settings, keys and data kept).
site = 1
; The web client (PLAY on the site).
webclient = 1
; The official plugin list (tools\preset_bundle.py): the build's list of plugins, modules and Metamod plugins for every game mode, Windows
; and Linux, goes with the release and the host imports it, so a rebuilt plugin never leaves its servers "not authenticated". 0: not sent.
preset = 1
; Delta delivery (vps\windows\delta.py): the client ZIPs and the web client go as a list of their files plus only the files the
; host has not seen yet, and the host builds the ZIPs itself: the same files in the same list, built from the compressed form it keeps of every file
; it has zipped (store\z), so only files that are new to it are compressed. A release then sends what changed (a few hundred MB at most) instead of
; about 3 GB, and with [stage] zips = 0 builds no ZIP on this PC either. 0 sends every ZIP whole.
delta = 1
; The DOWNLOADS page's Windows and Linux buttons: H9XASH.zip, H9XASH-linux.zip.
client = 1
; The DOWNLOADS page's updater button: H9XASH-Updater.exe (from dist\).
updater = 1
; H9XASH-Updater's files (dist\files, served at /files/): only the files the host lacks are sent.
updater_files = 1
; The HD textures, from dist\files\hd into the host's site\files\hd, sent the way the updater's
; own files are: the host says which blobs it holds and only the rest go over, in archives of
; at most 400 MB. The first delivery is about 10.5 GB and is better carried there by hand; after
; that a pass that re-upscales fifty textures sends fifty files. 0 leaves the host's copy alone,
; whatever it holds -- nothing here ever deletes a pack that is already up.
hd = 0
; The native Linux dedicated server, H9XASH-linux-server.zip, in the downloads' file index.
linux_server = 1
; The host package (havoc9-vps-windows-*.zip) is NEVER in the downloads' file index: it is the site's own installer and code, not a download, and the index
; is public. Nothing here switches that on; the host's receive-deploy.ps1 and setup.ps1 take any havoc9-vps-* file out of the index.
