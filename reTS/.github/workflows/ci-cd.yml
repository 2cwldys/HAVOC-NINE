name: CI/CD

on:
  # Branch pushes only: a vX.Y.Z tag runs release.yml, which calls this workflow.
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - '.serena/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - '.serena/**'
      - 'LICENSE'
  # Run by hand (Actions -> CI/CD -> Run workflow) to also build and package the Debug profile.
  workflow_dispatch:
    inputs:
      debug:
        description: "Also build the Debug profile (i386 + Win32) and package reTS-<commit>-debug"
        type: boolean
        default: false
  # release.yml builds a tagged commit through this workflow.
  workflow_call:
    inputs:
      debug:
        type: boolean
        default: false

# The version every build stamps (cmake/Version.cmake): the pushed tag on a tag build, else empty and
# CMake uses git describe or the commit.
# A newer push to the same branch cancels the run still building the older one. Tag builds (release.yml)
# never cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  RETS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

# Every arch builds through the SAME CMake authority now — the legacy i386 Makefile
# and the MSVC .vcxproj/.sln are gone. CMake carries the i386 toolchain (classic
# -m32 -mfpmath=387 flags), the aarch64 cross toolchain, the MSVC config, and the
# Emscripten side-module setup. 64-bit targets static-link openvgui (+ the vgui_support
# shim, both git submodules) so the client exports InitVGUISupportAPI and carries no
# vgui/SDL2 dependency; 32-bit (i386/win32) keeps dynamic Valve vgui. Input on every
# target is fed by the engine's push callbacks (no SDL2 anywhere).

jobs:
  # Linux i386 — CMake + the in-tree i386 toolchain. 32-bit keeps dynamic Valve vgui.
  linux-i386:
    name: Linux-i386
    runs-on: ubuntu-latest
    # Build inside the goldsrc-net build image (debian10 / glibc-2.28 floor, gcc-multilib +
    # aarch64 cross + cmake 3.29) so the .so runs on any glibc >= 2.28 — Ubuntu runners link
    # 2.34+. Published by goldsrc-net/build-containers (its 64bit branch); pull-only.
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Let git read the checkout (the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (i386)
        run: |
          cmake -B build-i386 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain.cmake

      - name: Build (hl gamedll + client)
        run: cmake --build build-i386 --target hl client -j"$(nproc)"

      - name: Stage per-arch
        run: |
          mkdir -p staged-i386/dlls staged-i386/cl_dlls
          cp build-i386/dlls/hl.so staged-i386/dlls/hl.so
          cp build-i386/cl_dll/client.so staged-i386/cl_dlls/client.so

      - name: Build the Debug profile (workflow_dispatch with debug only)
        if: ${{ inputs.debug }}
        run: |
          cmake -B build-i386-debug -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain.cmake
          cmake --build build-i386-debug --target hl client -j"$(nproc)"
          mkdir -p staged-i386-debug/dlls staged-i386-debug/cl_dlls
          cp build-i386-debug/dlls/hl.so staged-i386-debug/dlls/hl.so
          cp build-i386-debug/cl_dll/client.so staged-i386-debug/cl_dlls/client.so

      - name: Upload the Debug profile
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: Linux-i386-debug
          path: staged-i386-debug/**
          retention-days: 7

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: Linux-i386
          path: staged-i386/**
          retention-days: 7

  # Linux amd64 — CMake. 64-bit static-links openvgui (submodule) + the vgui_support
  # shim, so the client has no vgui/SDL2 DT_NEEDED and exports InitVGUISupportAPI.
  linux-amd64:
    name: Linux-amd64
    runs-on: ubuntu-latest
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Let git read the checkout (the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (amd64)
        run: cmake -B build-amd64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (hl gamedll + client)
        run: cmake --build build-amd64 --target hl client -j"$(nproc)"

      - name: Stage per-arch
        run: |
          mkdir -p staged-amd64/dlls staged-amd64/cl_dlls
          cp build-amd64/dlls/hl.so staged-amd64/dlls/hl.so
          cp build-amd64/cl_dll/client.so staged-amd64/cl_dlls/client.so

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: Linux-amd64
          path: staged-amd64/**
          retention-days: 7

  # Linux aarch64 — CMake cross-compiled via the in-tree toolchain file.
  linux-aarch64:
    name: Linux-aarch64
    runs-on: ubuntu-latest
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Let git read the checkout (the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (aarch64 cross)
        # The image ships a gcc-8.3 aarch64 cross-toolchain; point CC/CXX at it (matches
        # scripts/build.sh) so the toolchain file picks it over the image's default clang.
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
        run: |
          cmake -B build-aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain-aarch64.cmake

      - name: Build (hl gamedll + client)
        run: cmake --build build-aarch64 --target hl client -j"$(nproc)"

      - name: Stage per-arch
        run: |
          mkdir -p staged-aarch64/dlls staged-aarch64/cl_dlls
          cp build-aarch64/dlls/hl.so staged-aarch64/dlls/hl.so
          cp build-aarch64/cl_dll/client.so staged-aarch64/cl_dlls/client.so

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: Linux-aarch64
          path: staged-aarch64/**
          retention-days: 7

  # Win32 — CMake/MSVC. 32-bit keeps dynamic Valve vgui (utils/vgui/lib/win32_vc16/vgui.lib).
  win32:
    name: Win32
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (Win32)
        run: cmake -B build-win32 -A Win32

      - name: Build (hl gamedll + client)
        run: cmake --build build-win32 --config Release --target hl client --parallel 2

      - name: Stage per-arch
        shell: bash
        run: |
          mkdir -p staged-win32/dlls staged-win32/cl_dlls
          cp build-win32/dlls/Release/hl.dll        staged-win32/dlls/hl.dll
          cp build-win32/cl_dll/Release/client.dll  staged-win32/cl_dlls/client.dll

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: Win32
          path: staged-win32/**
          retention-days: 7

      - name: Build the Debug profile (workflow_dispatch with debug only)
        if: ${{ inputs.debug }}
        shell: bash
        run: |
          cmake --build build-win32 --config Debug --target hl client --parallel 2
          mkdir -p staged-win32-debug/dlls staged-win32-debug/cl_dlls
          cp build-win32/dlls/Debug/hl.dll build-win32/dlls/Debug/hl.pdb staged-win32-debug/dlls/
          cp build-win32/cl_dll/Debug/client.dll build-win32/cl_dll/Debug/client.pdb staged-win32-debug/cl_dlls/

      - name: Upload the Debug profile
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: Win32-debug
          path: staged-win32-debug/**
          retention-days: 7

  # Win64 — CMake/MSVC. 64-bit static-links openvgui (submodule, built as part of the
  # client via VGUI_STATIC) + the vgui_support shim: no vgui.dll companion to ship, and
  # the client exports InitVGUISupportAPI. Compile+link check (no native 64-bit GoldSrc
  # engine loads the result).
  win64:
    name: Win64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (x64)
        run: cmake -B build-win64 -A x64

      - name: Build (hl gamedll + client)
        run: cmake --build build-win64 --config Release --target hl client --parallel 2

      - name: Stage per-arch
        shell: bash
        run: |
          mkdir -p staged-win64/dlls staged-win64/cl_dlls
          cp build-win64/dlls/Release/hl.dll        staged-win64/dlls/hl.dll
          cp build-win64/cl_dll/Release/client.dll  staged-win64/cl_dlls/client.dll
          cp build-win64/dlls/Release/hl.pdb        staged-win64/dlls/       2>/dev/null || true
          cp build-win64/cl_dll/Release/client.pdb  staged-win64/cl_dlls/    2>/dev/null || true

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: Win64
          path: staged-win64/**
          retention-days: 7

  # Package — fan in every build job. Two artifacts, both under TS's own file names (TS's liblist.gam
  # names dlls/mp.dll and dlls/ts_i386.so; the client is always cl_dlls/client.*):
  #  - reTS-<commit>: the patch for a stock TS 3.0 install (scripts/assemble-dropin.sh, the layout
  #    scripts/package.sh builds locally): i386 + Win32 under TS's names, plus the 64-bit builds under
  #    the names Xash builds from TS's liblist.
  #  - ts-gamelibs-all: every arch for Xash, which adds the arch to the base name from liblist
  #    (ts_amd64.so, ts_arm64.so, mp_amd64.dll, client_amd64.so, client_arm64.so, client_amd64.dll).
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [linux-i386, linux-amd64, linux-aarch64, win32, win64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: llvm-strip for the aarch64 libraries (GNU strip on x86 cannot read them)
        run: |
          ls /usr/bin/llvm-strip* >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q llvm; }
          ls /usr/bin/llvm-strip*

      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          # pick <artifact-dir> <filename> -> first matching file (robust to nesting)
          pick() {
            local f
            f=$(find "artifacts/$1" -type f -name "$2" | head -1)
            if [ -z "$f" ]; then echo "MISSING: $2 in artifact $1" >&2; exit 1; fi
            echo "$f"
          }
          # On a tag (release.yml) the version is the tag as pushed, read from the event like sitrep.ai
          # does (no tag history needed in the checkout); otherwise the short commit.
          if [ "${{ github.ref_type }}" = tag ]; then REV="${{ github.ref_name }}"; else REV=$(git rev-parse --short HEAD); fi
          scripts/assemble-dropin.sh \
            --amd64 "$(pick Linux-amd64 hl.so)" "$(pick Linux-amd64 client.so)" \
            --arm64 "$(pick Linux-aarch64 hl.so)" "$(pick Linux-aarch64 client.so)" \
            --win64 "$(pick Win64 hl.dll)" "$(pick Win64 client.dll)" \
            "$REV" \
            "$(pick Linux-i386 hl.so)" "$(pick Linux-i386 client.so)" \
            "$(pick Win32 hl.dll)" "$(pick Win32 client.dll)" dropin
          echo "REV=$REV" >> "$GITHUB_ENV"

          mkdir -p dist/dlls dist/cl_dlls
          cp "$(pick Linux-i386     hl.so)"      dist/dlls/ts.so
          cp "$(pick Linux-amd64    hl.so)"      dist/dlls/ts_amd64.so
          cp "$(pick Linux-aarch64  hl.so)"      dist/dlls/ts_arm64.so
          cp "$(pick Win32          hl.dll)"     dist/dlls/mp.dll
          cp "$(pick Win64          hl.dll)"     dist/dlls/mp_amd64.dll
          cp "$(pick Linux-i386     client.so)"  dist/cl_dlls/client.so
          cp "$(pick Linux-amd64    client.so)"  dist/cl_dlls/client_amd64.so
          cp "$(pick Linux-aarch64  client.so)"  dist/cl_dlls/client_arm64.so
          cp "$(pick Win32          client.dll)" dist/cl_dlls/client.dll
          cp "$(pick Win64          client.dll)" dist/cl_dlls/client_amd64.dll
          find dropin dist -type f | sort

      - name: Upload the TS 3.0 patch
        uses: actions/upload-artifact@v7
        with:
          name: reTS-${{ env.REV }}
          path: dropin/reTS-${{ env.REV }}/**
          retention-days: 30

      - name: Assemble the Debug package
        if: ${{ inputs.debug }}
        shell: bash
        run: |
          set -euo pipefail
          pick() { find "artifacts/$1" -type f -name "$2" | head -1; }
          scripts/assemble-dropin.sh --debug "$REV" \
            "$(pick Linux-i386-debug hl.so)" "$(pick Linux-i386-debug client.so)" \
            "$(pick Win32-debug hl.dll)" "$(pick Win32-debug client.dll)" dropin

      - name: Upload the Debug package
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: reTS-${{ env.REV }}-debug
          path: dropin/reTS-${{ env.REV }}-debug/**
          retention-days: 30

      - name: Upload the Xash libraries
        uses: actions/upload-artifact@v7
        with:
          name: ts-gamelibs-all
          path: dist/**
          retention-days: 7
